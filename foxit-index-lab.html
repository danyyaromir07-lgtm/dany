function deepObj(o){try{return o?.isIndirect?.()?o.resolve():resolve(o)}catch(_){return resolve(o)}}

function buildCompactIndex(page){const roots=refs(page),rootRes=deepPageResources(page.getObject()),F=new GrowF32(65536),I=new GrowU32(65536),R=new GrowU32(65536),streams=[],streamMap=new Map();let incomplete=false,forms=0,count=0;let pageBase=[1,0,0,1,0,0];try{pageBase=mupdf.Matrix.invert(page.getTransform())}catch(_){}const streamId=(ref,locator,isForm)=>{const k=String(ref);let id=streamMap.get(k);if(id==null){id=streams.length;streamMap.set(k,id);streams.push({ref,locator,isForm})}return id};function formFor(res,name){try{const xd=deepObj(deepObj(res)?.get?.('XObject'));if(!xd?.isDictionary?.())return null;const ref=xd.get(String(name||'').replace(/^\//,''));if(!ref?.isStream?.())return null;const dict=deepObj(ref);return deepName(dict?.get?.('Subtype'))==='Form'?{ref,dict}:null}catch(_){return null}}function scan(text,ref,res,st,depth,trail,locator,isForm){if(depth>12){incomplete=true;return}streamId(ref,locator,isForm);let i=0,args=[];const nums=k=>args.filter(x=>x.type==='num').slice(-k).map(x=>x.value),firstStart=k=>{const a=args.filter(x=>x.type==='num');return a[a.length-k]?.start??0},clear=()=>args=[];const arity={m:2,l:2,c:6,v:4,y:4,re:4},addRange=(p,a,b,rr=ref,ll=locator,ff=isForm)=>{if(!p||a<0||b<=a)return;p.ranges.push([streamId(rr,ll,ff),a,b])};while(i<text.length){const t=nextToken(text,i);if(!t)break;i=t.next;if(t.type==='num'||t.type==='name'){args.push(t);continue}if(t.type!=='op')continue;const op=t.value;if(st.path&&arity[op])addRange(st.path,firstStart(arity[op]),t.end);else if(st.path&&op==='h')addRange(st.path,t.start,t.end);if(op==='q'){st.stack.push({ctm:[...st.ctm],rgb:[...st.rgb],width:st.width});clear();continue}if(op==='Q'){const z=st.stack.pop();if(z){st.ctm=z.ctm;st.rgb=z.rgb;st.width=z.width}clear();continue}if(op==='cm'){const a=nums(6);if(a.length===6)st.ctm=mul(st.ctm,a);clear();continue}if(op==='RG'){const a=nums(3);if(a.length===3)st.rgb=a;clear();continue}if(op==='G'){const a=nums(1);if(a.length===1)st.rgb=[a[0],a[0],a[0]];clear();continue}if(op==='w'){const a=nums(1);if(a.length===1)st.width=a[0];clear();continue}const upd=(p,x,y)=>{const q=tf(st.ctm,x,y);if(!p.has){p.has=true;p.minx=p.maxx=p.fx=p.lx=q[0];p.miny=p.maxy=p.fy=p.ly=q[1]}else{p.minx=Math.min(p.minx,q[0]);p.maxx=Math.max(p.maxx,q[0]);p.miny=Math.min(p.miny,q[1]);p.maxy=Math.max(p.maxy,q[1]);p.lx=q[0];p.ly=q[1]}return q};if(op==='m'){const a=nums(2);if(a.length===2){if(!st.path)st.path={has:false,lines:0,curves:0,ranges:[],rgb:[...st.rgb],width:st.width};upd(st.path,a[0],a[1])}clear();continue}if(op==='re'){const a=nums(4);if(a.length===4){if(!st.path)st.path={has:false,lines:0,curves:0,ranges:[],rgb:[...st.rgb],width:st.width};upd(st.path,a[0],a[1]);upd(st.path,a[0]+a[2],a[1]);upd(st.path,a[0]+a[2],a[1]+a[3]);upd(st.path,a[0],a[1]+a[3]);st.path.lines+=3}clear();continue}if(st.path&&op==='l'){const a=nums(2);if(a.length===2){upd(st.path,a[0],a[1]);st.path.lines++}clear();continue}if(st.path&&op==='c'){const a=nums(6);if(a.length===6){upd(st.path,a[0],a[1]);upd(st.path,a[2],a[3]);upd(st.path,a[4],a[5]);st.path.curves++}clear();continue}if(st.path&&op==='v'){const a=nums(4);if(a.length===4){upd(st.path,a[0],a[1]);upd(st.path,a[2],a[3]);st.path.curves++}clear();continue}if(st.path&&op==='y'){const a=nums(4);if(a.length===4){upd(st.path,a[0],a[1]);upd(st.path,a[2],a[3]);st.path.curves++}clear();continue}if(op==='h'){clear();continue}if(['S','s','B','B*','b','b*'].includes(op)){const p=st.path;if(p)addRange(p,t.start,t.end);st.path=null;if(p&&p.has&&(p.lines+p.curves)){const ri=R.n/3;for(const rr of p.ranges)R.push(rr[0],rr[1],rr[2]);F.push(p.minx,p.miny,p.maxx,p.maxy,p.fx,p.fy,p.lx,p.ly,p.width,p.rgb[0]||0,p.rgb[1]||0,p.rgb[2]||0);I.push(p.lines,p.curves,ri,p.ranges.length);count++}clear();continue}if(['n','f','F','f*'].includes(op)){st.path=null;clear();continue}if(op==='Do'){const nt=[...args].reverse().find(x=>x.type==='name'),form=formFor(res,nt?.value||'');if(form){const fk=String(form.ref);if(trail.includes(fk))incomplete=t function collectVisual(page){const a=[];let dev=null;try{dev=new mupdf.Device({strokePath(path,stroke,ctm,cs,color){let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity,fx=0,fy=0,lx=0,ly=0,has=false,lines=0,curves=0;const add=(x,y)=>{const q=tf(ctm,x,y);if(!has){has=true;fx=lx=q[0];fy=ly=q[1]}else{lx=q[0];ly=q[1]}minx=Math.min(minx,q[0]);miny=Math.min(miny,q[1]);maxx=Math.max(maxx,q[0]);maxy=Math.max(maxy,q[1])};path.walk({moveTo:add,lineTo(x,y){add(x,y);lines++},curveTo(x1,y1,x2,y2,x3,y3){add(x1,y1);add(x2,y2);add(x3,y3);curves++},closePath(){}});if(has&&(lines+curves)){const rgb=Array.isArray(color)?color:[0,0,0];a.push({bbox:[minx,miny,maxx,maxy],first:[fx,fy],last:[lx,ly],lines,curves,segs:lines+curves,width:Number(stroke?.lineWidth||0),rgb:rgb.slice(0,3).map(Number)})}}});page.run(dev,mupdf.Matrix.identity)}finally{try{dev?.close?.()}catch(_){}try{dev?.destroy?.()}catch(_){}}return a}
function cost(v,idx,k){const o=k*12,F=idx.F,pd=Math.max(1,Math.hypot(idx.bounds[2]-idx.bounds[0],idx.bounds[3]-idx.bounds[1])),vcx=(v.bbox[0]+v.bbox[2])/2,vcy=(v.bbox[1]+v.bbox[3])/2,scx=(F[o]+F[o+2])/2,scy=(F[o+1]+F[o+3])/2,center=Math.hypot(vcx-scx,vcy-scy)/pd,size=(Math.abs((v.bbox[2]-v.bbox[0])-(F[o+2]-F[o]))+Math.abs((v.bbox[3]-v.bbox[1])-(F[o+3]-F[o+1])))/pd,ep=Math.min(Math.hypot(F[o+4]-v.first[0],F[o+5]-v.first[1])+Math.hypot(F[o+6]-v.last[0],F[o+7]-v.last[1]),Math.hypot(F[o+4]-v.last[0],F[o+5]-v.last[1])+Math.hypot(F[o+6]-v.first[0],F[o+7]-v.first[1]))/(2*pd),lines=idx.I[k*4],curves=idx.I[k*4+1],seg=Math.abs((lines+curves)-v.segs)/Math.max(1,lines+curves,v.segs),topo=((curves>0)!==(v.curves>0)?1:0)+((lines>0)!==(v.lines>0)?1:0),width=Math.abs(F[o+8]-v.width)/Math.max(.1,Math.abs(v.width),Math.abs(F[o+8])),cd=Math.hypot(F[o+9]-(v.rgb[0]||0),F[o+10]-(v.rgb[1]||0),F[o+11]-(v.rgb[2]||0));return center*4+size*2+ep*3+seg+topo+Math.min(2,width)*.2+Math.min(2,cd/.1)*.1}
function mapSelected(vs,idx,ords){if(vs.length===idx.count){let ok=true;const step=Math.max(1,Math.floor(vs.length/97));for(let i=0;i<vs.length;i+=step)if(cost(vs[i],idx,i)>.015){ok=false;break}if(ok)return{ids:ords.slice(),mode:'ordinal-verificado'}}const used=new Set(),ids=[];for(const oi of ords){const v=vs[oi],b=idx.bounds,w=Math.max(1,b[2]-b[0]),h=Math.max(1,b[3]-b[1]),cx=(v.bbox[0]+v.bbox[2])/2,cy=(v.bbox[1]+v.bbox[3])/2,gx=Math.max(0,Math.min(idx.GX-1,Math.floor((cx-b[0])/w*idx.GX))),gy=Math.max(0,Math.min(idx.GY-1,Math.floor((cy-b[1])/h*idx.GY)));let best=-1,bc=Infinity,second=Infinity;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=gx+dx,y=gy+dy;if(x<0||y<0||x>=idx.GX||y>=idx.GY)continue;for(let k=idx.head[y*idx.GX+x];k>=0;k=idx.next[k]){if(used.has(k))continue;const c=cost(v,idx,k);if(c<bc){second=bc;bc=c;best=k}else if(c<second)second=c}}if(best<0||bc>.03||(Number.isFinite(second)&&second-bc<.002))return{ids:[],mode:'ambiguo',at:oi,best:bc,second};used.add(best);ids.push(best)}return{ids,mode:'espacial-1:1'}}
let doc,page,visual,index;async function loadBytes(bytes,name='PDF'){doc?.destroy?.();doc=mupdf.PDFDocument.openDocument(bytes,'application/pdf');page=doc.loadPage(0);const t0=performance.now();visual=collectVisual(page);const t1=performance.now();index=buildCompactIndex(page);const t2=performance.now();window.__lab={visual:visual.length,index:index.count,visualMs:Math.round(t1-t0),indexMs:Math.round(t2-t1),totalMs:Math.round(t2-t0),incomplete:index.incomplete,forms:index.forms,streams:index.streams.length};out.textContent=JSON.stringify({name,...window.__lab},null,2);test.disabled=index.incomplete||!visual.length;document.body.dataset.done='1'}
f.onchange=async()=>{const file=f.files[0];if(file)await loadBytes(new Uint8Array(await file.arrayBuffer()),file.name)};test.onclick=()=>{const ords=[];for(let i=0;i<Math.min(64,visual.length);i++)ords.push(i);const t=performance.now(),m=mapSelected(visual,index,ords);window.__lab.map=m;window.__lab.mapMs=Math.round((performance.now()-t)*1000)/1000;out.textContent=JSON.stringify(window.__lab,null,2)};
