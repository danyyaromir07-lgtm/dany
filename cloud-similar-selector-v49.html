<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selector de nubes v49</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f0f10}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="./cloud-similar-selector-v49-core.html?v=20260902-hqpreview1" allow="fullscreen"></iframe><script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow,d=w.document,top=d.querySelector('.top');
    if(!top)return;
    let badge=d.getElementById('activeFileName');
    if(!badge){
      badge=d.createElement('span');badge.id='activeFileName';badge.className='mode';
      badge.style.maxWidth='420px';badge.style.overflow='hidden';badge.style.textOverflow='ellipsis';badge.style.display='inline-block';badge.style.verticalAlign='middle';
      badge.textContent='Archivo: —';top.appendChild(badge);
    }
    const setName=name=>{const n=String(name||'—');badge.textContent='Archivo: '+n;badge.title=n};
    d.addEventListener('change',e=>{const f=e.target&&e.target.files&&e.target.files[0];if(f&&f.name)setName(f.name)},true);
    try{
      const pick=w.showOpenFilePicker&&w.showOpenFilePicker.bind(w);
      if(pick&&!w.__pdfForgeFileNameWrapped){
        w.__pdfForgeFileNameWrapped=true;
        w.showOpenFilePicker=async(...args)=>{const hs=await pick(...args);if(hs&&hs[0]&&hs[0].name)setName(hs[0].name);return hs};
      }
    }catch(_){}
  }catch(e){console.error('v49 filename badge',e)}
});
</script></body></html>
