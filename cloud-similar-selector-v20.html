<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selector de nubes v20</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="./cloud-similar-selector-v17.html?v=20260901-clickoverlay1"></iframe><script>
const frame=document.getElementById('app');let lastClick=null,lastSelection=null;
function waitForApp(){const d=frame.contentDocument;if(!d||!d.querySelector('#overlay')||!d.querySelector('#detail')){setTimeout(waitForApp,80);return}install(d)}
function isRedFamily(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),ch=mx-mn;if(r<120||ch<28)return false;const sat=ch/Math.max(1,mx),redLead=r-Math.max(g,b);return sat>.13&&redLead>14&&r>g*1.055&&r>b*1.045}
function compatible(r,g,b,sr,sg,sb){if(!isRedFamily(r,g,b))return false;const sum=Math.max(1,r+g+b),ss=Math.max(1,sr+sg+sb),nr=[r/sum,g/sum,b/sum],ns=[sr/ss,sg/ss,sb/ss];const chromaDist=Math.hypot(nr[0]-ns[0],nr[1]-ns[1],nr[2]-ns[2]);const lead=Math.min(r-g,r-b),seedLead=Math.min(sr-sg,sr-sb),leadRatio=lead/Math.max(20,seedLead);return chromaDist<=.115&&leadRatio>=.42&&leadRatio<=2.6}
function selectLocal(d,clientX,clientY){const detail=d.querySelector('#detail'),overlay=d.querySelector('#overlay'),viewport=d.querySelector('#viewport'),status=d.querySelector('#status'),del=d.querySelector('#delete');if(!detail||detail.style.display==='none'||!detail.src||!detail.naturalWidth){status.textContent='Primero pulsa «Actualizar nitidez visible» y luego haz clic sobre un arco.';return}const dr=detail.getBoundingClientRect(),vr=viewport.getBoundingClientRect();if(clientX<dr.left||clientX>dr.right||clientY<dr.top||clientY>dr.bottom){status.textContent='El clic quedó fuera del tile nítido. Actualiza la nitidez en esta zona y vuelve a clicar.';return}const nw=detail.naturalWidth,nh=detail.naturalHeight,ix=(clientX-dr.left)*nw/dr.width,iy=(clientY-dr.top)*nh/dr.height,half=300,sx=Math.max(0,Math.floor(ix-half)),sy=Math.max(0,Math.floor(iy-half)),ex=Math.min(nw,Math.ceil(ix+half)),ey=Math.min(nh,Math.ceil(iy+half)),w=ex-sx,h=ey-sy;if(w<8||h<8)return;const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(detail,sx,sy,w,h,0,0,w,h);let data;try{data=cx.getImageData(0,0,w,h).data}catch(e){status.textContent='No pude leer el tile: '+e.message;return}const lx=Math.round(ix-sx),ly=Math.round(iy-sy),srch=72;let seed=-1,best=1e9,sr=0,sg=0,sb=0;for(let y=Math.max(0,ly-srch);y<=Math.min(h-1,ly+srch);y++)for(let x=Math.max(0,lx-srch);x<=Math.min(w-1,lx+srch);x++){const p=y*w+x,i=p*4,r=data[i],g=data[i+1],b=data[i+2];if(!isRedFamily(r,g,b))continue;const dd=(x-lx)*(x-lx)+(y-ly)*(y-ly);if(dd<best){best=dd;seed=p;sr=r;sg=g;sb=b}}if(seed<0){status.textContent='No encontré un trazo rojo suficientemente cerca. Haz clic exactamente sobre el contorno de la nube.';return}const n=w*h,mask=new Uint8Array(n),near=new Uint8Array(n);for(let p=0,i=0;p<n;p++,i+=4)if(compatible(data[i],data[i+1],data[i+2],sr,sg,sb))mask[p]=1;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const p=y*w+x;if(!mask[p])continue;for(let yy=y-1;yy<=y+1;yy++)for(let xx=x-1;xx<=x+1;xx++)near[yy*w+xx]=1}const q=new Int32Array(n),seen=new Uint8Array(n);let qh=0,qt=0;q[qt++]=seed;seen[seed]=1,minx=w,miny=h,maxx=0,maxy=0,orig=0,maxR2=0;const seedY=(seed/w)|0,seedX=seed-seedY*w,limitR=245,limitR2=limitR*limitR;while(qh<qt){const p=q[qh++],y=(p/w)|0,x=p-y*w,dx=x-seedX,dy=y-seedY,rr=dx*dx+dy*dy;if(rr>limitR2)continue;if(mask[p]){orig++;maxR2=Math.max(maxR2,rr);if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y}for(let yy=Math.max(0,y-1);yy<=Math.min(h-1,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(w-1,x+1);xx++){const np=yy*w+xx;if(!seen[np]&&near[np]){seen[np]=1;q[qt++]=np}}}if(orig<20){status.textContent=`Solo encontré ${orig} px compatibles; la semilla cayó en un fragmento demasiado pequeño. Prueba sobre el centro de otro arco de la nube.`;return}const bw=maxx-minx+1,bh=maxy-miny+1,area=bw*bh,aspect=Math.max(bw,bh)/Math.max(1,Math.min(bw,bh));if(bw>320||bh>320||area>w*h*.30||Math.sqrt(maxR2)>238||aspect>5.5){status.textContent=`La selección intentó extenderse fuera de una nube (${bw}×${bh}, aspecto ${aspect.toFixed(1)}); la descarté.`;return}const sel=document.createElement('canvas');sel.width=w;sel.height=h;const sc=sel.getContext('2d'),im=sc.createImageData(w,h);for(let p=0,i=0;p<n;p++,i+=4){if(seen[p]&&mask[p]){im.data[i]=0;im.data[i+1]=155;im.data[i+2]=255;im.data[i+3]=230}}sc.putImageData(im,0,0);const dpr=Number(overlay.dataset.dpr||1),oc=overlay.getContext('2d');oc.save();oc.setTransform(dpr,0,0,dpr,0,0);const destX=dr.left-vr.left+(sx/nw)*dr.width,destY=dr.top-vr.top+(sy/nh)*dr.height,destW=w/nw*dr.width,destH=h/nh*dr.height;oc.drawImage(sel,destX,destY,destW,destH);oc.restore();lastSelection={pixels:orig,bbox:[minx,miny,maxx,maxy],seedRGB:[sr,sg,sb],screen:[clientX,clientY]};if(del)del.disabled=true;status.textContent=`Arco/nube visual seleccionado · ${orig} px · bbox ${bw}×${bh} · semilla rgb(${sr},${sg},${sb}) · filtro v20 cromático adaptativo. Eliminar sigue bloqueado hasta mapeo estructural seguro.`}
function install(d){const overlay=d.querySelector('#overlay'),select=d.querySelector('#select'),status=d.querySelector('#status');if(overlay.dataset.v20Installed)return;overlay.dataset.v20Installed='1';overlay.addEventListener('click',e=>{lastClick={x:e.clientX,y:e.clientY};setTimeout(()=>selectLocal(d,e.clientX,e.clientY),0)});if(select)select.addEventListener('click',()=>{if(lastClick)selectLocal(d,lastClick.x,lastClick.y);else status.textContent='Haz clic directamente sobre un arco.'});status.textContent='v20 · selección local adaptativa para antialiasing rojo, con límites geométricos.'}
frame.addEventListener('load',()=>setTimeout(waitForApp,100));setTimeout(waitForApp,300);
</script></body></html>
