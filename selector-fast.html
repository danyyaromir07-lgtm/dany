<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selector de nubes · interfaz compacta</title><style>
:root{color-scheme:dark;--bg:#07111d;--panel:#0b1724;--line:#21384f;--blue:#2386f5;--text:#eef5fc;--muted:#8ea5ba}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{position:relative;display:grid;grid-template-columns:270px minmax(0,1fr);width:100%;height:100%;transition:grid-template-columns .18s ease}.side{min-width:0;background:linear-gradient(180deg,#0b1826,#08131f);border-right:1px solid var(--line);display:grid;grid-template-rows:auto auto auto 1fr;gap:6px;padding:8px;overflow:hidden}.side h1{font-size:14px;margin:1px 2px 2px;color:#cfe0f0}.toolbar{display:grid;grid-template-columns:1fr 34px 34px;gap:5px}.toolbar button,.side input{font:inherit;height:34px;border-radius:7px}.toolbar button{padding:0 8px;border:1px solid #29435d;background:#112338;color:#e9f2fb;font-weight:700}.toolbar button:first-child{border-color:#2d8ef9;background:linear-gradient(180deg,#238afc,#136bd8);color:white}.toolbar button:disabled{opacity:.38}.side input{width:100%;padding:0 9px;background:#091522;color:#eaf3fb;border:1px solid #243d56;outline:none}.side input:focus{border-color:#2f8cff}.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10.5px;padding:0 2px}.list{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px;padding-right:2px}.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:#526273;border-radius:8px}.fileRow{width:100%;border:1px solid #172e44;background:#0e1e2e;color:#eee;border-radius:7px;padding:7px 7px;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;cursor:pointer}.fileRow:hover{border-color:#315675;background:#12273b}.fileRow.active{border-color:#2f8cff;background:#11345e;box-shadow:inset 3px 0 #2f8cff}.fileInfo{min-width:0;display:grid;gap:2px}.fileName{font-size:11.5px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fileMeta{font-size:9.5px;color:#82a0bb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fileState{font-size:9px;color:#9eb0c0;white-space:nowrap;padding:3px 5px;border-radius:5px;background:#172a3c}.fileState.saved{color:#49dd84;background:#103521}.fileState.dirty{color:#ffc34a;background:#382b10}.fileState.activeState{color:#79b8ff;background:#12376a}.fileState.discarded{color:#ff969e;background:#3a1c22}.viewer{min-width:0;min-height:0;background:#08111d}.viewer iframe{border:0;width:100%;height:100%;display:block}.hint{color:#8ba1b5}.batchToggle{position:absolute;z-index:50;left:258px;top:10px;width:25px;height:31px;border:1px solid #29445f;border-radius:0 7px 7px 0;background:#102337;color:#a9c1d7;cursor:pointer;transition:left .18s ease,background .15s}.batchToggle:hover{background:#17324c;color:white}.shell.batchCollapsed{grid-template-columns:0 minmax(0,1fr)}.shell.batchCollapsed .side{visibility:hidden}.shell.batchCollapsed .batchToggle{left:0;width:34px;border-radius:0 7px 7px 0}.shell.batchCollapsed .batchToggle::after{content:'☰'}.shell.batchCollapsed .batchToggle span{display:none}@media(max-width:1000px){.shell{grid-template-columns:235px minmax(0,1fr)}.batchToggle{left:223px}}@media(max-width:720px){.shell{grid-template-columns:0 minmax(0,1fr)}.side{visibility:hidden}.batchToggle{left:0;width:34px}.batchToggle span{display:none}.batchToggle::after{content:'☰'}}
</style></head><body><div class="shell" id="shell"><aside class="side"><h1>PDFs</h1><div class="toolbar"><button id="batch" type="button">Abrir lote</button><button id="prev" type="button" disabled title="PDF anterior">←</button><button id="next" type="button" disabled title="PDF siguiente">→</button></div><input id="search" type="search" placeholder="Buscar archivo…"><div class="meta"><span id="count">0 / 0</span><span class="hint">Solo 1 PDF en memoria</span></div><div id="fileList" class="list"></div></aside><button id="batchToggle" class="batchToggle" type="button" title="Plegar/mostrar lote"><span>‹</span></button><main class="viewer"><iframe id="app" src="./selector-nubes-multistream-core.html?v=20260903-compact1" allow="fullscreen"></iframe></main></div><script>
const shell=document.getElementById('shell'),toggleBtn=document.getElementById('batchToggle'),frame=document.getElementById('app'),listEl=document.getElementById('fileList'),countEl=document.getElementById('count'),searchEl=document.getElementById('search'),batchBtn=document.getElementById('batch'),prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next');
let entries=[],activeIndex=-1,queuedHandle=null,child=null,childDoc=null,saveObserver=null,nativeChildPicker=null,switchSerial=0;const mupdfMetaPromise=import('https://cdn.jsdelivr.net/npm/mupdf@1.28.0/dist/mupdf.js');const fmtBytes=n=>{if(!Number.isFinite(n))return'—';const u=['B','KB','MB','GB'];let i=0,v=n;while(v>=1024&&i<u.length-1){v/=1024;i++}return(v>=100||i===0?Math.round(v):v.toFixed(1))+' '+u[i]};
function stateClass(state){if(state==='Guardado')return'saved';if(state==='Modificado'||state==='Guardando…')return'dirty';if(state==='Activo'||state==='Cargando…')return'activeState';if(state==='Descartado')return'discarded';return''}
function renderList(){const q=searchEl.value.trim().toLowerCase();listEl.textContent='';entries.forEach((entry,i)=>{if(q&&!entry.name.toLowerCase().includes(q))return;const row=document.createElement('button');row.type='button';row.className='fileRow'+(i===activeIndex?' active':'');row.title=entry.name;const info=document.createElement('span');info.className='fileInfo';const name=document.createElement('span');name.className='fileName';name.textContent=entry.name;const meta=document.createElement('span');meta.className='fileMeta';meta.textContent=(entry.pages==null?'… páginas':entry.pages+' página'+(entry.pages===1?'':'s'))+' · '+fmtBytes(entry.size);info.append(name,meta);const state=document.createElement('span');state.className='fileState '+stateClass(entry.state);state.textContent=entry.state;row.append(info,state);row.addEventListener('click',()=>activate(i));listEl.appendChild(row)});countEl.textContent=entries.length?(activeIndex>=0?(activeIndex+1)+' / '+entries.length:'0 / '+entries.length):'0 / 0';prevBtn.disabled=activeIndex<=0;nextBtn.disabled=activeIndex<0||activeIndex>=entries.length-1}
function setEntryState(i,state){if(i<0||!entries[i])return;entries[i].state=state;renderList()}
function setChildFileName(name){if(!childDoc)return;let badge=childDoc.getElementById('activeFileName');const top=childDoc.querySelector('.top');if(!top)return;if(!badge){badge=childDoc.createElement('span');badge.id='activeFileName';badge.className='mode';top.appendChild(badge)}const n=String(name||'—');badge.textContent='Archivo: '+n;badge.title=n}
function hasUnsaved(){const b=childDoc&&childDoc.querySelector('#save');return!!(b&&!b.disabled)}
function injectCompactChildUI(){if(!childDoc||childDoc.getElementById('host-compact-ui'))return;const st=childDoc.createElement('style');st.id='host-compact-ui';st.textContent=`.top{height:52px!important;padding:6px 9px!important;gap:6px!important}.top button{height:36px!important;padding:0 10px!important;border-radius:7px!important;font-size:12px!important}.sep{height:30px!important}.zoomBox{padding:3px 5px!important;border-radius:7px!important;gap:4px!important}.zoomBox button{height:28px!important;padding:0 8px!important}.zoomBox input{width:105px!important}.zoomPct{width:46px!important;font-size:11px!important}.mode{padding:7px 8px!important;max-width:185px!important;font-size:10.5px!important}.main{inset:52px 0 0!important;padding:8px!important;gap:8px!important}.viewport{border-radius:8px!important}.bottomDock{grid-template-columns:minmax(0,1fr) 265px!important;gap:8px!important;min-height:78px!important}.selectionCard{padding:9px 12px!important;gap:10px!important;border-radius:8px!important}.selectionGlyph{width:34px!important;height:34px!important;font-size:16px!important}.selectionTitle{font-size:13px!important;margin-bottom:2px!important}.status{font-size:11px!important;line-height:1.25!important}.readyBadge{min-width:145px!important;padding:8px 10px!important;border-radius:7px!important;font-size:10.5px!important}.helpCard{padding:8px 10px!important;border-radius:8px!important;font-size:10.5px!important}.helpTitle{margin-bottom:4px!important}.helpRow{margin:3px 0!important}.key{padding:2px 5px!important}.security{margin-top:5px!important;padding-top:5px!important}@media(max-width:1150px){.helpCard{display:none!important}.bottomDock{grid-template-columns:1fr!important}.mode{display:none!important}}`;childDoc.head.appendChild(st)}
function installChildHooks(){child=frame.contentWindow;childDoc=child.document;const top=childDoc.querySelector('.top');if(!top)return;injectCompactChildUI();setChildFileName(activeIndex>=0?entries[activeIndex].name:'—');nativeChildPicker=child.showOpenFilePicker&&child.showOpenFilePicker.bind(child);if(nativeChildPicker){const intercept=async(...args)=>{if(queuedHandle){const h=queuedHandle;queuedHandle=null;return[h]}return nativeChildPicker(...args)};try{child.showOpenFilePicker=intercept}catch(_){try{Object.defineProperty(child,'showOpenFilePicker',{configurable:true,writable:true,value:intercept})}catch(__){}}}const save=childDoc.querySelector('#save');if(save){save.addEventListener('click',()=>{if(activeIndex>=0&&!save.disabled)setEntryState(activeIndex,'Guardando…')},true);saveObserver?.disconnect();saveObserver=new MutationObserver(()=>{if(activeIndex<0)return;if(save.disabled&&entries[activeIndex]?.state==='Guardando…')setEntryState(activeIndex,'Guardado');else if(!save.disabled&&entries[activeIndex]?.state!=='Guardando…')setEntryState(activeIndex,'Modificado')});saveObserver.observe(save,{attributes:true,attributeFilter:['disabled']})}}
async function activate(i){if(i<0||i>=entries.length||i===activeIndex||!childDoc)return;if(activeIndex>=0&&hasUnsaved()){const old=entries[activeIndex];const ok=confirm('Hay cambios sin guardar en “'+old.name+'”.\n\nSi cambias de PDF ahora, esos cambios se descartarán.\n\n¿Continuar?');if(!ok)return;old.state='Descartado'}else if(activeIndex>=0&&entries[activeIndex].state==='Activo'){entries[activeIndex].state='Revisado'}const serial=++switchSerial;activeIndex=i;entries[i].state='Cargando…';queuedHandle=entries[i].handle;setChildFileName(entries[i].name);renderList();const open=childDoc.querySelector('#open');if(!open){entries[i].state='Error';renderList();return}open.click();setTimeout(()=>{if(serial!==switchSerial||activeIndex!==i)return;if(queuedHandle){queuedHandle=null;entries[i].state='Error';renderList();return}if(entries[i].state==='Cargando…')entries[i].state=hasUnsaved()?'Modificado':'Activo';renderList();hydrateActivePageCount(i)},900)}
async function loadBatch(){if(!window.showOpenFilePicker){alert('La carga por lote con guardado directo requiere un navegador compatible con File System Access API (por ejemplo Chrome o Edge).');return}if(activeIndex>=0&&hasUnsaved()){const ok=confirm('Hay cambios sin guardar en el PDF activo. ¿Descartarlos y cargar un lote nuevo?');if(!ok)return}try{const handles=await window.showOpenFilePicker({multiple:true,types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]});if(!handles?.length)return;entries=handles.map(h=>({handle:h,name:h.name||'PDF sin nombre',state:'Sin abrir',size:null,pages:null}));activeIndex=-1;queuedHandle=null;searchEl.value='';renderList();await activate(0);hydrateMetadata()}catch(e){if(e&&e.name!=='AbortError')alert('No pude cargar el lote: '+(e.message||e))}}
async function hydrateMetadata(){for(let i=0;i<entries.length;i++){const e=entries[i];try{const f=await e.handle.getFile();e.size=f.size}catch(_){}if((i%8)===7)await new Promise(r=>setTimeout(r,0));renderList()}}
async function hydrateActivePageCount(i){if(i<0||!entries[i]||entries[i].pages!=null)return;const run=async()=>{if(i!==activeIndex||!entries[i]||entries[i].pages!=null)return;let mupdf=null,d=null;try{mupdf=await mupdfMetaPromise;const f=await entries[i].handle.getFile(),bytes=new Uint8Array(await f.arrayBuffer());d=mupdf.PDFDocument.openDocument(bytes,'application/pdf');entries[i].pages=Number(d.countPages?.()||0)}catch(_){}finally{try{d?.destroy?.()}catch(_){}renderList()}};if('requestIdleCallback'in window)requestIdleCallback(run,{timeout:2500});else setTimeout(run,1200)}
toggleBtn.addEventListener('click',()=>{shell.classList.toggle('batchCollapsed');toggleBtn.querySelector('span').textContent=shell.classList.contains('batchCollapsed')?'':'‹'});batchBtn.addEventListener('click',loadBatch);searchEl.addEventListener('input',renderList);prevBtn.addEventListener('click',()=>activate(activeIndex-1));nextBtn.addEventListener('click',()=>activate(activeIndex+1));frame.addEventListener('load',()=>{try{installChildHooks()}catch(e){console.error('compact batch hooks',e)}});window.addEventListener('beforeunload',e=>{if(hasUnsaved()){e.preventDefault();e.returnValue=''}});renderList();
</script></body></html>
