<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selector de nubes · borrado exacto rápido</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;font:14px system-ui}.shell{position:relative;width:100%;height:100%}.frame{border:0;width:100%;height:100%;display:block}.batch{position:fixed;z-index:9999;top:14px;left:14px;height:44px;padding:0 16px;border:1px solid #2f8cff;border-radius:9px;background:linear-gradient(180deg,#2185fa,#1469d8);color:white;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.28);cursor:pointer}.batch:active{transform:translateY(1px)}</style></head><body><div class="shell"><button id="openBatch" class="batch" type="button">Abrir lote</button><iframe id="app" class="frame" src="./selector-fast-inner.html?v=20260903-batch-visible1" allow="fullscreen"></iframe></div><script>const frame=document.getElementById('app'),btn=document.getElementById('openBatch');function triggerBatch(){try{const d=frame.contentDocument;const b=d&&d.getElementById('batch');if(!b)throw new Error('El selector de lote todavía no está listo.');b.click()}catch(e){alert(e.message||String(e))}}btn.addEventListener('click',triggerBatch);frame.addEventListener('load',()=>{try{const d=frame.contentDocument;const b=d&&d.getElementById('batch');if(b)b.textContent='Abrir lote'}catch(_){}});</script></body></html>
