<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDF Tools</title>
</head>
<body>
  <p id="boot" style="font-family:system-ui;padding:20px">Cargando PDF Tools…</p>
  <script>
  (async()=>{
    const boot=document.getElementById('boot');
    try{
      const response=await fetch('./index-shell-v10.html?v=20260821-shell-direct1',{cache:'no-store'});
      if(!response.ok)throw new Error('No se pudo cargar la aplicación: '+response.status);
      let html=await response.text();
      const marker='<script type="importmap">'+JSON.stringify({imports:{
        './revision-cloud-manual-force-v2.js?v=20260818-curvedgray2':'./revision-cloud-manual-force-v16.js?v=20260821-additive1',
        './revision-cloud-multicloud-v1.js?v=20260815-multicloud1':'./revision-cloud-multicloud-v3.js?v=20260821-additive1',
        './revision-cloud-stream-removal-v4.js?v=20260815-cloudstream-multi2':'./revision-cloud-stream-removal-v4.js?v=20260820-batchcloud1',
        './revision-cloud-manual-multicloud-v4.js?v=20260817-smalldensity1':'./revision-cloud-manual-multicloud-v4.js?v=20260819-manualfuse2',
        './text-pdf-search-fallback-v1.js?v=20260813-text-fallback1':'./text-pdf-search-fallback-v2-diagnostic.js?v=20260821-route-diagnostic1',
        './text-editor-v65.js?v=20260816-previewtext1':'./text-editor-v69-diagnostic.js?v=20260821-direct-error2',
        './text-editor-v65.js?v=20260819-heavyflate-base1':'./text-editor-v69-diagnostic.js?v=20260821-direct-error2',
        './text-editor-v67.js?v=20260821-pdfnull1':'./text-editor-v69-diagnostic.js?v=20260821-direct-error2',
        './batch-apply-fallback.js?v=20260819-loaderboundary3':'./batch-apply-fallback.js?v=20260821-explicitv68-loader3',
        './analysis-completion-coordinator-v1.js?v=20260817-completion2':'./analysis-completion-coordinator-v2.js?v=20260821-additive1'
      }})+'</'+'script>';
      const signatureOld='signature-tools-v4.js?v=20260819-commentsafe2';
      const signatureNew='signature-tools-v5.js?v=20260819-signaturesingle5';
      if(!html.includes('</head>'))throw new Error('No encontré </head> en la aplicación base.');
      if(!html.includes(signatureOld))throw new Error('No encontré el módulo de firmas esperado en la aplicación base.');
      html=html.replace('</head>',marker+'</head>');
      html=html.replace(signatureOld,signatureNew);
      html=html.replaceAll('batch-apply-fallback.js?v=20260819-loaderboundary3','batch-apply-fallback.js?v=20260821-shell-direct1');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      boot.textContent='ERROR AL CARGAR PDF TOOLS: '+(error?.message||String(error));
    }
  })();
  </script>
</body>
</html>
