<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDF Tools</title>
</head>
<body>
  <p id="boot" style="font-family:system-ui;padding:20px">Cargando PDF Tools…</p>
  <script>
  (async()=>{
    const boot=document.getElementById('boot');
    try{
      const response=await fetch('./index-shell-v10.html?v=20260819-v10-recovery-shell1',{cache:'no-store'});
      if(!response.ok)throw new Error('No se pudo cargar la aplicación: '+response.status);
      let html=await response.text();
      const marker='<script type="importmap">'+JSON.stringify({imports:{
        './revision-cloud-manual-force-v2.js?v=20260818-curvedgray2':'./revision-cloud-manual-force-v10.js?v=20260819-density50-recovery2',
        './text-editor-heavy-flate-v2.js?v=20260819-heavyflate1':'./text-editor-heavy-flate-v6-safe-decline-fallback.js?v=20260826-safedecline1',
        './text-editor-heavy-flate-v3.js?v=20260822-type0struct1':'./text-editor-heavy-flate-v6-safe-decline-fallback.js?v=20260826-safedecline1',
        './text-editor-v65.js?v=20260821-textonly-base2':'./text-editor-v65-safe-delimiters-v2-large-stream.js?v=20260826-largestream1'
      }})+'</'+'script>';
      const heavyAnalysisGuard='<script type="module" src="./batch-analysis-heavy-guard-v3-flate.js?v=20260904-flate-analysis3"></'+'script>';
      const heavyCapture='<script type="module" src="./batch-analysis-heavy-capture-v1.js?v=20260904-heavy-capture1"></'+'script>';
      const signatureOld='signature-tools-v4.js?v=20260819-commentsafe2';
      const signatureNew='signature-tools-v5.js?v=20260819-signaturesingle5';
      const flexOld='flex-text-analysis-v1.js?v=20260813-flextext2';
      const flexNew='flex-text-analysis-v1.js?v=20260904-heavy-skip1';
      const linesOld='batch-result-lines-v1.js?v=20260817-cloudresultstate1';
      const linesNew='batch-result-lines-v1.js?v=20260904-heavy-skip1';
      if(!html.includes('</head>'))throw new Error('No encontré </head> en la aplicación base.');
      if(!html.includes(signatureOld))throw new Error('No encontré el módulo de firmas esperado en la aplicación base.');
      if(!html.includes(flexOld))throw new Error('No encontré el reconciliador flexible esperado en la aplicación base.');
      if(!html.includes(linesOld))throw new Error('No encontré el formateador de resultados esperado en la aplicación base.');
      html=html.replace('</head>',marker+heavyAnalysisGuard+heavyCapture+'</head>');
      html=html.replace(signatureOld,signatureNew);
      html=html.replace(flexOld,flexNew);
      html=html.replace(linesOld,linesNew);
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      boot.textContent='ERROR AL CARGAR PDF TOOLS: '+(error?.message||String(error));
    }
  })();
  </script>
</body>
</html>
