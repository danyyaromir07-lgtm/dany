<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDF Tools</title>
</head>
<body>
  <p id="boot" style="font-family:system-ui;padding:20px">Cargando PDF Tools…</p>
  <script>
  (async()=>{
    const boot=document.getElementById('boot');
    try{
      const response=await fetch('./index-shell-v10.html?v=20260819-v10-recovery-shell1',{cache:'no-store'});
      if(!response.ok)throw new Error('No se pudo cargar la aplicación: '+response.status);
      let html=await response.text();
      const marker='<script type="importmap">'+JSON.stringify({imports:{'./revision-cloud-manual-force-v2.js?v=20260818-curvedgray2':'./revision-cloud-manual-force-v10.js?v=20260819-density50-recovery2'}})+'</'+'script><script type="module" src="./signature-indirect-annots-fix-v1.js?v=20260819-signature-indirect1"></'+'script>';
      if(!html.includes('</head>'))throw new Error('No encontré </head> en la aplicación base.');
      html=html.replace('</head>',marker+'</head>');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      boot.textContent='ERROR AL CARGAR PDF TOOLS: '+(error?.message||String(error));
    }
  })();
  </script>
</body>
</html>
