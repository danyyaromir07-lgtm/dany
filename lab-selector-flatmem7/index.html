const shell=document.getElementById('shell'),resizer=document.getElementById('resizer'),toggleBtn=document.getElementById('batchToggle'),frame=document.getElementById('app'),listEl=document.getElementById('fileList'),countEl=document.getElementById('count'),summaryEl=document.getElementById('batchSummary'),metaState=document.getElementById('metaState'),searchEl=document.getElementById('search'),batchBtn=document.getElementById('batch'),prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next');

function renderList(){const q=searchEl.value.trim().toLowerCase();listEl.textContent='';entries.forEach((entry,i)=>{if(q&&!entry.name.toLowerCase().includes(q))return;const row=document.createElement('button');row.type='button';row.className='fileRow'+(i===activeIndex?' active':'');row.title=entry.name;const info=document.createElement('span');info.className='fileInfo';const name=document.createElement('span');name.className='fileName';name.textContent=entry.name;const meta=document.createElement('span');meta.className='fileMeta';meta.textContent=(entry.pages==null?'… páginas':entry.pages+' página'+(entry.pages===1?'':'s'))+' · '+fmtBytes(entry.size);info.append(name,meta);const state=document.createElement('span');state.className='fileState '+stateClass(entry.state);state.textContent=entry.state;row.append(info,state);row.addEventListener('click',()=>activate(i));listEl.appendChild(row)});const dirty=entries.filter(e=>e.state==='Modificado'||e.state==='Guardando…').length,saved=entries.filter(e=>e.state==='Guardado').length;countEl.textContent=entries.length?(activeIndex>=0?(activeIndex+1)+' / '+entries.length:'0 / '+entries.length):'0 / 0';summaryEl.textContent=entries.length?entries.length+' archivo'+(entries.length===1?'':'s'):'0 archivos';metaState.textContent=dirty?dirty+' modificado'+(dirty===1?'':'s'):(saved?saved+' guardado'+(saved===1?'':'s'):'Solo 1 PDF en memoria');prevBtn.disabled=activeIndex<=0;nextBtn.disabled=activeIndex<0||activeIndex>=entries.length-1}

function setChildFileName(name){if(!childDoc)return;let badge=childDoc.getElementById('activeFileName');const top=childDoc.querySelector('.top');if(!top)return;if(!badge){badge=childDoc.createElement('span');badge.id='activeFileName';badge.className='mode';top.appendChild(badge)}const n=String(name||'—');badge.textContent='Archivo: '+n;badge.title=n}

ildDoc.createElement('button');clear.id='phaseClearSelection';clear.className='phaseClear';clear.type='button';clear.textContent='Limpiar selección';clear.disabled=true;clear.title='Quitar toda la selección azul sin modificar el PDF';const del=childDoc.getElementById('delete');if(del)del.insertAdjacentElement('afterend',clear);clear.addEventListener('click',()=>{try{child?.selectorPhase1?.clearSelection?.()}catch(e){console.error(e)}})}}
function refreshPhaseUI(){if(!childDoc)return;injectPhase1ChildUI();let s=null;try{s=child?.selectorPhase1?.getState?.()}catch(_){}if(!s)return;const clear=childDoc.getElementById('phaseClearSelection'),del=childDoc.getElementById('delete'),badge=childDoc.querySelector('.readyBadge'),title=childDoc.querySelector('.selectionTitle');if(clear)clear.disabled=!s.selected;if(del)del.textContent=s.selected?'Eliminar '+s.selected:'Eliminar grupo';if(title)title.textContent=s.selected?s.selected+' seleccionado'+(s.selected===1?'':'s'):'Selección';if(badge){badge.classList.remove('ok','bad');if(!s.hasDocument)badge.textContent='SIN PDF';else if(s.structuralIncomplete){badge.textContent='BLOQUEADO';badge.classList.add('bad')}else if(s.selected){badge.textContent=s.indexReady?'LISTO · '+s.selected:'PREPARANDO · '+s.selected;if(s.indexReady)badge.classList.add('ok')}else badge.textContent=s.indexReady?'ÍNDICE LISTO':'SIN SELECCIÓN'}}
function installChildHooks(){child=frame.contentWindow;childDoc=child.document;const top=childDoc.querySelector('.top');if(!top)return;injectPhase1ChildUI();setChildFileName(activeIndex>=0?entries[activeIndex].name:'—');nativeChildPicker=child.showOpenFilePicker&&child.showOpenFilePicker.bind(child);if(nativeChildPicker){const intercept=async(...args)=>{if(queuedHandle){const h=queuedHandle;queuedHandle=null;return[h]}return nativeChildPicker(...args)};try{child.showOpenFilePicker=intercept}catch(_){try{Object.defineProperty(child,'showOpenFilePicker',{configurable:true,writable:true,value:intercept})}catch(__){}}}const save=childDoc.querySelector('#save');if(save){save.addEventListener('click',()=>{if(activeIndex>=0&&!save.disabled)setEntryState(activeIndex,'Guardando…')},true);saveObserver?.disconnect();saveObserver=new MutationObserver(()=>{if(activeIndex<0)return;if(save.disabled&&entries[activeIndex]?.state==='Guardando…')setEntryState(activeIndex,'Guardado');else if(!save.disabled&&entries[activeIndex]?.state!=='Guardando…')setEntryState(activeIndex,'Modificado')});saveObserver.observe(save,{attributes:true,attributeFilter:['disabled']})}clearInterval(phaseTimer);phaseTimer=setInterval(refreshPhaseUI,250);refreshPhaseUI()}
async function activate(i){if(i<0||i>=entries.length||i===activeIndex||!childDoc)return;if(activeIndex>=0&&hasUnsaved()){const old=entries[activeIndex];const ok=confirm('Hay cambios sin guardar en “'+old.name+'”.\n\nSi cambias de PDF ahora, esos cambios se descartarán.\n\n¿Continuar?');if(!ok)return;old.state='Descartado'}else if(activeIndex>=0&&entries[activeIndex].state==='Activo'){entries[activeIndex].state='Revisado'}const serial=++switchSerial;activeIndex=i;entries[i].state='Cargando…';queuedHandle=entries[i].handle;setChildFileName(entries[i].name);renderList();const open=childDoc.querySelector('#open');if(!open){entries[i].state='Error';renderList();return}open.click();setTimeout(()=>{if(serial!==switchSerial||activeIndex!==i)return;if(queuedHandle){queuedHandle=null;entries[i].state='Error';renderList();return}if(entries[i].state==='Cargando…')entries[i].state=hasUnsaved()?'Modificado':'Activo';renderList()},900)}
async function loadBatch(){if(!window.showOpenFilePicker){alert('La carga por lote con guardado directo requiere Chrome o Edge con File System Access API.');return}if(activeIndex>=0&&hasUnsaved()){const ok=confirm('Hay cambios sin guardar en el PDF activo. ¿Descartarlos y cargar un lote nuevo?');if(!ok)return}try{const handles=await window.showOpenFilePicker({multiple:true,types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]});if(!handles?.length)return;entries=handles.map(h=>({handle:h,name:h.name||'PDF sin nombre',state:'Sin abrir',size:null,pages:null}));activeIndex=-1;queuedHandle=null;searchEl.value='';renderList();await activate(0);hydrateMetadata()}catch(e){if(e&&e.name!=='AbortError')alert('No pude cargar el lote: '+(e.message||e))}}

async function hydrateActivePageCount(i){if(i<0||!entries[i]||entries[i].pages!=null)return;const run=async()=>{if(i!==activeIndex||!entries[i]||entries[i].pages!=null)return;let mupdf=null,d=null;try{mupdf=await getMupdfMeta();const f=await entries[i].handle.getFile(),bytes=new Uint8Array(await f.arrayBuffer());d=mupdf.PDFDocument.openDocument(bytes,'application/pdf');entries[i].pages=Number(d.countPages?.()||0)}catch(_){}finally{try{d?.destroy?.()}catch(_){}renderList()}};if('requestIdleCallback'in window)requestIdleCallback(run,{timeout:6000});else setTimeout(run,3500)}
let dragging=false;resizer.addEventListener('pointerdown',e=>{if(shell.classList.contains('batchCollapsed'))return;dragging=true;resizer.classList.add('dragging');resizer.setPointerCapture(e.pointerId)});resizer.addEventListener('pointermove',e=>{if(!dragging)return;const w=Math.max(240,Math.min(520,e.clientX));document.documentElement.style.setProperty('--side',w+'px')});resizer.addEventListener('pointerup',()=>{dragging=false;resizer.classList.remove('dragging')});toggleBtn.addEventListener('click',()=>{shell.classList.toggle('batchCollapsed');toggleBtn.querySelector('span').textContent=shell.classList.contains('batchCollapsed')?'':'‹'});batchBtn.addEventListener('click',loadBatch);searchEl.addEventListener('input',renderList);prevBtn.addEventListener('click',()=>activate(activeIndex-1));nextBtn.addEventListener('click',()=>activate(activeIndex+1));frame.addEventListener('load',()=>{try{installChildHooks()}catch(e){console.error('phase1 hooks',e)}});window.addEventListener('beforeunload',e=>{if(hasUnsaved()){e.preventDefault();e.returnValue=''}});renderList();
