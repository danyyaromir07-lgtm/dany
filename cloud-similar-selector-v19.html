<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selector de nubes v19</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="./cloud-similar-selector-v17.html?v=20260901-clickoverlay1"></iframe><script>
const frame=document.getElementById('app');let lastClick=null,lastSelection=null;
function waitForApp(){const d=frame.contentDocument;if(!d||!d.querySelector('#overlay')||!d.querySelector('#detail')){setTimeout(waitForApp,80);return}install(d)}
function strictRed(r,g,b){return r>135&&(r-g)>24&&(r-b)>22&&r>g*1.09&&r>b*1.08}
function compatible(r,g,b,sr,sg,sb){if(r<95||(r-g)<13||(r-b)<12||r<=g*1.045||r<=b*1.04)return false;const rr=Math.max(1,r),srr=Math.max(1,sr),gr=g/rr,br=b/rr,sgr=sg/srr,sbr=sb/srr;const ratioDist=Math.hypot(gr-sgr,br-sbr);const ex1=(r-g)/255,ex2=(r-b)/255,se1=(sr-sg)/255,se2=(sr-sb)/255;const excessDist=Math.hypot(ex1-se1,ex2-se2);return ratioDist<=.16&&excessDist<=.30}
function selectLocal(d,clientX,clientY){const detail=d.querySelector('#detail'),overlay=d.querySelector('#overlay'),viewport=d.querySelector('#viewport'),status=d.querySelector('#status'),del=d.querySelector('#delete');if(!detail||detail.style.display==='none'||!detail.src||!detail.naturalWidth){status.textContent='Primero pulsa «Actualizar nitidez visible» y luego haz clic sobre un arco.';return}const dr=detail.getBoundingClientRect(),vr=viewport.getBoundingClientRect();if(clientX<dr.left||clientX>dr.right||clientY<dr.top||clientY>dr.bottom){status.textContent='El clic quedó fuera del tile nítido. Actualiza la nitidez en esta zona y vuelve a clicar.';return}const nw=detail.naturalWidth,nh=detail.naturalHeight,ix=(clientX-dr.left)*nw/dr.width,iy=(clientY-dr.top)*nh/dr.height,half=280,sx=Math.max(0,Math.floor(ix-half)),sy=Math.max(0,Math.floor(iy-half)),ex=Math.min(nw,Math.ceil(ix+half)),ey=Math.min(nh,Math.ceil(iy+half)),w=ex-sx,h=ey-sy;if(w<8||h<8)return;const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(detail,sx,sy,w,h,0,0,w,h);let data;try{data=cx.getImageData(0,0,w,h).data}catch(e){status.textContent='No pude leer el tile: '+e.message;return}const lx=Math.round(ix-sx),ly=Math.round(iy-sy),srch=65;let seed=-1,best=1e9,sr=0,sg=0,sb=0;for(let y=Math.max(0,ly-srch);y<=Math.min(h-1,ly+srch);y++)for(let x=Math.max(0,lx-srch);x<=Math.min(w-1,lx+srch);x++){const p=y*w+x,i=p*4,r=data[i],g=data[i+1],b=data[i+2];if(!strictRed(r,g,b))continue;const dd=(x-lx)*(x-lx)+(y-ly)*(y-ly);if(dd<best){best=dd;seed=p;sr=r;sg=g;sb=b}}if(seed<0){status.textContent='No encontré rojo de nube suficientemente cerca. Haz clic exactamente sobre el contorno rojo.';return}const n=w*h,mask=new Uint8Array(n),dil=new Uint8Array(n);for(let p=0,i=0;p<n;p++,i+=4)if(compatible(data[i],data[i+1],data[i+2],sr,sg,sb))mask[p]=1;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const p=y*w+x;if(!mask[p])continue;for(let yy=y-1;yy<=y+1;yy++)for(let xx=x-1;xx<=x+1;xx++)dil[yy*w+xx]=1}const q=new Int32Array(n),seen=new Uint8Array(n);let qh=0,qt=0;q[qt++]=seed;seen[seed]=1,minx=w,miny=h,maxx=0,maxy=0,orig=0,maxR2=0;const seedY=(seed/w)|0,seedX=seed-seedY*w,limitR=235,limitR2=limitR*limitR;while(qh<qt){const p=q[qh++],y=(p/w)|0,x=p-y*w,dx=x-seedX,dy=y-seedY,rr=dx*dx+dy*dy;if(rr>limitR2)continue;if(mask[p]){orig++;maxR2=Math.max(maxR2,rr);if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y}for(let yy=Math.max(0,y-1);yy<=Math.min(h-1,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(w-1,x+1);xx++){const np=yy*w+xx;if(!seen[np]&&dil[np]){seen[np]=1;q[qt++]=np}}}if(orig<12){status.textContent='El trazo encontrado es demasiado pequeño para considerarlo un arco.';return}const bw=maxx-minx+1,bh=maxy-miny+1;if(bw>280||bh>280||bw*bh>w*h*.22||Math.sqrt(maxR2)>225){status.textContent=`La selección intentó extenderse demasiado (${bw}×${bh}); la descarté para no incluir elementos ajenos.`;return}const sel=document.createElement('canvas');sel.width=w;sel.height=h;const sc=sel.getContext('2d'),im=sc.createImageData(w,h);for(let p=0,i=0;p<n;p++,i+=4){if(seen[p]&&mask[p]){im.data[i]=0;im.data[i+1]=155;im.data[i+2]=255;im.data[i+3]=230}}sc.putImageData(im,0,0);const dpr=Number(overlay.dataset.dpr||1),oc=overlay.getContext('2d');oc.save();oc.setTransform(dpr,0,0,dpr,0,0);const destX=dr.left-vr.left+(sx/nw)*dr.width,destY=dr.top-vr.top+(sy/nh)*dr.height,destW=w/nw*dr.width,destH=h/nh*dr.height;oc.drawImage(sel,destX,destY,destW,destH);oc.restore();lastSelection={pixels:orig,bbox:[minx,miny,maxx,maxy],seedRGB:[sr,sg,sb],screen:[clientX,clientY]};if(del)del.disabled=true;status.textContent=`Arco visual seleccionado · ${orig} px · bbox ${bw}×${bh} · semilla rgb(${sr},${sg},${sb}) · filtro v19 restringido. Eliminar sigue bloqueado hasta mapeo estructural seguro.`}
function install(d){const overlay=d.querySelector('#overlay'),select=d.querySelector('#select'),status=d.querySelector('#status');if(overlay.dataset.v19Installed)return;overlay.dataset.v19Installed='1';overlay.addEventListener('click',e=>{lastClick={x:e.clientX,y:e.clientY};setTimeout(()=>selectLocal(d,e.clientX,e.clientY),0)});if(select)select.addEventListener('click',()=>{if(lastClick)selectLocal(d,lastClick.x,lastClick.y);else status.textContent='Haz clic directamente sobre un arco.'});status.textContent='v19 · selección local restringida por color de semilla y geometría.'}
frame.addEventListener('load',()=>setTimeout(waitForApp,100));setTimeout(waitForApp,300);
</script></body></html>
