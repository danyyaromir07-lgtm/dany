</style></head><body><div class="shell"><aside class="side"><h1>Lote de PDFs</h1><div class="toolbar"><button id="batch" type="button">Cargar PDFs</button><button id="prev" type="button" disabled>←</button><button id="next" type="button" disabled>→</button></div><input id="search" type="search" placeholder="Buscar archivo…"><div class="meta"><span id="count">0 / 0</span><span class="hint">Solo 1 PDF en memoria</span></div><div id="fileList" class="list"></div></aside><main class="viewer"><iframe id="app" src="./selector-nubes-fluido-core.html?v=20260903-fluiddelete1" allow="fullscreen"></iframe></main></div><script>
const frame=document.getElementById('app'),listEl=document.getElementById('fileList'),countEl=document.getElementById('count'),searchEl=document.getElementById('search'),batchBtn=document.getElementById('batch'),prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next');
let entries=[],activeIndex=-1,queuedHandle=null,child=null,childDoc=null,saveObserver=null,nativeChildPicker=null,switchSerial=0;const mupdfMetaPromise=import('https://cdn.jsdelivr.net/npm/mupdf@1.28.0/dist/mupdf.js');const fmtBytes=n=>{if(!Number.isFinite(n))return'—';const u=['B','KB','MB','GB'];let i=0,v=n;while(v>=1024&&i<u.length-1){v/=1024;i++}return(v>=100||i===0?Math.round(v):v.toFixed(1))+' '+u[i]};
function stateClass(state){if(state==='Guardado')return'saved';if(state==='Modificado'||state==='Guardando…')return'dirty';if(state==='Activo'||state==='Cargando…')return'activeState';if(state==='Descartado')return'discarded';return''}
function renderList(){const q=searchEl.value.trim().toLowerCase();listEl.textContent='';entries.forEach((entry,i)=>{if(q&&!entry.name.toLowerCase().includes(q))return;const row=document.createElement('button');row.type='button';row.className='fileRow'+(i===activeIndex?' active':'');row.title=entry.name;const info=document.createElement('span');info.className='fileInfo';const name=document.createElement('span');name.className='fileName';name.textContent=entry.name;const meta=document.createElement('span');meta.className='fileMeta';meta.textContent=(entry.pages==null?'… páginas':entry.pages+' página'+(entry.pages===1?'':'s'))+' · '+fmtBytes(entry.size);info.append(name,meta);const state=document.createElement('span');state.className='fileState '+stateClass(entry.state);state.textContent=entry.state;row.append(info,state);row.addEventListener('click',()=>activate(i));listEl.appendChild(row)});countEl.textContent=entries.length?(activeIndex>=0?(activeIndex+1)+' / '+entries.length:'0 / '+entries.length):'0 / 0';prevBtn.disabled=activeIndex<=0;nextBtn.disabled=activeIndex<0||activeIndex>=entries.length-1}
function setEntryState(i,state){if(i<0||!entries[i])return;entries[i].state=state;renderList()}
function setChildFileName(name){if(!childDoc)return;let badge=childDoc.getElementById('activeFileName');const top=childDoc.querySelector('.top');if(!top)return;if(!badge){badge=childDoc.createElement('span');badge.id='activeFileName';badge.className='mode';badge.style.maxWidth='360px';badge.style.overflow='hidden';badge.style.textOverflow='ellipsis';badge.style.display='inline-block';badge.style.verticalAlign='middle';top.appendChild(badge)}const n=String(name||'—');badge.textContent='Archivo: '+n;badge.title=n}
function hasUnsaved(){const b=childDoc&&childDoc.querySelector('#save');return!!(b&&!b.disabled)}
function installChildHooks(){child=frame.contentWindow;childDoc=child.document;const top=childDoc.querySelector('.top');if(!top)return;setChildFileName(activeIndex>=0?entries[activeIndex].name:'—');nativeChildPicker=child.showOpenFilePicker&&child.showOpenFilePicker.bind(child);if(nativeChildPicker){const intercept=async(...args)=>{if(queuedHandle){const h=queuedHandle;queuedHandle=null;return[h]}return nativeChildPicker(...args)};try{child.showOpenFilePicker=intercept}catch(_){try{Object.defineProperty(child,'showOpenFilePicker',{configurable:true,writable:true,value:intercept})}catch(__){}}}const save=childDoc.querySelector('#save');if(save){save.addEventListener('click',()=>{if(activeIndex>=0&&!save.disabled)setEntryState(activeIndex,'Guardando…')},true);saveObserver?.disconnect();saveObserver=new MutationObserver(()=>{if(activeIndex<0)return;if(save.disabled&&entries[activeIndex]?.state==='Guardando…')setEntryState(activeIndex,'Guardado');else if(!save.disabled&&entries[activeIndex]?.state!=='Guardando…')setEntryState(activeIndex,'Modificado')});saveObserver.observe(save,{attributes:true,attributeFilter:['disabled']})}}
async function activate(i){if(i<0||i>=entries.length||i===activeIndex||!childDoc)return;if(activeIndex>=0&&hasUnsaved()){const old=entries[activeIndex];const ok=confirm('Hay cambios sin guardar en “'+old.name+'”.\n\nSi cambias de PDF ahora, esos cambios se descartarán.\n\n¿Continuar?');if(!ok)return;old.state='Descartado'}else if(activeIndex>=0&&entries[activeIndex].state==='Activo'){entries[activeIndex].state='Revisado'}const serial=++switchSerial;activeIndex=i;entries[i].state='Cargando…';queuedHandle=entries[i].handle;setChildFileName(entries[i].name);renderList();const open=childDoc.querySelector('#open');if(!open){entries[i].state='Error';renderList();return}open.click();setTimeout(()=>{if(serial!==switchSerial||activeIndex!==i)return;if(queuedHandle){queuedHandle=null;entries[i].state='Error';renderList();return}if(entries[i].state==='Cargando…')entries[i].state=hasUnsaved()?'Modificado':'Activo';renderList()},900)}
async function loadBatch(){if(!window.showOpenFilePicker){alert('La carga por lote con guardado directo requiere un navegador compatible con File System Access API (por ejemplo Chrome o Edge).');return}if(activeIndex>=0&&hasUnsaved()){const ok=confirm('Hay cambios sin guardar en el PDF activo. ¿Descartarlos y cargar un lote nuevo?');if(!ok)return}try{const handles=await window.showOpenFilePicker({multiple:true,types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]});if(!handles?.length)return;entries=handles.map(h=>({handle:h,name:h.name||'PDF sin nombre',state:'Sin abrir',size:null,pages:null}));activeIndex=-1;queuedHandle=null;searchEl.value='';renderList();await activate(0);hydrateMetadata()}catch(e){if(e&&e.name!=='AbortError')alert('No pude cargar el lote: '+(e.message||e))}}
async function hydrateMetadata(){let mupdf=null;try{mupdf=await mupdfMetaPromise}catch(_){return}for(let i=0;i<entries.length;i++){const e=entries[i];try{const f=await e.handle.getFile();e.size=f.size;const bytes=new Uint8Array(await f.arrayBuffer()),d=mupdf.PDFDocument.openDocument(bytes,'application/pdf');e.pages=Number(d.countPages?.()||0);d.destroy?.()}catch(_){e.pages=e.pages??null}renderList()}}
batchBtn.addEventListener('click',loadBatch);searchEl.addEventListener('input',renderList);prevBtn.addEventListener('click',()=>activate(activeIndex-1));nextBtn.addEventListener('click',()=>activate(activeIndex+1));frame.addEventListener('load',()=>{try{installChildHooks()}catch(e){console.error('v62 batch hooks',e)}});window.addEventListener('beforeunload',e=>{if(hasUnsaved()){e.preventDefault();e.returnValue=''}});renderList();
