<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selector de nubes v11</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0f0f10;color:#eee;font:14px system-ui}.top{height:54px;position:fixed;inset:0 0 auto;z-index:20;background:#18191b;border-bottom:1px solid #444;display:flex;align-items:center;gap:7px;padding:7px 9px;white-space:nowrap}.top button,.top input{font:inherit}.top button{height:34px;padding:0 10px}.top button:disabled{opacity:.45}.sep{width:1px;height:30px;background:#444}.zoomBox{display:flex;align-items:center;gap:5px;border:1px solid #4b4d50;border-radius:6px;padding:3px 6px;background:#222427}.zoomBox input{width:145px}.zoomPct{width:58px;text-align:right}.mode{padding:6px 8px;border-radius:5px;background:#2a2c2f}.main{position:fixed;inset:54px 0 0;display:grid;grid-template-rows:auto 1fr;min-height:0}.status{min-height:42px;padding:9px 12px;background:#202226;border-bottom:1px solid #35373a;white-space:pre-wrap}.viewport{position:relative;overflow:hidden;background:#151515;cursor:crosshair;touch-action:none;user-select:none}.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.page{display:block;background:#fff;box-shadow:0 0 0 1px #666;pointer-events:none}.overlay{position:absolute;inset:0;pointer-events:auto}.pan{cursor:grabbing!important}.badge{color:#ffd27a}</style></head><body><div class="top"><button id="open">Abrir PDF editable</button><button id="select" disabled>Seleccionar arco</button><button id="delete" disabled>Eliminar grupo</button><button id="save" disabled>Guardar cambios</button><div class="sep"></div><div class="zoomBox"><button id="minus">−</button><input id="zoom" type="range" min="25" max="800" step="5" value="100"><span id="zoomPct" class="zoomPct">100%</span><button id="plus">+</button><button id="fit">Ajustar</button><button id="z100">100%</button></div><div class="sep"></div><span id="mode" class="mode">Sin PDF</span></div><div class="main"><div id="status" class="status">v11 · zoom real con re-render · rueda = zoom · botón central = mover.</div><div id="viewport" class="viewport"><div id="stage" class="stage"><img id="page" class="page" alt=""><canvas id="overlay" class="overlay"></canvas></div></div></div><script type="module">
import * as mupdf from 'https://cdn.jsdelivr.net/npm/mupdf@1.28.0/dist/mupdf.js';
const $=s=>document.querySelector(s),U=b=>b?.asUint8Array?.()||b,resolve=o=>{try{return o?.resolve?.()||o}catch(_){return o}};
let doc=null,handle=null,pngUrl=null,pageW=1,pageH=1,baseRs=1,baseW=1,baseH=1,zoom=1,panX=0,panY=0,massive=false,pending=false,rasterQ=1,renderTimer=0,rendering=false,renderAgain=false,seed=null;
const viewport=$('#viewport'),stage=$('#stage'),img=$('#page'),overlay=$('#overlay'),status=$('#status');
function refs(page){try{const c=resolve(page.getObject()?.get?.('Contents'));if(!c)return[];if(c?.isStream?.())return[c];if(c?.isArray?.()){const a=[];for(let i=0;i<Number(c.length||0);i++){const r=resolve(c.get(i));if(r?.isStream?.())a.push(r)}return a}return[]}catch(_){return[]}}
function setButtons(){const has=!!doc;$('#select').disabled=!has;$('#delete').disabled=true;$('#save').disabled=!handle||!pending}
function applyTransform(){stage.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;$('#zoom').value=String(Math.round(zoom*100));$('#zoomPct').textContent=Math.round(zoom*100)+'%'}
const clampZoom=z=>Math.max(.25,Math.min(8,z));
function fit(){if(!baseW||!baseH)return;const pad=20,z=Math.min((viewport.clientWidth-pad*2)/baseW,(viewport.clientHeight-pad*2)/baseH);zoom=clampZoom(z);panX=(viewport.clientWidth-baseW*zoom)/2;panY=(viewport.clientHeight-baseH*zoom)/2;applyTransform();queueSharpRender()}
function setZoomAt(z,cx,cy){z=clampZoom(z);const old=zoom;if(!Number.isFinite(cx)){cx=viewport.clientWidth/2;cy=viewport.clientHeight/2}const sx=(cx-panX)/old,sy=(cy-panY)/old;zoom=z;panX=cx-sx*zoom;panY=cy-sy*zoom;applyTransform();queueSharpRender()}
function desiredQ(){const byLong=7200/Math.max(baseW,baseH),byPixels=Math.sqrt(36_000_000/(baseW*baseH));return Math.max(1,Math.min(zoom,byLong,byPixels))}
function queueSharpRender(){clearTimeout(renderTimer);renderTimer=setTimeout(()=>renderSharp(),220)}
async function renderSharp(){if(!doc)return;const q=desiredQ();if(Math.abs(q-rasterQ)<.12)return;if(rendering){renderAgain=true;return}rendering=true;try{const p=doc.loadPage(0),rs=baseRs*q,pm=p.toPixmap(mupdf.Matrix.scale(rs,rs),mupdf.ColorSpace.DeviceRGB,false,true),png=pm.asPNG();try{pm.destroy?.()}catch(_){}p.destroy?.();if(pngUrl)URL.revokeObjectURL(pngUrl);pngUrl=URL.createObjectURL(new Blob([png],{type:'image/png'}));img.src=pngUrl;await img.decode();img.style.width=baseW+'px';img.style.height=baseH+'px';rasterQ=q;status.textContent=`Zoom ${Math.round(zoom*100)}% · raster real ${q.toFixed(2)}× · ${massive?'modo masivo estable':'modo normal'}. Clic izquierdo para marcar un arco; botón central para mover.`}catch(e){status.textContent='No pude aumentar más la resolución sin riesgo de memoria: '+e.message}finally{rendering=false;if(renderAgain){renderAgain=false;queueSharpRender()}}}
async function renderPage(){const p=doc.loadPage(0),rr=refs(p);let raw=0;for(const r of rr){try{raw+=U(r.readRawStream()).length}catch(_){}}massive=raw>=5_000_000;const b=p.getBounds();pageW=b[2]-b[0];pageH=b[3]-b[1];const maxDim=1900;baseRs=Math.min(1.25,maxDim/Math.max(pageW,pageH));const pm=p.toPixmap(mupdf.Matrix.scale(baseRs,baseRs),mupdf.ColorSpace.DeviceRGB,false,true),png=pm.asPNG();baseW=pm.getWidth?.()||Math.round(pageW*baseRs);baseH=pm.getHeight?.()||Math.round(pageH*baseRs);try{pm.destroy?.()}catch(_){}p.destroy?.();if(pngUrl)URL.revokeObjectURL(pngUrl);pngUrl=URL.createObjectURL(new Blob([png],{type:'image/png'}));img.src=pngUrl;await img.decode();img.style.width=baseW+'px';img.style.height=baseH+'px';overlay.width=baseW;overlay.height=baseH;overlay.style.width=baseW+'px';overlay.style.height=baseH+'px';stage.style.width=baseW+'px';stage.style.height=baseH+'px';rasterQ=1;$('#mode').textContent=massive?'Modo masivo':'Modo normal';setButtons();requestAnimationFrame(fit);status.innerHTML=massive?'<span class="badge">PDF masivo detectado.</span> El visor no construye millones de paths. El zoom se vuelve a renderizar con MuPDF para conservar nitidez.':'PDF abierto. Zoom real hasta 800% con re-render.'}
async function openPdf(){if(!('showOpenFilePicker'in window))throw new Error('Usa Chrome o Edge.');const [h]=await showOpenFilePicker({multiple:false,types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]});const f=await h.getFile();try{doc?.destroy?.()}catch(_){}doc=mupdf.PDFDocument.openDocument(new Uint8Array(await f.arrayBuffer()),'application/pdf');handle=h;pending=false;seed=null;await renderPage()}
$('#open').addEventListener('click',async()=>{try{await openPdf()}catch(e){if(e?.name!=='AbortError')status.textContent='Error: '+e.message}});$('#zoom').addEventListener('input',e=>setZoomAt(Number(e.target.value)/100));$('#plus').addEventListener('click',()=>setZoomAt(zoom*1.25));$('#minus').addEventListener('click',()=>setZoomAt(zoom/1.25));$('#fit').addEventListener('click',fit);$('#z100').addEventListener('click',()=>setZoomAt(1));
viewport.addEventListener('wheel',e=>{if(!doc)return;e.preventDefault();const r=viewport.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top;setZoomAt(zoom*Math.exp(-e.deltaY*.0017),cx,cy)},{passive:false});
let dragging=false,lastX=0,lastY=0;viewport.addEventListener('mousedown',e=>{if(e.button!==1)return;e.preventDefault();dragging=true;lastX=e.clientX;lastY=e.clientY;viewport.classList.add('pan')});window.addEventListener('mousemove',e=>{if(!dragging)return;panX+=e.clientX-lastX;panY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;applyTransform()});window.addEventListener('mouseup',e=>{if(e.button===1){dragging=false;viewport.classList.remove('pan')}});viewport.addEventListener('auxclick',e=>{if(e.button===1)e.preventDefault()});
function drawSeed(){const c=overlay.getContext('2d');c.clearRect(0,0,overlay.width,overlay.height);if(!seed)return;c.lineWidth=Math.max(1,2/zoom);c.strokeStyle='rgba(0,160,255,.95)';c.beginPath();c.arc(seed.x,seed.y,Math.max(3,7/zoom),0,Math.PI*2);c.moveTo(seed.x-10/zoom,seed.y);c.lineTo(seed.x+10/zoom,seed.y);c.moveTo(seed.x,seed.y-10/zoom);c.lineTo(seed.x,seed.y+10/zoom);c.stroke()}
overlay.addEventListener('click',e=>{if(!doc)return;const r=overlay.getBoundingClientRect();seed={x:(e.clientX-r.left)*(baseW/r.width),y:(e.clientY-r.top)*(baseH/r.height)};drawSeed();status.textContent=`Arco marcado en (${seed.x.toFixed(1)}, ${seed.y.toFixed(1)}). Imagen a ${Math.round(zoom*100)}% con raster ${rasterQ.toFixed(2)}×. El mapeo estructural masivo irá desde esta coordenada sin cargar todos los paths.`});$('#select').addEventListener('click',()=>{status.textContent=seed?'Semilla marcada.':'Haz clic directamente sobre un arco.'});
$('#delete').addEventListener('click',()=>{});$('#save').addEventListener('click',async()=>{if(!handle||!pending||!doc)return;try{const b=doc.saveToBuffer('garbage=4,compress=yes,appearance=yes'),w=await handle.createWritable();await w.write(new Uint8Array(U(b)));await w.close();pending=false;setButtons();status.textContent='Cambios guardados.'}catch(e){status.textContent='Error al guardar: '+e.message}});window.addEventListener('resize',()=>{if(doc&&zoom<1.05)fit()});
</script></body></html>
