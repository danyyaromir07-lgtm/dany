<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudForge · V2.4 lab · Selection glow</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d}
#v23{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="v23" src="./index.html?v=20260908-v24-selection-glow" allow="fullscreen"></iframe>
<script>
(()=>{
  const host=document.getElementById('v23');
  const STYLE_ID='v24-selection-glow';
  const CSS=`
    #overlay{
      filter:
        drop-shadow(0 0 2px rgba(40,170,255,.98))
        drop-shadow(0 0 6px rgba(25,145,255,.68))
        drop-shadow(0 0 12px rgba(25,145,255,.30));
    }
  `;

  function installGlow(){
    try{
      const shellDoc=host.contentDocument;
      const app=shellDoc?.getElementById('app');
      const coreDoc=app?.contentDocument;
      if(!coreDoc?.head)return false;
      let style=coreDoc.getElementById(STYLE_ID);
      if(!style){
        style=coreDoc.createElement('style');
        style.id=STYLE_ID;
        style.textContent=CSS;
        coreDoc.head.appendChild(style);
      }
      return true;
    }catch(_){return false}
  }

  function bindCore(){
    try{
      const app=host.contentDocument?.getElementById('app');
      if(!app)return;
      app.addEventListener('load',installGlow);
      installGlow();
    }catch(_){/* laboratorio visual: nunca interfiere con el core */}
  }

  host.addEventListener('load',()=>{
    bindCore();
    let tries=0;
    const timer=setInterval(()=>{
      if(installGlow()||++tries>40)clearInterval(timer);
    },100);
  });
})();
</script>
</body>
</html>
