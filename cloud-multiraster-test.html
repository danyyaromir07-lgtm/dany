<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDF Tools · prueba nube multiraster exacta</title>
</head>
<body>
  <p id="boot" style="font-family:system-ui;padding:20px">Cargando prueba aislada de nubes…</p>
  <script>
  (async()=>{
    const boot=document.getElementById('boot');
    try{
      const response=await fetch('./index.html?v=20260819-cloud-exactbmc-test6',{cache:'no-store'});
      if(!response.ok)throw new Error('No se pudo cargar index.html: '+response.status);
      let html=await response.text();
      const marker='<script type="importmap">'+JSON.stringify({imports:{'./revision-cloud-manual-force-v2.js?v=20260818-curvedgray2':'./revision-cloud-manual-force-v9.js?v=20260819-exactbmcvector1'}})+'</'+'script><script type="module" src="./revision-cloud-coordinate-diagnostic-v1.js?v=20260819-coorddiag2"></'+'script>';
      if(!html.includes('</head>'))throw new Error('No encontré </head> en index.html.');
      html=html.replace('</head>',marker+'</head>');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      boot.textContent='ERROR AL CARGAR LA PRUEBA AISLADA: '+(error?.message||String(error));
    }
  })();
  </script>
</body>
</html>
