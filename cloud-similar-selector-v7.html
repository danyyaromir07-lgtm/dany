<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selector de nubes similares v7</title><style>html,body{height:100%;margin:0;background:#111;color:#eee;font:14px system-ui}.top{height:46px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:7px 10px;background:#181818;border-bottom:1px solid #444;position:sticky;top:0;z-index:10}button{font:inherit;padding:7px 11px}.mode{padding:5px 8px;border-radius:5px;background:#2b2b2b}.ok{background:#173b20}.warn{background:#4a3214}iframe{width:100%;height:calc(100% - 46px);border:0;display:block;background:#111}</style></head><body><div class="top"><button id="open">Abrir PDF editable</button><button id="save" disabled>Guardar cambios en archivo original</button><span id="mode" class="mode warn">Modo escritura: NO</span><span id="msg">Abre el PDF desde este botón.</span></div><iframe id="tool" src="./cloud-similar-selector-v6.html?v=20260901-cumulative1"></iframe><script>
const f=document.querySelector('#tool'),openBtn=document.querySelector('#open'),saveBtn=document.querySelector('#save'),mode=document.querySelector('#mode'),msg=document.querySelector('#msg');let handle=null,ready=false;
function setMode(ok,text){mode.textContent='Modo escritura: '+(ok?'SÍ':'NO');mode.className='mode '+(ok?'ok':'warn');msg.textContent=text||'';saveBtn.disabled=!ok}
function cleanInner(){try{const d=f.contentDocument;if(!d)return;['openEditable','file','save'].forEach(id=>{const e=d.getElementById(id);if(e)e.style.display='none'});const h=d.querySelector('.hint');if(h)h.textContent='Selecciona un grupo, pulsa «Eliminar grupo», repite las veces necesarias y al terminar usa «Guardar cambios en archivo original» en la barra superior.';ready=!!f.contentWindow.__cloudV6}catch(_){}}
f.addEventListener('load',()=>{setTimeout(()=>{cleanInner();ready=!!f.contentWindow.__cloudV6;if(handle&&ready)setMode(true,'Archivo editable vinculado. Puedes eliminar varios grupos y guardar al final.')},250)});
openBtn.addEventListener('click',async()=>{if(!('showOpenFilePicker'in window)){setMode(false,'Este navegador no permite sobrescribir el archivo original. Usa Chrome o Edge.');return}try{const [h]=await showOpenFilePicker({multiple:false,types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]});if(!ready){msg.textContent='Esperando a que cargue la herramienta…';await new Promise(r=>setTimeout(r,500));cleanInner()}if(!f.contentWindow.__cloudV6)throw new Error('La herramienta interna aún no está lista');await f.contentWindow.__cloudV6.openHandle(h);handle=h;cleanInner();setMode(true,'Archivo editable abierto. Elimina uno o varios grupos; guardarás una sola vez al final.')}catch(e){if(e?.name!=='AbortError')setMode(false,'Error al abrir: '+e.message)}});
saveBtn.addEventListener('click',async()=>{try{if(!handle||!f.contentWindow.__cloudV6)throw new Error('No hay archivo editable abierto');const r=await f.contentWindow.__cloudV6.save();if(r===false){msg.textContent='No hay cambios pendientes para guardar.';return}msg.textContent='Guardado correctamente sobre el archivo original.'}catch(e){msg.textContent='Error al guardar: '+e.message}});
</script></body></html>
