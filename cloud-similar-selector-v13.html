<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selector de nubes v13</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0f0f10;color:#eee;font:14px system-ui}.top{height:54px;position:fixed;inset:0 0 auto;z-index:20;background:#18191b;border-bottom:1px solid #444;display:flex;align-items:center;gap:7px;padding:7px 9px;white-space:nowrap}.top button,.top input{font:inherit}.top button{height:34px;padding:0 10px}.top button:disabled{opacity:.45}.sep{width:1px;height:30px;background:#444}.zoomBox{display:flex;align-items:center;gap:5px;border:1px solid #4b4d50;border-radius:6px;padding:3px 6px;background:#222427}.zoomBox input{width:145px}.zoomPct{width:58px;text-align:right}.mode{padding:6px 8px;border-radius:5px;background:#2a2c2f}.main{position:fixed;inset:54px 0 0;display:grid;grid-template-rows:auto 1fr;min-height:0}.status{min-height:42px;padding:9px 12px;background:#202226;border-bottom:1px solid #35373a;white-space:pre-wrap}.viewport{position:relative;overflow:hidden;background:#151515;cursor:crosshair;touch-action:none;user-select:none}.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.page{display:block;background:#fff;box-shadow:0 0 0 1px #666;pointer-events:none}.detail{position:absolute;pointer-events:none;z-index:2}.overlay{position:absolute;inset:0;pointer-events:auto;z-index:3}.pan{cursor:grabbing!important}.badge{color:#ffd27a}</style></head><body><div class="top"><button id="open">Abrir PDF editable</button><button id="select" disabled>Seleccionar arco</button><button id="delete" disabled>Eliminar grupo</button><button id="save" disabled>Guardar cambios</button><div class="sep"></div><div class="zoomBox"><button id="minus">−</button><input id="zoom" type="range" min="25" max="800" step="5" value="100"><span id="zoomPct" class="zoomPct">100%</span><button id="plus">+</button><button id="fit">Ajustar</button><button id="z100">100%</button><button id="sharp" disabled>Actualizar nitidez visible</button></div><div class="sep"></div><span id="mode" class="mode">Sin PDF</span></div><div class="main"><div id="status" class="status">v13 · zoom/pan ligero · nitidez real solo en la zona visible.</div><div id="viewport" class="viewport"><div id="stage" class="stage"><img id="page" class="page" alt=""><img id="detail" class="detail" alt=""><canvas id="overlay" class="overlay"></canvas></div></div></div><script type="module">
import * as mupdf from 'https://cdn.jsdelivr.net/npm/mupdf@1.28.0/dist/mupdf.js';
const $=s=>document.querySelector(s),U=b=>b?.asUint8Array?.()||b,resolve=o=>{try{return o?.resolve?.()||o}catch(_){return o}};
let doc=null,handle=null,baseUrl=null,detailUrl=null,pageBounds=[0,0,1,1],pageW=1,pageH=1,baseRs=1,baseW=1,baseH=1,zoom=1,panX=0,panY=0,massive=false,pending=false,rendering=false,seed=null;
const viewport=$('#viewport'),stage=$('#stage'),img=$('#page'),detail=$('#detail'),overlay=$('#overlay'),status=$('#status');
function refs(page){try{const c=resolve(page.getObject()?.get?.('Contents'));if(!c)return[];if(c?.isStream?.())return[c];if(c?.isArray?.()){const a=[];for(let i=0;i<Number(c.length||0);i++){const r=resolve(c.get(i));if(r?.isStream?.())a.push(r)}return a}return[]}catch(_){return[]}}
function setButtons(){const has=!!doc;$('#select').disabled=!has;$('#delete').disabled=true;$('#save').disabled=!handle||!pending;$('#sharp').disabled=!has||rendering}
function clearDetail(){detail.removeAttribute('src');detail.style.display='none';if(detailUrl){URL.revokeObjectURL(detailUrl);detailUrl=null}}
function applyTransform(){stage.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;$('#zoom').value=String(Math.round(zoom*100));$('#zoomPct').textContent=Math.round(zoom*100)+'%'}
const clampZoom=z=>Math.max(.25,Math.min(8,z));
function fit(){if(!baseW||!baseH)return;clearDetail();const pad=20,z=Math.min((viewport.clientWidth-pad*2)/baseW,(viewport.clientHeight-pad*2)/baseH);zoom=clampZoom(z);panX=(viewport.clientWidth-baseW*zoom)/2;panY=(viewport.clientHeight-baseH*zoom)/2;applyTransform()}
function setZoomAt(z,cx,cy){clearDetail();z=clampZoom(z);const old=zoom;if(!Number.isFinite(cx)){cx=viewport.clientWidth/2;cy=viewport.clientHeight/2}const sx=(cx-panX)/old,sy=(cy-panY)/old;zoom=z;panX=cx-sx*zoom;panY=cy-sy*zoom;applyTransform();status.textContent=`Zoom ${Math.round(zoom*100)}%. Navega libremente; cuando estés sobre la nube pulsa «Actualizar nitidez visible».`}
function visibleBaseRect(){const margin=28/zoom;let x0=(-panX)/zoom-margin,y0=(-panY)/zoom-margin,x1=(viewport.clientWidth-panX)/zoom+margin,y1=(viewport.clientHeight-panY)/zoom+margin;x0=Math.max(0,x0);y0=Math.max(0,y0);x1=Math.min(baseW,x1);y1=Math.min(baseH,y1);return [x0,y0,x1,y1]}
async function renderVisibleSharp(){if(!doc||rendering)return;rendering=true;setButtons();status.textContent='Renderizando solo la zona visible a alta resolución…';try{const [x0,y0,x1,y1]=visibleBaseRect();if(x1<=x0||y1<=y0)throw new Error('La página está fuera del visor.');const p=doc.loadPage(0);const dpr=Math.min(2,window.devicePixelRatio||1);const target=Math.max(1,Math.min(8,zoom*dpr));const rs=baseRs*target;const px0=pageBounds[0]+x0/baseRs,py0=pageBounds[1]+y0/baseRs,px1=pageBounds[0]+x1/baseRs,py1=pageBounds[1]+y1/baseRs;const bbox=[Math.floor(px0*rs),Math.floor(py0*rs),Math.ceil(px1*rs),Math.ceil(py1*rs)];const maxPixels=20_000_000,w=bbox[2]-bbox[0],h=bbox[3]-bbox[1];let useRs=rs,useBBox=bbox;if(w*h>maxPixels){const f=Math.sqrt(maxPixels/(w*h));useRs=rs*f;useBBox=[Math.floor(px0*useRs),Math.floor(py0*useRs),Math.ceil(px1*useRs),Math.ceil(py1*useRs)]}const pix=new mupdf.Pixmap(mupdf.ColorSpace.DeviceRGB,useBBox,false);let dev=null;try{dev=new mupdf.DrawDevice(mupdf.Matrix.scale(useRs,useRs),pix);p.run(dev,mupdf.Matrix.scale(useRs,useRs));try{dev.close?.()}catch(_){}const png=pix.asPNG();if(detailUrl)URL.revokeObjectURL(detailUrl);detailUrl=URL.createObjectURL(new Blob([png],{type:'image/png'}));detail.src=detailUrl;await detail.decode();detail.style.display='block';detail.style.left=x0+'px';detail.style.top=y0+'px';detail.style.width=(x1-x0)+'px';detail.style.height=(y1-y0)+'px';status.textContent=`Nitidez visible actualizada · zoom ${Math.round(zoom*100)}% · tile ${Math.round(x1-x0)}×${Math.round(y1-y0)} base · raster ${(useRs/baseRs).toFixed(2)}×.`}finally{try{dev?.destroy?.()}catch(_){}try{pix.destroy?.()}catch(_){}p.destroy?.()}}catch(e){clearDetail();status.textContent='No pude renderizar el tile: '+e.message}finally{rendering=false;setButtons()}}
async function renderPage(){clearDetail();const p=doc.loadPage(0),rr=refs(p);let raw=0;for(const r of rr){try{raw+=U(r.readRawStream()).length}catch(_){}}massive=raw>=5_000_000;pageBounds=p.getBounds();pageW=pageBounds[2]-pageBounds[0];pageH=pageBounds[3]-pageBounds[1];const maxDim=1600;baseRs=Math.min(1.1,maxDim/Math.max(pageW,pageH));const pm=p.toPixmap(mupdf.Matrix.scale(baseRs,baseRs),mupdf.ColorSpace.DeviceRGB,false,true),png=pm.asPNG();baseW=pm.getWidth?.()||Math.round(pageW*baseRs);baseH=pm.getHeight?.()||Math.round(pageH*baseRs);try{pm.destroy?.()}catch(_){}p.destroy?.();if(baseUrl)URL.revokeObjectURL(baseUrl);baseUrl=URL.createObjectURL(new Blob([png],{type:'image/png'}));img.src=baseUrl;await img.decode();img.style.width=baseW+'px';img.style.height=baseH+'px';overlay.width=baseW;overlay.height=baseH;overlay.style.width=baseW+'px';overlay.style.height=baseH+'px';stage.style.width=baseW+'px';stage.style.height=baseH+'px';$('#mode').textContent=massive?'Modo masivo':'Modo normal';setButtons();requestAnimationFrame(fit);status.innerHTML=massive?'<span class="badge">PDF masivo detectado.</span> Vista general ligera. Muévete/zoom sin coste; «Actualizar nitidez visible» renderiza únicamente el sector que ves.':'PDF abierto.'}
async function openPdf(){if(!('showOpenFilePicker'in window))throw new Error('Usa Chrome o Edge.');const [h]=await showOpenFilePicker({multiple:false,types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]});const f=await h.getFile();try{doc?.destroy?.()}catch(_){}doc=mupdf.PDFDocument.openDocument(new Uint8Array(await f.arrayBuffer()),'application/pdf');handle=h;pending=false;seed=null;await renderPage()}
$('#open').addEventListener('click',async()=>{try{await openPdf()}catch(e){if(e?.name!=='AbortError')status.textContent='Error: '+e.message}});$('#zoom').addEventListener('input',e=>setZoomAt(Number(e.target.value)/100));$('#plus').addEventListener('click',()=>setZoomAt(zoom*1.25));$('#minus').addEventListener('click',()=>setZoomAt(zoom/1.25));$('#fit').addEventListener('click',fit);$('#z100').addEventListener('click',()=>setZoomAt(1));$('#sharp').addEventListener('click',renderVisibleSharp);
viewport.addEventListener('wheel',e=>{if(!doc)return;e.preventDefault();const r=viewport.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top;setZoomAt(zoom*Math.exp(-e.deltaY*.0017),cx,cy)},{passive:false});let dragging=false,lastX=0,lastY=0;viewport.addEventListener('mousedown',e=>{if(e.button!==1)return;e.preventDefault();clearDetail();dragging=true;lastX=e.clientX;lastY=e.clientY;viewport.classList.add('pan')});window.addEventListener('mousemove',e=>{if(!dragging)return;panX+=e.clientX-lastX;panY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;applyTransform()});window.addEventListener('mouseup',e=>{if(e.button===1){dragging=false;viewport.classList.remove('pan')}});viewport.addEventListener('auxclick',e=>{if(e.button===1)e.preventDefault()});
function drawSeed(){const c=overlay.getContext('2d');c.clearRect(0,0,overlay.width,overlay.height);if(!seed)return;c.lineWidth=Math.max(1,2/zoom);c.strokeStyle='rgba(0,160,255,.95)';c.beginPath();c.arc(seed.x,seed.y,Math.max(3,7/zoom),0,Math.PI*2);c.moveTo(seed.x-10/zoom,seed.y);c.lineTo(seed.x+10/zoom,seed.y);c.moveTo(seed.x,seed.y-10/zoom);c.lineTo(seed.x,seed.y+10/zoom);c.stroke()}
overlay.addEventListener('click',e=>{if(!doc)return;const r=overlay.getBoundingClientRect();seed={x:(e.clientX-r.left)*(baseW/r.width),y:(e.clientY-r.top)*(baseH/r.height)};drawSeed();status.textContent=`Arco marcado en la vista. Zoom ${Math.round(zoom*100)}%.`});$('#select').addEventListener('click',()=>{status.textContent=seed?'Semilla marcada.':'Haz clic directamente sobre un arco.'});$('#delete').addEventListener('click',()=>{});$('#save').addEventListener('click',async()=>{if(!handle||!pending||!doc)return;try{const b=doc.saveToBuffer('garbage=4,compress=yes,appearance=yes'),w=await handle.createWritable();await w.write(new Uint8Array(U(b)));await w.close();pending=false;setButtons();status.textContent='Cambios guardados.'}catch(e){status.textContent='Error al guardar: '+e.message}});window.addEventListener('resize',()=>{if(doc&&zoom<1.05)fit()});
</script></body></html>
