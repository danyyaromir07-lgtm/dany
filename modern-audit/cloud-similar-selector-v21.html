<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selector de nubes v21</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="./cloud-similar-selector-v17.html?v=20260901-clickoverlay1"></iframe><script>
const frame=document.getElementById('app');let lastClick=null,lastSelection=null;
function waitForApp(){const d=frame.contentDocument;if(!d||!d.querySelector('#overlay')||!d.querySelector('#detail')){setTimeout(waitForApp,80);return}install(d)}
function isRedFamily(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),ch=mx-mn;if(r<115||ch<24)return false;const sat=ch/Math.max(1,mx),lead=r-Math.max(g,b);return sat>.11&&lead>12&&r>g*1.045&&r>b*1.04}
function compatible(r,g,b,sr,sg,sb){if(!isRedFamily(r,g,b))return false;const sum=Math.max(1,r+g+b),ss=Math.max(1,sr+sg+sb);const dr=r/sum-sr/ss,dg=g/sum-sg/ss,db=b/sum-sb/ss;const chroma=Math.hypot(dr,dg,db);const lead=Math.min(r-g,r-b),seedLead=Math.min(sr-sg,sr-sb);return chroma<=.135&&lead>=Math.max(10,seedLead*.30)&&lead<=Math.max(70,seedLead*3.2)}
function boxGap(a,b){const dx=a.maxx<b.minx?b.minx-a.maxx:b.maxx<a.minx?a.minx-b.maxx:0;const dy=a.maxy<b.miny?b.miny-a.maxy:b.maxy<a.miny?a.miny-b.maxy:0;return Math.hypot(dx,dy)}
function selectLocal(d,clientX,clientY){const detail=d.querySelector('#detail'),overlay=d.querySelector('#overlay'),viewport=d.querySelector('#viewport'),status=d.querySelector('#status'),del=d.querySelector('#delete');if(!detail||detail.style.display==='none'||!detail.src||!detail.naturalWidth){status.textContent='Primero pulsa «Actualizar nitidez visible» y luego haz clic sobre un arco.';return}const dr=detail.getBoundingClientRect(),vr=viewport.getBoundingClientRect();if(clientX<dr.left||clientX>dr.right||clientY<dr.top||clientY>dr.bottom){status.textContent='El clic quedó fuera del tile nítido. Actualiza la nitidez y vuelve a clicar.';return}const nw=detail.naturalWidth,nh=detail.naturalHeight,ix=(clientX-dr.left)*nw/dr.width,iy=(clientY-dr.top)*nh/dr.height,half=310,sx=Math.max(0,Math.floor(ix-half)),sy=Math.max(0,Math.floor(iy-half)),ex=Math.min(nw,Math.ceil(ix+half)),ey=Math.min(nh,Math.ceil(iy+half)),w=ex-sx,h=ey-sy;if(w<8||h<8)return;const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(detail,sx,sy,w,h,0,0,w,h);let data;try{data=cx.getImageData(0,0,w,h).data}catch(e){status.textContent='No pude leer el tile: '+e.message;return}const lx=Math.round(ix-sx),ly=Math.round(iy-sy),srch=76;let seed=-1,best=1e9,sr=0,sg=0,sb=0;for(let y=Math.max(0,ly-srch);y<=Math.min(h-1,ly+srch);y++)for(let x=Math.max(0,lx-srch);x<=Math.min(w-1,lx+srch);x++){const p=y*w+x,i=p*4,r=data[i],g=data[i+1],b=data[i+2];if(!isRedFamily(r,g,b))continue;const dd=(x-lx)*(x-lx)+(y-ly)*(y-ly);if(dd<best){best=dd;seed=p;sr=r;sg=g;sb=b}}if(seed<0){status.textContent='No encontré rojo de nube cerca. Haz clic sobre el contorno rojo.';return}const n=w*h,mask=new Uint8Array(n);for(let p=0,i=0;p<n;p++,i+=4)if(compatible(data[i],data[i+1],data[i+2],sr,sg,sb))mask[p]=1;
const labels=new Int32Array(n);labels.fill(-1);const comps=[];const q=new Int32Array(n);for(let p0=0;p0<n;p0++){if(!mask[p0]||labels[p0]>=0)continue;let qh=0,qt=0;q[qt++]=p0;labels[p0]=comps.length;let minx=w,miny=h,maxx=0,maxy=0,count=0;while(qh<qt){const p=q[qh++],y=(p/w)|0,x=p-y*w;count++;if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;for(let yy=Math.max(0,y-1);yy<=Math.min(h-1,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(w-1,x+1);xx++){const np=yy*w+xx;if(mask[np]&&labels[np]<0){labels[np]=comps.length;q[qt++]=np}}}comps.push({id:comps.length,minx,miny,maxx,maxy,count});}const seedComp=labels[seed];if(seedComp<0){status.textContent='No pude asociar el clic con un componente rojo.';return}
const chosen=new Set([seedComp]);let box={...comps[seedComp]},changed=true;while(changed){changed=false;let bestId=-1,bestGap=1e9,bestBox=null;for(const cp of comps){if(chosen.has(cp.id)||cp.count<4)continue;let gap=1e9;for(const id of chosen)gap=Math.min(gap,boxGap(comps[id],cp));if(gap>13)continue;const nb={minx:Math.min(box.minx,cp.minx),miny:Math.min(box.miny,cp.miny),maxx:Math.max(box.maxx,cp.maxx),maxy:Math.max(box.maxy,cp.maxy)};const bw=nb.maxx-nb.minx+1,bh=nb.maxy-nb.miny+1,aspect=Math.max(bw,bh)/Math.max(1,Math.min(bw,bh));const cx0=(nb.minx+nb.maxx)/2,cy0=(nb.miny+nb.maxy)/2,seedY=(seed/w)|0,seedX=seed-seedY*w;if(bw>250||bh>250||aspect>3.1||Math.hypot(cx0-seedX,cy0-seedY)>145)continue;if(gap<bestGap){bestGap=gap;bestId=cp.id;bestBox=nb}}if(bestId>=0){chosen.add(bestId);box=bestBox;changed=true}}
let orig=0;for(const id of chosen)orig+=comps[id].count;const bw=box.maxx-box.minx+1,bh=box.maxy-box.miny+1,aspect=Math.max(bw,bh)/Math.max(1,Math.min(bw,bh));if(orig<24){status.textContent=`Solo reconstruí ${orig} px; prueba en otro arco de la misma nube.`;return}if(bw>250||bh>250||aspect>3.1){status.textContent=`La reconstrucción creció demasiado (${bw}×${bh}); la descarté.`;return}const sel=document.createElement('canvas');sel.width=w;sel.height=h;const sc=sel.getContext('2d'),im=sc.createImageData(w,h);for(let p=0,i=0;p<n;p++,i+=4){const id=labels[p];if(id>=0&&chosen.has(id)){im.data[i]=0;im.data[i+1]=155;im.data[i+2]=255;im.data[i+3]=230}}sc.putImageData(im,0,0);const dpr=Number(overlay.dataset.dpr||1),oc=overlay.getContext('2d');oc.save();oc.setTransform(dpr,0,0,dpr,0,0);const destX=dr.left-vr.left+(sx/nw)*dr.width,destY=dr.top-vr.top+(sy/nh)*dr.height,destW=w/nw*dr.width,destH=h/nh*dr.height;oc.drawImage(sel,destX,destY,destW,destH);oc.restore();lastSelection={pixels:orig,bbox:[box.minx,box.miny,box.maxx,box.maxy],components:[...chosen],seedRGB:[sr,sg,sb]};if(del)del.disabled=true;status.textContent=`Nube visual reconstruida · ${orig} px · ${chosen.size} componentes · bbox ${bw}×${bh} · semilla rgb(${sr},${sg},${sb}) · v21 unión local por proximidad. Eliminar sigue bloqueado hasta mapeo estructural seguro.`}
function install(d){const overlay=d.querySelector('#overlay'),select=d.querySelector('#select'),status=d.querySelector('#status');if(overlay.dataset.v21Installed)return;overlay.dataset.v21Installed='1';overlay.addEventListener('click',e=>{lastClick={x:e.clientX,y:e.clientY};setTimeout(()=>selectLocal(d,e.clientX,e.clientY),0)});if(select)select.addEventListener('click',()=>{if(lastClick)selectLocal(d,lastClick.x,lastClick.y);else status.textContent='Haz clic directamente sobre un arco.'});status.textContent='v21 · reconstrucción local de nube a partir de componentes rojos próximos.'}
frame.addEventListener('load',()=>setTimeout(waitForApp,100));setTimeout(waitForApp,300);
</script></body></html>
