<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selector de nubes v10</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0f0f10;color:#eee;font:14px system-ui}.top{height:54px;position:fixed;inset:0 0 auto 0;z-index:20;background:#18191b;border-bottom:1px solid #444;display:flex;align-items:center;gap:7px;padding:7px 9px;white-space:nowrap}.top button,.top input{font:inherit}.top button{height:34px;padding:0 10px}.top button:disabled{opacity:.45}.sep{width:1px;height:30px;background:#444;margin:0 2px}.zoomBox{display:flex;align-items:center;gap:5px;border:1px solid #4b4d50;border-radius:6px;padding:3px 6px;background:#222427}.zoomBox input[type=range]{width:145px}.zoomPct{width:58px;text-align:right;font-variant-numeric:tabular-nums}.mode{padding:6px 8px;border-radius:5px;background:#2a2c2f}.main{position:fixed;inset:54px 0 0 0;display:grid;grid-template-rows:auto 1fr;min-height:0}.status{min-height:42px;padding:9px 12px;background:#202226;border-bottom:1px solid #35373a;white-space:pre-wrap}.viewport{position:relative;overflow:hidden;background:#151515;cursor:crosshair;touch-action:none;user-select:none}.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.page{display:block;background:#fff;box-shadow:0 0 0 1px #666;pointer-events:none}.overlay{position:absolute;inset:0;pointer-events:auto}.pan{cursor:grabbing!important}.badge{color:#ffd27a}.hint{opacity:.75}.kbd{padding:1px 5px;border:1px solid #666;border-radius:4px;background:#282a2d}
</style></head><body><div class="top">
<button id="open">Abrir PDF editable</button><button id="select" disabled>Seleccionar similares</button><button id="delete" disabled>Eliminar grupo</button><button id="save" disabled>Guardar cambios</button><div class="sep"></div>
<div class="zoomBox"><button id="minus" title="Alejar">−</button><input id="zoom" type="range" min="25" max="800" step="5" value="100"><span id="zoomPct" class="zoomPct">100%</span><button id="plus" title="Acercar">+</button><button id="fit">Ajustar</button><button id="z100">100%</button></div><div class="sep"></div><span id="mode" class="mode">Sin PDF</span>
</div><div class="main"><div id="status" class="status">v10 · controles siempre visibles · rueda = zoom · botón central = mover el plano.</div><div id="viewport" class="viewport"><div id="stage" class="stage"><img id="page" class="page" alt=""><canvas id="overlay" class="overlay"></canvas></div></div></div>
<script type="module">
import * as mupdf from 'https://cdn.jsdelivr.net/npm/mupdf@1.28.0/dist/mupdf.js';
const $=s=>document.querySelector(s),U=b=>b?.asUint8Array?.()||b,resolve=o=>{try{return o?.resolve?.()||o}catch(_){return o}};
let doc=null,handle=null,pngUrl=null,baseW=1,baseH=1,zoom=1,panX=0,panY=0,massive=false,pending=false;
const viewport=$('#viewport'),stage=$('#stage'),img=$('#page'),overlay=$('#overlay'),status=$('#status');
function refs(page){try{const c=resolve(page.getObject()?.get?.('Contents'));if(!c)return[];if(c?.isStream?.())return[c];if(c?.isArray?.()){const a=[];for(let i=0;i<Number(c.length||0);i++){const r=resolve(c.get(i));if(r?.isStream?.())a.push(r)}return a}return[]}catch(_){return[]}}
function setButtons(){const has=!!doc;$('#select').disabled=!has||massive;$('#delete').disabled=true;$('#save').disabled=!handle||!pending}
function applyTransform(){stage.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;$('#zoom').value=String(Math.round(zoom*100));$('#zoomPct').textContent=Math.round(zoom*100)+'%'}
function clampZoom(z){return Math.max(.25,Math.min(8,z))}
function setZoomAt(z,cx,cy){z=clampZoom(z);const old=zoom;if(!Number.isFinite(cx)){cx=viewport.clientWidth/2;cy=viewport.clientHeight/2}const sx=(cx-panX)/old,sy=(cy-panY)/old;zoom=z;panX=cx-sx*zoom;panY=cy-sy*zoom;applyTransform()}
function fit(){if(!baseW||!baseH)return;const pad=20,z=Math.min((viewport.clientWidth-pad*2)/baseW,(viewport.clientHeight-pad*2)/baseH);zoom=clampZoom(z);panX=(viewport.clientWidth-baseW*zoom)/2;panY=(viewport.clientHeight-baseH*zoom)/2;applyTransform()}
async function renderPage(){const p=doc.loadPage(0),rr=refs(p);let raw=0;for(const r of rr){try{raw+=U(r.readRawStream()).length}catch(_){}}massive=raw>=5_000_000;const b=p.getBounds(),w=b[2]-b[0],h=b[3]-b[1],maxDim=1900,rs=Math.min(1.25,maxDim/Math.max(w,h));const pm=p.toPixmap(mupdf.Matrix.scale(rs,rs),mupdf.ColorSpace.DeviceRGB,false,true),png=pm.asPNG();baseW=pm.getWidth?.()||Math.max(1,Math.round(w*rs));baseH=pm.getHeight?.()||Math.max(1,Math.round(h*rs));try{pm.destroy?.()}catch(_){}if(pngUrl)URL.revokeObjectURL(pngUrl);pngUrl=URL.createObjectURL(new Blob([png],{type:'image/png'}));img.src=pngUrl;await img.decode();img.width=baseW;img.height=baseH;overlay.width=baseW;overlay.height=baseH;overlay.style.width=baseW+'px';overlay.style.height=baseH+'px';stage.style.width=baseW+'px';stage.style.height=baseH+'px';p.destroy?.();$('#mode').textContent=massive?'Modo masivo':'Modo normal';setButtons();requestAnimationFrame(fit);if(massive){status.innerHTML='<span class="badge">PDF masivo detectado.</span> /Contents comprimido≈'+(raw/1048576).toFixed(1)+' MB. El visor usa la ruta estable: no construye millones de paths. Los controles permanecen visibles. Selección/eliminación masiva seguirá bloqueada hasta que el parser por streaming pueda mapear el clic sin cargar todo el contenido.'}else{status.textContent='PDF abierto. Usa la rueda para zoom (25%–800%), botón central para mover y clic izquierdo para la selección.'}}
async function openPdf(){if(!('showOpenFilePicker'in window))throw new Error('Usa Chrome o Edge para abrir con permiso de escritura.');const [h]=await showOpenFilePicker({multiple:false,types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]});const f=await h.getFile();try{doc?.destroy?.()}catch(_){}doc=mupdf.PDFDocument.openDocument(new Uint8Array(await f.arrayBuffer()),'application/pdf');handle=h;pending=false;await renderPage()}
$('#open').addEventListener('click',async()=>{try{await openPdf()}catch(e){if(e?.name!=='AbortError')status.textContent='Error: '+e.message}});
$('#zoom').addEventListener('input',e=>setZoomAt(Number(e.target.value)/100));$('#plus').addEventListener('click',()=>setZoomAt(zoom*1.25));$('#minus').addEventListener('click',()=>setZoomAt(zoom/1.25));$('#fit').addEventListener('click',fit);$('#z100').addEventListener('click',()=>setZoomAt(1));
viewport.addEventListener('wheel',e=>{if(!doc)return;e.preventDefault();const r=viewport.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top,f=Math.exp(-e.deltaY*.0017);setZoomAt(zoom*f,cx,cy)},{passive:false});
let dragging=false,lastX=0,lastY=0;viewport.addEventListener('mousedown',e=>{if(e.button!==1)return;e.preventDefault();dragging=true;lastX=e.clientX;lastY=e.clientY;viewport.classList.add('pan')});window.addEventListener('mousemove',e=>{if(!dragging)return;panX+=e.clientX-lastX;panY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;applyTransform()});window.addEventListener('mouseup',e=>{if(e.button===1){dragging=false;viewport.classList.remove('pan')}});viewport.addEventListener('auxclick',e=>{if(e.button===1)e.preventDefault()});
overlay.addEventListener('click',e=>{if(!doc||massive)return;status.textContent='Clic de selección recibido. En modo normal, la selección estructural se conectará al motor seguro; en modo masivo se hará mediante streaming.'});
$('#select').addEventListener('click',()=>{if(!doc)return;status.textContent=massive?'Modo masivo: selección global desactivada para evitar bloqueo.':'Selecciona primero un arco con clic izquierdo.'});
$('#delete').addEventListener('click',()=>{});$('#save').addEventListener('click',async()=>{if(!handle||!pending||!doc)return;try{const b=doc.saveToBuffer('garbage=4,compress=yes,appearance=yes'),w=await handle.createWritable();await w.write(new Uint8Array(U(b)));await w.close();pending=false;setButtons();status.textContent='Cambios guardados en el archivo original.'}catch(e){status.textContent='Error al guardar: '+e.message}});
window.addEventListener('resize',()=>{if(doc&&zoom<1.05)fit()});
</script></body></html>
