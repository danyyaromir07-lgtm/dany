<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selector de nubes v57 · memoria segura</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f0f10;color:#eee;font:14px system-ui}.shell{display:grid;grid-template-columns:300px minmax(0,1fr);width:100%;height:100%}.side{min-width:0;background:#18191b;border-right:1px solid #444;display:grid;grid-template-rows:auto auto auto 1fr;gap:8px;padding:10px;overflow:hidden}.side h1{font-size:15px;margin:0}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:6px}.toolbar button,.side input{font:inherit;height:34px}.toolbar button{padding:0 9px}.side input{width:100%;padding:0 9px;background:#222427;color:#eee;border:1px solid #4b4d50;border-radius:5px}.meta{display:flex;justify-content:space-between;align-items:center;color:#bbb;font-size:12px}.list{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px}.fileRow{width:100%;border:1px solid #34363a;background:#222427;color:#eee;border-radius:5px;padding:7px 8px;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;cursor:pointer}.fileRow:hover{background:#2b2d31}.fileRow.active{border-color:#7aa7ff;background:#26344d}.fileName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fileState{font-size:11px;color:#aaa;white-space:nowrap}.fileState.saved{color:#8fd39b}.fileState.dirty{color:#ffd27a}.fileState.activeState{color:#9fc0ff}.fileState.discarded{color:#e9a0a0}.viewer{min-width:0;min-height:0;background:#0f0f10}.viewer iframe{border:0;width:100%;height:100%;display:block}.hint{color:#aaa;font-size:11px;line-height:1.35}@media(max-width:850px){.shell{grid-template-columns:240px minmax(0,1fr)}}
</style></head><body><div class="shell"><aside class="side"><h1>Lote de PDFs</h1><div class="toolbar"><button id="batch" type="button">Cargar PDFs</button><button id="prev" type="button" disabled>←</button><button id="next" type="button" disabled>→</button></div><input id="search" type="search" placeholder="Buscar archivo…"><div class="meta"><span id="count">0 / 0</span><span class="hint">Solo 1 PDF en memoria</span></div><div id="fileList" class="list"></div></aside><main class="viewer"><iframe id="app" src="./cloud-similar-selector-v57-core.html?v=20260902-delete-save2" allow="fullscreen"></iframe></main></div><script>
const frame=document.getElementById('app');
const listEl=document.getElementById('fileList');
const countEl=document.getElementById('count');
const searchEl=document.getElementById('search');
const batchBtn=document.getElementById('batch');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
let entries=[];
let activeIndex=-1;
let queuedHandle=null;
let child=null;
let childDoc=null;
let saveObserver=null;
let nativeChildPicker=null;
let switchSerial=0;
function stateClass(state){if(state==='Guardado')return'saved';if(state==='Modificado'||state==='Guardando…')return'dirty';if(state==='Activo'||state==='Cargando…')return'activeState';if(state==='Descartado')return'discarded';return''}
function renderList(){const q=searchEl.value.trim().toLowerCase();listEl.textContent='';entries.forEach((entry,i)=>{if(q&&!entry.name.toLowerCase().includes(q))return;const row=document.createElement('button');row.type='button';row.className='fileRow'+(i===activeIndex?' active':'');row.title=entry.name;const name=document.createElement('span');name.className='fileName';name.textContent=entry.name;const state=document.createElement('span');state.className='fileState '+stateClass(entry.state);state.textContent=entry.state;row.append(name,state);row.addEventListener('click',()=>activate(i));listEl.appendChild(row)});countEl.textContent=entries.length?(activeIndex>=0?(activeIndex+1)+' / '+entries.length:'0 / '+entries.length):'0 / 0';prevBtn.disabled=activeIndex<=0;nextBtn.disabled=activeIndex<0||activeIndex>=entries.length-1}
function setEntryState(i,state){if(i<0||!entries[i])return;entries[i].state=state;renderList()}
function setChildFileName(name){if(!childDoc)return;let badge=childDoc.getElementById('activeFileName');const top=childDoc.querySelector('.top');if(!top)return;if(!badge){badge=childDoc.createElement('span');badge.id='activeFileName';badge.className='mode';badge.style.maxWidth='360px';badge.style.overflow='hidden';badge.style.textOverflow='ellipsis';badge.style.display='inline-block';badge.style.verticalAlign='middle';top.appendChild(badge)}const n=String(name||'—');badge.textContent='Archivo: '+n;badge.title=n}
function hasUnsaved(){const b=childDoc&&childDoc.querySelector('#save');return!!(b&&!b.disabled)}
function installChildHooks(){child=frame.contentWindow;childDoc=child.document;const top=childDoc.querySelector('.top');if(!top)return;setChildFileName(activeIndex>=0?entries[activeIndex].name:'—');nativeChildPicker=child.showOpenFilePicker&&child.showOpenFilePicker.bind(child);if(nativeChildPicker){const intercept=async(...args)=>{if(queuedHandle){const h=queuedHandle;queuedHandle=null;return[h]}return nativeChildPicker(...args)};try{child.showOpenFilePicker=intercept}catch(_){try{Object.defineProperty(child,'showOpenFilePicker',{configurable:true,writable:true,value:intercept})}catch(__){}}}const save=childDoc.querySelector('#save');if(save){save.addEventListener('click',()=>{if(activeIndex>=0&&!save.disabled)setEntryState(activeIndex,'Guardando…')},true);saveObserver?.disconnect();saveObserver=new MutationObserver(()=>{if(activeIndex<0)return;if(save.disabled&&entries[activeIndex]?.state==='Guardando…')setEntryState(activeIndex,'Guardado');else if(!save.disabled&&entries[activeIndex]?.state!=='Guardando…')setEntryState(activeIndex,'Modificado')});saveObserver.observe(save,{attributes:true,attributeFilter:['disabled']})}}
async function activate(i){if(i<0||i>=entries.length||i===activeIndex||!childDoc)return;if(activeIndex>=0&&hasUnsaved()){const old=entries[activeIndex];const ok=confirm('Hay cambios sin guardar en “'+old.name+'”.\n\nSi cambias de PDF ahora, esos cambios se descartarán.\n\n¿Continuar?');if(!ok)return;old.state='Descartado'}else if(activeIndex>=0&&entries[activeIndex].state==='Activo'){entries[activeIndex].state='Revisado'}const serial=++switchSerial;activeIndex=i;entries[i].state='Cargando…';queuedHandle=entries[i].handle;setChildFileName(entries[i].name);renderList();const open=childDoc.querySelector('#open');if(!open){entries[i].state='Error';renderList();return}open.click();setTimeout(()=>{if(serial!==switchSerial||activeIndex!==i)return;if(queuedHandle){queuedHandle=null;entries[i].state='Error';renderList();return}if(entries[i].state==='Cargando…')entries[i].state=hasUnsaved()?'Modificado':'Activo';renderList()},900)}
async function loadBatch(){if(!window.showOpenFilePicker){alert('La carga por lote con guardado directo requiere un navegador compatible con File System Access API (por ejemplo Chrome o Edge).');return}if(activeIndex>=0&&hasUnsaved()){const ok=confirm('Hay cambios sin guardar en el PDF activo. ¿Descartarlos y cargar un lote nuevo?');if(!ok)return}try{const handles=await window.showOpenFilePicker({multiple:true,types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]});if(!handles?.length)return;entries=handles.map(h=>({handle:h,name:h.name||'PDF sin nombre',state:'Sin abrir'}));activeIndex=-1;queuedHandle=null;searchEl.value='';renderList();await activate(0)}catch(e){if(e&&e.name!=='AbortError')alert('No pude cargar el lote: '+(e.message||e))}}
batchBtn.addEventListener('click',loadBatch);searchEl.addEventListener('input',renderList);prevBtn.addEventListener('click',()=>activate(activeIndex-1));nextBtn.addEventListener('click',()=>activate(activeIndex+1));frame.addEventListener('load',()=>{try{installChildHooks()}catch(e){console.error('v52 batch hooks',e)}});window.addEventListener('beforeunload',e=>{if(hasUnsaved()){e.preventDefault();e.returnValue=''}});renderList();
</script></body></html>
