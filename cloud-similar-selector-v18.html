<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selector de nubes v18</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="./cloud-similar-selector-v17.html?v=20260901-clickoverlay1"></iframe><script>
const frame=document.getElementById('app');
let lastClick=null,lastSelection=null;
function waitForApp(){const d=frame.contentDocument;if(!d||!d.querySelector('#overlay')||!d.querySelector('#detail')){setTimeout(waitForApp,80);return}install(d)}
function redish(r,g,b){return r>125&&(r-g)>12&&(r-b)>8&&r>g*1.05&&r>b*1.03}
function selectLocal(d,clientX,clientY){const detail=d.querySelector('#detail'),overlay=d.querySelector('#overlay'),viewport=d.querySelector('#viewport'),status=d.querySelector('#status'),del=d.querySelector('#delete');if(!detail||detail.style.display==='none'||!detail.src||!detail.naturalWidth){status.textContent='Primero pulsa «Actualizar nitidez visible» y luego haz clic sobre un arco.';return}const dr=detail.getBoundingClientRect(),vr=viewport.getBoundingClientRect();if(clientX<dr.left||clientX>dr.right||clientY<dr.top||clientY>dr.bottom){status.textContent='El clic quedó fuera del tile nítido. Actualiza la nitidez en esta zona y vuelve a clicar.';return}const nw=detail.naturalWidth,nh=detail.naturalHeight,ix=(clientX-dr.left)*nw/dr.width,iy=(clientY-dr.top)*nh/dr.height;const half=280,sx=Math.max(0,Math.floor(ix-half)),sy=Math.max(0,Math.floor(iy-half)),ex=Math.min(nw,Math.ceil(ix+half)),ey=Math.min(nh,Math.ceil(iy+half)),w=ex-sx,h=ey-sy;if(w<8||h<8)return;const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(detail,sx,sy,w,h,0,0,w,h);let data;try{data=cx.getImageData(0,0,w,h).data}catch(e){status.textContent='No pude leer el tile para seleccionar el arco: '+e.message;return}const n=w*h,mask=new Uint8Array(n),dil=new Uint8Array(n);for(let p=0,i=0;p<n;p++,i+=4){if(redish(data[i],data[i+1],data[i+2]))mask[p]=1}for(let y=2;y<h-2;y++)for(let x=2;x<w-2;x++){const p=y*w+x;if(!mask[p])continue;for(let yy=y-2;yy<=y+2;yy++)for(let xx=x-2;xx<=x+2;xx++)dil[yy*w+xx]=1}const lx=Math.round(ix-sx),ly=Math.round(iy-sy);let seed=-1,best=1e9;const sr=70;for(let y=Math.max(0,ly-sr);y<=Math.min(h-1,ly+sr);y++)for(let x=Math.max(0,lx-sr);x<=Math.min(w-1,lx+sr);x++){const p=y*w+x;if(!mask[p])continue;const dd=(x-lx)*(x-lx)+(y-ly)*(y-ly);if(dd<best){best=dd;seed=p}}if(seed<0){status.textContent='No encontré un trazo rojo suficientemente cerca del clic. Haz clic exactamente sobre el contorno rojo.';return}const q=new Int32Array(n),seen=new Uint8Array(n);let qh=0,qt=0;q[qt++]=seed;seen[seed]=1;let minx=w,miny=h,maxx=0,maxy=0,orig=0;while(qh<qt){const p=q[qh++],y=(p/w)|0,x=p-y*w;if(mask[p]){orig++;if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y}for(let yy=Math.max(0,y-1);yy<=Math.min(h-1,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(w-1,x+1);xx++){const np=yy*w+xx;if(!seen[np]&&dil[np]){seen[np]=1;q[qt++]=np}}}if(orig<12){status.textContent='El trazo encontrado es demasiado pequeño para considerarlo un arco.';return}if((maxx-minx+1)*(maxy-miny+1)>w*h*.55){status.textContent='La selección local se extendió demasiado; no la consideraré segura.';return}const sel=document.createElement('canvas');sel.width=w;sel.height=h;const sc=sel.getContext('2d'),im=sc.createImageData(w,h);for(let p=0,i=0;p<n;p++,i+=4){if(seen[p]&&mask[p]){im.data[i]=0;im.data[i+1]=155;im.data[i+2]=255;im.data[i+3]=220}}sc.putImageData(im,0,0);const dpr=Number(overlay.dataset.dpr||1),oc=overlay.getContext('2d');oc.save();oc.setTransform(dpr,0,0,dpr,0,0);const destX=dr.left-vr.left+(sx/nw)*dr.width,destY=dr.top-vr.top+(sy/nh)*dr.height,destW=w/nw*dr.width,destH=h/nh*dr.height;oc.drawImage(sel,destX,destY,destW,destH);oc.restore();lastSelection={pixels:orig,bbox:[minx,miny,maxx,maxy],screen:[clientX,clientY]};if(del)del.disabled=true;status.textContent=`Arco visual seleccionado · ${orig} píxeles de trazo · análisis local ${w}×${h}. Eliminar grupo sigue bloqueado hasta tener mapeo estructural seguro.`}
function install(d){const overlay=d.querySelector('#overlay'),select=d.querySelector('#select'),status=d.querySelector('#status');if(overlay.dataset.v18Installed)return;overlay.dataset.v18Installed='1';overlay.addEventListener('click',e=>{lastClick={x:e.clientX,y:e.clientY};setTimeout(()=>selectLocal(d,e.clientX,e.clientY),0)});if(select)select.addEventListener('click',()=>{if(lastClick)selectLocal(d,lastClick.x,lastClick.y);else status.textContent='Haz clic directamente sobre un arco.'});status.textContent='v18 · clic local sobre arco · sin escaneo global del PDF.'}
frame.addEventListener('load',()=>setTimeout(waitForApp,100));setTimeout(waitForApp,300);
</script></body></html>
