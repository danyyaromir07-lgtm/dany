name: Heavy PDF causal budget
on: push
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('selector-nubes-multistream-core.html')
          s=p.read_text()
          old="ranked.sort((a,b)=>a.c-b.c);const totalUnique=ranked.length;\n   for(let q=0;q<ranked.length;q++){missing=deficits();if(!missing.size)break;const beforeTested=tested;await testIdx(ranked[q].idx,'Búsqueda causal exhaustiva '+(q+1)+'/'+totalUnique+' operadores únicos');if(tested>beforeTested)expanded++;if(q%6===0)await uiYield()}"
          new="ranked.sort((a,b)=>a.c-b.c);const totalUnique=ranked.length,causalBudget=Math.min(totalUnique,Math.max(96,Math.min(320,initialMissing*32)));\n   for(let q=0;q<causalBudget;q++){missing=deficits();if(!missing.size)break;const beforeTested=tested;await testIdx(ranked[q].idx,'Búsqueda causal dirigida '+(q+1)+'/'+causalBudget+' mejores de '+totalUnique);if(tested>beforeTested)expanded++;if(q%6===0)await uiYield()}"
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          elif 'Búsqueda causal dirigida' not in s:
              raise SystemExit('causal target not found')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/core.mjs').write_text(m.group(1))
          assert 'causalBudget=Math.min(totalUnique' in s
          PY
          node --check /tmp/core.mjs
      - name: Commit if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selector-nubes-multistream-core.html
          git diff --cached --quiet && exit 0
          git commit -m 'Bound causal fallback on huge PDFs'
          git push
