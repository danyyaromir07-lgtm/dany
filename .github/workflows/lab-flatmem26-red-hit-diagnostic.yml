name: Lab flatmem26 red hit diagnostic
on:
  push:
    branches:
      - lab/v2.1-flatmem26-red-hit-diagnostic
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v2.1-flatmem26-red-hit-diagnostic
      - name: Add red hit diagnostics only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lab-selector-v4/selector-nubes-multistream-core.html')
          w=Path('lab-selector-v4/index.html')
          s=p.read_text(); h=w.read_text()
          old=":(redSeedFlag?' · DBG red=1 redBroad='+redBroad.length+' redGroups='+redGroups.length+' redSeed='+redSeed.length+' redSafe='+(redSafe?'1':'0')+' rgb='+dbgRgb:' · DBG blackSeed=0 rgb='+dbgRgb))}"
          new=":(redSeedFlag?' · DBG red=1 redBroad='+redBroad.length+' redGroups='+redGroups.length+' redSeed='+redSeed.length+' redSafe='+(redSafe?'1':'0')+' rgb='+dbgRgb+' w='+Number(best.width||0).toFixed(3)+' c='+Number(best.curves||0)+' l='+Number(best.lines||0)+' s='+Number(best.segs||0):' · DBG red=0 rgb='+dbgRgb+' w='+Number(best.width||0).toFixed(3)+' c='+Number(best.curves||0)+' l='+Number(best.lines||0)+' s='+Number(best.segs||0)+' isRed='+(isRedStroke(best)?'1':'0')))}"
          assert old in s, 'flatmem25 status anchor not found'
          s=s.replace(old,new,1)
          assert '20260908-flatmem25' in h
          h=h.replace('20260908-flatmem25','20260908-flatmem26',1)
          p.write_text(s); w.write_text(h)
          PY
      - name: Validate invariants
        shell: bash
        run: |
          grep -Fq "DBG red=0" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "function redCloudComponentSafe" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "function blackPolylineComponentGroups" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "flatGiantExactModel" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "strictCompactBandedMap(visualSelected)" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "saveToBuffer('compress')" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "20260908-flatmem26" lab-selector-v4/index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('lab-selector-v4/selector-nubes-multistream-core.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/cloudforge-flatmem26.mjs').write_text(s[a:b])
          PY
          node --check /tmp/cloudforge-flatmem26.mjs
      - name: Commit diagnostic candidate
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html
          git commit -m "Lab V2.2: expose red hit diagnostic only"
          git push origin HEAD:lab/v2.1-flatmem26-red-hit-diagnostic
      - name: Publish isolated path
        shell: bash
        run: |
          mkdir -p /tmp/pub26
          cp lab-selector-v4/index.html /tmp/pub26/index.html
          cp lab-selector-v4/selector-nubes-multistream-core.html /tmp/pub26/selector-nubes-multistream-core.html
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf lab-selector-flatmem26
          mkdir -p lab-selector-flatmem26
          cp /tmp/pub26/* lab-selector-flatmem26/
          git add lab-selector-flatmem26
          git commit -m "Publish isolated CloudForge flatmem26 red diagnostic"
          git push origin gh-pages
