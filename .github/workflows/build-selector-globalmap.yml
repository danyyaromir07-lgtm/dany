name: build-selector-globalmap
on: push
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/selector-globalmap
      - name: Generate bounded global mapping viewer
        shell: bash
        run: |
          set -euo pipefail
          cp selector-nubes-hd-limpio-core.html selector-nubes-global-core.html
          cp selector-nubes-hd-limpio.html selector-nubes-global.html
          python - <<'PY'
          from pathlib import Path
          p=Path('selector-nubes-global-core.html')
          s=p.read_text()
          start=s.index('function spatialRoute(vs,blocked=[]){')
          end=s.index('\nfunction proportionalRoute', start)
          new='''function spatialRoutes(vs,blocked=[],maxRoutes=12){\n const used=new Set(blocked),m=model.strokes.length,K=56,lists=[];\n for(const v of vs){const best=[];for(let si=0;si<m;si++){const st=model.strokes[si];if(used.has(st)||st?.editable===false)continue;const c=alignCost(v,st);if(!Number.isFinite(c)||c>2.6)continue;best.push({idx:si,s:st,score:c})}best.sort((x,y)=>x.score-y.score);const keep=best.slice(0,K);if(!keep.length)return[];lists.push(keep)}\n function solve(banned=new Set(),bias=0){const order=lists.map((a,i)=>({i,n:a.filter(c=>!banned.has(i+'|'+c.idx)).length,margin:(a[1]?.score??99)-a[0].score,best:a[0].score})).sort((x,y)=>x.n-y.n||y.margin-x.margin||x.best-y.best),owner=new Map(),chosen=new Array(vs.length);function place(vi,seen){let arr=lists[vi].filter(c=>!banned.has(vi+'|'+c.idx));if(bias)arr=arr.slice().sort((a,b)=>(a.score+bias*((a.idx+vi*17)%11)/1100)-(b.score+bias*((b.idx+vi*17)%11)/1100));for(const c of arr){if(seen.has(c.idx))continue;seen.add(c.idx);const old=owner.get(c.idx);if(old==null||place(old,seen)){owner.set(c.idx,vi);chosen[vi]=c;return true}}return false}for(const z of order)if(z.n===0||!place(z.i,new Set()))return null;return chosen}\n const routes=[],seen=new Set(),push=ch=>{if(!ch||ch.some(x=>!x))return;const key=ch.map(x=>x.idx).join(',');if(seen.has(key))return;seen.add(key);routes.push(ch)};\n const base=solve();push(base);for(const bias of [1,2,4]){if(routes.length>=maxRoutes)break;push(solve(new Set(),bias))}\n if(base){const uncertain=base.map((c,i)=>({i,c,margin:(lists[i].find(x=>x.idx!==c.idx)?.score??99)-c.score})).sort((a,b)=>a.margin-b.margin).slice(0,Math.min(18,base.length));for(const q of uncertain){if(routes.length>=maxRoutes)break;push(solve(new Set([q.i+'|'+q.c.idx])))} }\n return routes.slice(0,maxRoutes).map(ch=>ch.map(x=>x.s))\n}\nfunction spatialRoute(vs,blocked=[]){return spatialRoutes(vs,blocked,1)[0]||null}'''
          s=s[:start]+new+s[end:]
          old="const spatial=spatialRoute(vs,blocked),prop=proportionalRoute(vs,blocked),alternatives=[],seenKeys=new Set();for(const r of [mono,spatial,prop]){if(!r||r.length!==vs.length)continue;const k=routeKey(r);if(!k||seenKeys.has(k))continue;seenKeys.add(k);alternatives.push(r)}"
          new="const spatials=spatialRoutes(vs,blocked,12),spatial=spatials[0]||null,prop=proportionalRoute(vs,blocked),alternatives=[],seenKeys=new Set();for(const r of [mono,...spatials,prop]){if(!r||r.length!==vs.length)continue;const k=routeKey(r);if(!k||seenKeys.has(k))continue;seenKeys.add(k);alternatives.push(r)}"
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace("const principal=mono?'monotónica':spatial?'espacial 1:1':'proporcional';return{items:alternatives[0],alternatives,mode:'multirruta '+alternatives.length+' · principal='+principal+' · '+vs.length+'/'+vs.length}","const principal=mono?'monotónica':spatial?'asignación global 1:1':'proporcional';return{items:alternatives[0],alternatives,mode:'multirruta global '+alternatives.length+' · principal='+principal+' · '+vs.length+'/'+vs.length}",1)
          p.write_text(s)
          p=Path('selector-nubes-global.html')
          s=p.read_text().replace('./selector-nubes-hd-limpio-core.html?v=20260903-whitefill1','./selector-nubes-global-core.html?v=20260903-global1',1).replace('Selector de nubes · HD limpio','Selector de nubes · mapeo global',1)
          p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          for f in ['selector-nubes-global-core.html','selector-nubes-global.html']:
              for i,x in enumerate(re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',Path(f).read_text(),re.S)):
                  Path(f'/tmp/{Path(f).stem}-{i}.mjs').write_text(x)
          PY
          for f in /tmp/selector-nubes-global-*.mjs; do node --check "$f"; done
          grep -q 'function spatialRoutes' selector-nubes-global-core.html
          grep -q 'multirruta global' selector-nubes-global-core.html
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add selector-nubes-global-core.html selector-nubes-global.html
          git commit -m 'Add bounded global mapping alternatives'
          git push origin HEAD:candidate/selector-globalmap
