name: Lab flatmem37 real red paint order
on:
  push:
    branches:
      - lab/v2.2-flatmem37-red-ordinal-diagnostic
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v2.2-flatmem37-red-ordinal-diagnostic
      - name: Patch candidate
        run: python .github/scripts/patch-flatmem37-red-ordinal.py
      - name: Validate
        run: |
          grep -Fq "_ordinal:out.length" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "function red37Component" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "if(prefRed37){famVisual=prefRed37}" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "function blackCloudSafe" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "strictCompactBandedMap(visualSelected)" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "saveToBuffer('compress')" lab-selector-v4/selector-nubes-multistream-core.html
          python - <<'PY'
          from pathlib import Path
          s=Path('lab-selector-v4/selector-nubes-multistream-core.html').read_text();a=s.index('<script type="module">')+len('<script type="module">');b=s.index('</script>',a);Path('/tmp/f37.mjs').write_text(s[a:b])
          PY
          node --check /tmp/f37.mjs
      - name: Commit candidate
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html
          git commit -m "Lab V2.2: use actual paint ordinal for red exploded cloud"
          git push origin HEAD:lab/v2.2-flatmem37-red-ordinal-diagnostic
      - name: Publish isolated path
        run: |
          mkdir -p /tmp/pub37
          cp lab-selector-v4/index.html /tmp/pub37/index.html
          cp lab-selector-v4/selector-nubes-multistream-core.html /tmp/pub37/selector-nubes-multistream-core.html
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf lab-selector-flatmem37
          mkdir -p lab-selector-flatmem37
          cp /tmp/pub37/* lab-selector-flatmem37/
          git add lab-selector-flatmem37
          git commit -m "Publish isolated CloudForge flatmem37 red ordinal selector"
          git push origin gh-pages
