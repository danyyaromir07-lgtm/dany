name: PDF text fixture

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyMuPDF
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - name: Inspect official PDF fixture
        run: python tests/inspect-pdf-fixture.py
