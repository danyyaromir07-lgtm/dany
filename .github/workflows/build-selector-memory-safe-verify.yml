name: Memory-safe selector verification
on:
  push:
    branches:
      - candidate/selector-memory-safe-verify
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/selector-memory-safe-verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch generated core
        run: python tmp-memory-safe-verify.py
      - name: Validate syntax and invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('selector-nubes-multistream-core.html').read_text()
          assert "const previewVisual=collectVisual(wp);if(!localBagOK(previewVisual)){" in s
          assert "const previewModel=deepModel(wp);if(!previewModel||previewModel.incomplete" in s
          assert s.index("if(!localBagOK(previewVisual))") < s.index("const previewModel=deepModel(wp)", s.index("if(!localBagOK(previewVisual))"))
          for t in ["const bagOK=", "strokeEditRanges", "Búsqueda causal dirigida", "afterRaster!==previewRaster"]: assert t in s
          assert 'routeImpossibleKeys' not in s
          script=s.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path('/tmp/check.mjs').write_text(script)
          PY
          node --check /tmp/check.mjs
      - name: Commit generated core only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selector-nubes-multistream-core.html
          git commit -m "Avoid deep-model rebuild for visually failed routes"
          git push
