name: Lab shared Form all selected
on:
  push:
    branches:
      - lab/foxit-index-v3
    paths:
      - lab-tests/test_shared_form_all_selected.mjs
      - lab-tests/generate_fixtures.py
      - selector-nubes-multistream-core.html
      - .github/workflows/lab-shared-form-all-selected.yml
permissions:
  contents: read
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/foxit-index-v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright
          npx playwright install --with-deps chromium
          python -m pip install --quiet pymupdf
      - name: Generate fixtures
        run: python lab-tests/generate_fixtures.py
      - name: Serve lab
        run: |
          python -m http.server 8765 > /tmp/lab-http.log 2>&1 &
          sleep 2
      - name: Run all-shared-Form-selected E2E
        run: node lab-tests/test_shared_form_all_selected.mjs
