name: build-selector-causal-repair
on: push
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/selector-causal-repair
      - name: Generate causal repair viewer
        shell: bash
        run: |
          set -euo pipefail
          python tmp-build-causal-repair.py
          for f in /tmp/selector-nubes-causal-repair-*.mjs; do node --check "$f"; done
          grep -q 'RUTA REPARADA 1↔1' selector-nubes-causal-repair-core.html
          grep -q 'selectedVisual>600?buildLargeRepairRoute()' selector-nubes-causal-repair-core.html
          grep -q 'selector-nubes-causal-repair-core.html?v=20260903-causalrepair1' selector-nubes-causal-repair.html
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add selector-nubes-causal-repair-core.html selector-nubes-causal-repair.html
          git commit -m 'Repair single causal mismatch in large selections'
          git push origin HEAD:candidate/selector-causal-repair
