name: flatmem48
on:
  push:
    branches: [lab/v2.2-flatmem48-unique-red-hit]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v2.2-flatmem48-unique-red-hit
      - run: python .github/scripts/flatmem48_patch.py
      - run: |
          grep -Fq "DBG48 uniqueRed=1" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "if(!r||r.segs<=0)return" lab-selector-v4/selector-nubes-multistream-core.html
          python - <<'PY'
          from pathlib import Path
          s=Path('lab-selector-v4/selector-nubes-multistream-core.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/core48.mjs').write_text(s[a:b])
          PY
          node --check /tmp/core48.mjs
      - run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html
          git commit -m "Lab V2.2 flatmem48 unique red hit"
          git push origin HEAD:lab/v2.2-flatmem48-unique-red-hit
      - run: |
          mkdir -p /tmp/pub48
          cp lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html /tmp/pub48/
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf lab-selector-flatmem48
          mkdir -p lab-selector-flatmem48
          cp /tmp/pub48/* lab-selector-flatmem48/
          git add lab-selector-flatmem48
          git commit -m "Publish flatmem48"
          git push origin gh-pages
