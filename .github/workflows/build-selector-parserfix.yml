name: build-selector-parserfix
on: push
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/selector-parserfix
      - name: Generate parser-normalized viewer
        shell: bash
        run: |
          set -euo pipefail
          cp selector-nubes-global2-core.html selector-nubes-parserfix-core.html
          cp selector-nubes-global2.html selector-nubes-parserfix.html
          python - <<'PY'
          from pathlib import Path
          p=Path('selector-nubes-parserfix-core.html')
          s=p.read_text()
          old="if(op==='re'){const a=nums(4);if(a.length===4){const[x,y,w,h]=a,p0=tf(st.ctm,x,y),p1=tf(st.ctm,x+w,y),p2=tf(st.ctm,x+w,y+h),p3=tf(st.ctm,x,y+h);if(st.path){if(deepKey(st.path.sourceRef)!==deepKey(ref))st.path.cross=true;st.path.pts.push(p0,p1,p2,p3);st.path.last=p0;st.path.subFirst=p0;st.path.lines+=4}else st.path={start:firstNumStart(4),sourceRef:ref,sourceBase:deepKey(ref),pts:[p0,p1,p2,p3],first:p0,last:p0,subFirst:p0,lines:4,curves:0,rgb:[...st.rgb],width:st.width,cross:false}}clear();continue}"
          new="if(op==='re'){const a=nums(4);if(a.length===4){const[x,y,w,h]=a,p0=tf(st.ctm,x,y),p1=tf(st.ctm,x+w,y),p2=tf(st.ctm,x+w,y+h),p3=tf(st.ctm,x,y+h);if(st.path){if(deepKey(st.path.sourceRef)!==deepKey(ref))st.path.cross=true;st.path.pts.push(p0,p1,p2,p3);st.path.last=p3;st.path.subFirst=p0;st.path.lines+=3}else st.path={start:firstNumStart(4),sourceRef:ref,sourceBase:deepKey(ref),pts:[p0,p1,p2,p3],first:p0,last:p3,subFirst:p0,lines:3,curves:0,rgb:[...st.rgb],width:st.width,cross:false}}clear();continue}"
          assert old in s, 're block not found'
          s=s.replace(old,new,1)
          old="if(st.path&&op==='v'){const a=nums(4);if(a.length===4){const p2=tf(st.ctm,a[0],a[1]),p3=tf(st.ctm,a[2],a[3]);st.path.pts.push(p2,p3);st.path.last=p3;st.path.curves++}clear();continue}"
          new="if(st.path&&op==='v'){const a=nums(4);if(a.length===4){const p1=st.path.last,p2=tf(st.ctm,a[0],a[1]),p3=tf(st.ctm,a[2],a[3]);st.path.pts.push(p1,p2,p3);st.path.last=p3;st.path.curves++}clear();continue}"
          assert old in s, 'v block not found'
          s=s.replace(old,new,1)
          old="if(st.path&&op==='y'){const a=nums(4);if(a.length===4){const p1=tf(st.ctm,a[0],a[1]),p3=tf(st.ctm,a[2],a[3]);st.path.pts.push(p1,p3);st.path.last=p3;st.path.curves++}clear();continue}"
          new="if(st.path&&op==='y'){const a=nums(4);if(a.length===4){const p1=tf(st.ctm,a[0],a[1]),p3=tf(st.ctm,a[2],a[3]);st.path.pts.push(p1,p3,p3);st.path.last=p3;st.path.curves++}clear();continue}"
          assert old in s, 'y block not found'
          s=s.replace(old,new,1)
          old="if(st.path&&op==='h'){st.path.last=st.path.subFirst||st.path.first;clear();continue}"
          new="if(st.path&&op==='h'){clear();continue}"
          assert old in s, 'h block not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('selector-nubes-parserfix.html')
          s=p.read_text()
          s=s.replace('./selector-nubes-global2-core.html?v=20260903-global2','./selector-nubes-parserfix-core.html?v=20260903-parserfix1',1)
          s=s.replace('Selector de nubes · mapeo global amplio','Selector de nubes · parser geométrico normalizado',1)
          p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          for f in ['selector-nubes-parserfix-core.html','selector-nubes-parserfix.html']:
              for i,x in enumerate(re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',Path(f).read_text(),re.S)):
                  Path(f'/tmp/{Path(f).stem}-{i}.mjs').write_text(x)
          PY
          for f in /tmp/selector-nubes-parserfix-*.mjs; do node --check "$f"; done
          grep -q "st.path.last=p3;st.path.subFirst=p0;st.path.lines+=3" selector-nubes-parserfix-core.html
          grep -q "const p1=st.path.last,p2=" selector-nubes-parserfix-core.html
          grep -q "st.path.pts.push(p1,p3,p3)" selector-nubes-parserfix-core.html
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add selector-nubes-parserfix-core.html selector-nubes-parserfix.html
          git commit -m 'Normalize structural path geometry with MuPDF visual walk'
          git push origin HEAD:candidate/selector-parserfix
