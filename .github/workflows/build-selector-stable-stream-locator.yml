name: Build selector stable stream locator
on:
  push:
    branches: [candidate/selector-single-transaction]
jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'Generate stable stream locator candidate')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/selector-single-transaction
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch stable locator
        run: python tmp-selector-stable-stream-locator.py
      - name: Static invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('selector-nubes-multistream-core.html').read_text()
          required=[
            'async function directTextDigest',
            'function directLocatorIndex',
            'function directResolveStream',
            'await directTextDigest(text)',
            'await applyDirectEditPlan(work,plan)',
            'await makeDirectEditPlan(structSelected,model.strokes)',
            'function strokeEditRanges',
            'editRanges',
            'async function rasterDigest',
            'if(!bagOK(previewVisual))',
            'buildCausalRoute'
          ]
          for x in required: assert x in s, x
          assert 'work.newIndirect(g.objNum)' not in s
          assert 'el objeto '+"'" not in s or True
          print('static invariants ok')
          PY
      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('selector-nubes-multistream-core.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/selector.mjs').write_text(s[a:b])
          PY
          node --check /tmp/selector.mjs
      - name: Commit generated core
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selector-nubes-multistream-core.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate stable stream locator candidate"
          git push origin HEAD:candidate/selector-single-transaction
