name: Lab flatmem38 red mutual neighbor
on:
  push:
    branches:
      - lab/v2.2-flatmem38-red-mutual-neighbor
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v2.2-flatmem38-red-mutual-neighbor
      - name: Patch candidate
        run: python .github/scripts/patch-flatmem38-red-mutual.py
      - name: Validate
        shell: bash
        run: |
          grep -Fq "function red38Component" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "if(prefRed38){famVisual=prefRed38}" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "function blackCloudSafe" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "strictCompactBandedMap(visualSelected)" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "saveToBuffer('compress')" lab-selector-v4/selector-nubes-multistream-core.html
          python - <<'PY'
          from pathlib import Path
          s=Path('lab-selector-v4/selector-nubes-multistream-core.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/f38.mjs').write_text(s[a:b])
          PY
          node --check /tmp/f38.mjs
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html
          git commit -m "Lab V2.2: reconstruct red cloud with mutual-neighbor topology"
          git push origin HEAD:lab/v2.2-flatmem38-red-mutual-neighbor
      - name: Publish isolated path
        shell: bash
        run: |
          mkdir -p /tmp/pub38
          cp lab-selector-v4/index.html /tmp/pub38/index.html
          cp lab-selector-v4/selector-nubes-multistream-core.html /tmp/pub38/selector-nubes-multistream-core.html
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf lab-selector-flatmem38
          mkdir -p lab-selector-flatmem38
          cp /tmp/pub38/* lab-selector-flatmem38/
          git add lab-selector-flatmem38
          git commit -m "Publish isolated CloudForge flatmem38 red mutual-neighbor selector"
          git push origin gh-pages
