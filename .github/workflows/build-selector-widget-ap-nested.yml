name: build-selector-widget-ap-nested
on:
  push:
    branches: [candidate/selector-widget-ap-nested]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate nested AP selector
        run: |
          python tmp-build-widget-ap-nested.py
          node --check /tmp/selector-nubes-causal-ap-profundo.mjs
          test -s selector-nubes-causal-ap-profundo-core.html
          test -s selector-nubes-causal-ap-profundo.html
          grep -q "appearanceFormChild" selector-nubes-causal-ap-profundo-core.html
          grep -q "AP forms=" selector-nubes-causal-ap-profundo-core.html
      - name: Commit generated pages
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add selector-nubes-causal-ap-profundo-core.html selector-nubes-causal-ap-profundo.html
          git diff --cached --quiet || git commit -m "Traverse nested Form XObjects inside widget appearance"
          git push
