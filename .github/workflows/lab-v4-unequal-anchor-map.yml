name: Lab v4 unequal anchored sequence map
on:
  push:
    branches:
      - lab/foxit-index-v4-realpdf-map
    paths:
      - .github/workflows/lab-v4-unequal-anchor-map.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/foxit-index-v4-realpdf-map
          fetch-depth: 0
      - name: Patch core
        run: echo '' | base64 -d >/tmp/patch.py && python3 /tmp/patch.py
      - name: Check JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('selector-nubes-multistream-core.html').read_text()
          assert 'strictCompactAnchoredMap' in s
          assert 'ordinal local anclada + verificación exacta' in s
          assert 'const broad=classicVisual.filter(v=>seedCompat(v,best))' in s
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S); assert m
          js=re.sub(r'^import .*?;\s*','',m.group(1),count=1,flags=re.S)
          Path('/tmp/core.mjs').write_text(js)
          PY
          node --check /tmp/core.mjs
      - name: Commit candidate
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add selector-nubes-multistream-core.html
          git commit -m 'Lab: anchored local ordinal mapping for unequal counts'
          git push origin HEAD:lab/foxit-index-v4-realpdf-map
      - name: Publish isolated lab
        run: |
          cp selector-nubes-multistream-core.html /tmp/core.html
          git fetch origin gh-pages
          git checkout -B lab-publish origin/gh-pages
          mkdir -p lab-selector-v4
          cp /tmp/core.html lab-selector-v4/selector-nubes-multistream-core.html
          sed -i -E 's#selector-nubes-multistream-core.html\?v=[^\"]+#selector-nubes-multistream-core.html?v=20260906-anchor6#' lab-selector-v4/index.html
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html
          git commit -m 'Publish isolated lab v4 anchored unequal-count map'
          git push origin HEAD:gh-pages
