name: Lab flatmem41 red local sequence diagnostic
on:
  push:
    branches:
      - lab/v2.2-flatmem41-red-local-sequence
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v2.2-flatmem41-red-local-sequence
      - name: Patch click-only red local-sequence diagnostic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lab-selector-v4/selector-nubes-multistream-core.html')
          w=Path('lab-selector-v4/index.html')
          s=p.read_text(); h=w.read_text()
          old="const vg=components(visualSelected),dbgRgb=(best.rgb||[]).slice(0,3).map(v=>Number(v).toFixed(3)).join('/'),dbgSafe=blackSeed?blackCloudSafe(seed):false,dbgRatio=seed.length?diag(componentBox(seed))/Math.max(.001,med(seed.map(v=>diag(v.bbox)).filter(Boolean))):0;status.textContent='Selección acumulada · familias='+selectionFamilies+' · resaltados='+visualSelected.length+' · grupos≈'+vg+' · expansión por componente · azul listo · correspondencia estructural se calculará al pulsar Eliminar · Ctrl/Shift+clic añade otro tipo'+(blackSeed?' · DBG rgb='+dbgRgb+' w='+Number(best.width||0).toFixed(3)+' c='+Number(best.curves||0)+' l='+Number(best.lines||0)+' s='+Number(best.segs||0)+' broad='+broad.length+' groups='+groups.length+' seed='+seed.length+' ratio='+dbgRatio.toFixed(2)+' safe='+(dbgSafe?'1':'0'):' · DBG blackSeed=0 rgb='+dbgRgb)}"
          new="const vg=components(visualSelected),dbgRgb=(best.rgb||[]).slice(0,3).map(v=>Number(v).toFixed(3)).join('/'),dbgSafe=blackSeed?blackCloudSafe(seed):false,dbgRatio=seed.length?diag(componentBox(seed))/Math.max(.001,med(seed.map(v=>diag(v.bbox)).filter(Boolean))):0,isRed41=v=>{const c=(v?.rgb||[]).slice(0,3).map(Number);return c.length===3&&c.every(Number.isFinite)&&c[0]>=.72&&c[0]-c[1]>=.42&&c[0]-c[2]>=.42&&c[1]<=.36&&c[2]<=.36},ang41=v=>{if(!v?.first||!v?.last)return NaN;return Math.atan2(v.last[1]-v.first[1],v.last[0]-v.first[0])},len41=v=>v?.first&&v?.last?Math.hypot(v.last[0]-v.first[0],v.last[1]-v.first[1]):0,bo=Number(best._ordinal),local41=[];for(let oi=Math.max(0,bo-12);oi<=Math.min(classicVisual.length-1,bo+12);oi++){const v=classicVisual[oi];if(!isRed41(v))continue;const gap=Math.hypot(((v.bbox[0]+v.bbox[2])-(best.bbox[0]+best.bbox[2]))*.5,((v.bbox[1]+v.bbox[3])-(best.bbox[1]+best.bbox[3]))*.5);local41.push({o:oi-bo,g:gap,l:len41(v),a:ang41(v),s:Number(v.segs||0)})}local41.sort((a,b)=>a.o-b.o);const fmt41=local41.slice(0,18).map(q=>q.o+':g'+q.g.toFixed(1)+':l'+q.l.toFixed(1)+':a'+(Number.isFinite(q.a)?q.a.toFixed(2):'n')+':s'+q.s).join(',');status.textContent='Selección acumulada · familias='+selectionFamilies+' · resaltados='+visualSelected.length+' · grupos≈'+vg+' · expansión por componente · azul listo · correspondencia estructural se calculará al pulsar Eliminar · Ctrl/Shift+clic añade otro tipo'+(blackSeed?' · DBG rgb='+dbgRgb+' w='+Number(best.width||0).toFixed(3)+' c='+Number(best.curves||0)+' l='+Number(best.lines||0)+' s='+Number(best.segs||0)+' broad='+broad.length+' groups='+groups.length+' seed='+seed.length+' ratio='+dbgRatio.toFixed(2)+' safe='+(dbgSafe?'1':'0'):' · DBG blackSeed=0 rgb='+dbgRgb)+' · DBG41 ord='+bo+' len='+len41(best).toFixed(2)+' ang='+(Number.isFinite(ang41(best))?ang41(best).toFixed(3):'n')+' local='+local41.length+' ['+fmt41+']'}"
          assert old in s
          s=s.replace(old,new,1)
          if 'flatmem20' in h:h=h.replace('flatmem20','flatmem41',1)
          else:h=h.replace('selector-nubes-multistream-core.html?v=', 'selector-nubes-multistream-core.html?v=20260908-flatmem41-',1)
          p.write_text(s);w.write_text(h)
          PY
      - name: Validate isolation and syntax
        shell: bash
        run: |
          grep -Fq "DBG41 ord=" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "function blackCloudSafe" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "strictCompactBandedMap(visualSelected)" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "saveToBuffer('compress')" lab-selector-v4/selector-nubes-multistream-core.html
          python - <<'PY'
          from pathlib import Path
          s=Path('lab-selector-v4/selector-nubes-multistream-core.html').read_text();a=s.index('<script type=\"module\">')+len('<script type=\"module\">');b=s.index('</script>',a);Path('/tmp/f41.mjs').write_text(s[a:b])
          PY
          node --check /tmp/f41.mjs
      - name: Commit diagnostic candidate
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html
          git commit -m "Lab V2.2: diagnose local red stroke sequence"
          git push origin HEAD:lab/v2.2-flatmem41-red-local-sequence
      - name: Publish isolated path
        shell: bash
        run: |
          mkdir -p /tmp/pub41
          cp lab-selector-v4/index.html /tmp/pub41/index.html
          cp lab-selector-v4/selector-nubes-multistream-core.html /tmp/pub41/selector-nubes-multistream-core.html
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf lab-selector-flatmem41
          mkdir -p lab-selector-flatmem41
          cp /tmp/pub41/* lab-selector-flatmem41/
          git add lab-selector-flatmem41
          git commit -m "Publish isolated CloudForge flatmem41 red local-sequence diagnostic"
          git push origin gh-pages
