name: Lab v4 UI phase 1
on:
  push:
    branches: [lab/foxit-index-v4-realpdf-map]
    paths: [.github/workflows/lab-v4-ui-phase1.yml]
permissions:
  contents: write
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/foxit-index-v4-realpdf-map
          fetch-depth: 0
      - name: Apply UI bridge
        run: python3 .github/scripts/lab-v4-ui-phase1.py
      - name: Check JS and engine invariants
        run: python3 -c "from pathlib import Path; import re; s=Path('selector-nubes-multistream-core.html').read_text(); assert 'window.selectorPhase1=' in s; assert 'clearVisualSelectionUI' in s; assert 'strictCompactBandedMap' in s; assert 'Sin rutas alternativas ni causal.' in s; m=re.search(r'<script type=\"module\">(.*?)</script>',s,re.S); assert m; Path('/tmp/core.mjs').write_text(re.sub(r'^import .*?;\\s*','',m.group(1),count=1,flags=re.S))" && node --check /tmp/core.mjs
      - name: Commit UI bridge candidate
        run: git config user.name github-actions-bot && git config user.email 41898282+github-actions-bot@users.noreply.github.com && git add selector-nubes-multistream-core.html && git commit -m 'Lab UI phase 1 bridge only' && git push origin HEAD:lab/foxit-index-v4-realpdf-map
      - name: Publish isolated lab core
        run: cp selector-nubes-multistream-core.html /tmp/core.html && git fetch origin gh-pages && git checkout -B lab-publish origin/gh-pages && mkdir -p lab-selector-v4 && cp /tmp/core.html lab-selector-v4/selector-nubes-multistream-core.html && git config user.name github-actions-bot && git config user.email 41898282+github-actions-bot@users.noreply.github.com && git add lab-selector-v4/selector-nubes-multistream-core.html && git commit -m 'Publish isolated lab UI phase 1 core bridge' && git push origin HEAD:gh-pages
