name: Lab flatmem34 exploded red cloud
on:
  push:
    branches:
      - lab/v2.2-flatmem34-red-exploded
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v2.2-flatmem34-red-exploded
      - name: Patch exploded red cloud selection only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lab-selector-v4/selector-nubes-multistream-core.html')
          w=Path('lab-selector-v4/index.html')
          s=p.read_text(); h=w.read_text()
          pos=s.index('function chooseClassic(e){')
          block=r'''
function redExplodedRgb(v){const c=(v?.rgb||[]).slice(0,3).map(Number);return c.length===3&&c.every(Number.isFinite)?c:[]}
function redExplodedColor(v){const c=redExplodedRgb(v);return c.length===3&&c[0]>=.72&&c[0]-c[1]>=.42&&c[0]-c[2]>=.42&&c[1]<=.36&&c[2]<=.36}
function redExplodedPiece(v){if(!redExplodedColor(v))return false;const n=Number(v.segs||0),d=diag(v.bbox||[0,0,0,0]);return n>=1&&n<=8&&Number.isFinite(d)&&d>=.35&&v.first&&v.last}
function redExplodedCompat(x,s){if(!redExplodedPiece(x)||!redExplodedPiece(s)||colorDist(redExplodedRgb(x),redExplodedRgb(s))>.045)return false;const dx=Math.max(.001,diag(x.bbox)),ds=Math.max(.001,diag(s.bbox)),dr=dx/ds;if(dr<.16||dr>6.2)return false;const wx=Math.abs(Number(x.width)||0),ws=Math.abs(Number(s.width)||0);if(Math.max(wx,ws)>.04){const wr=Math.max(.001,wx)/Math.max(.001,ws);if(wr<.42||wr>2.4)return false}return true}
function redExplodedDir(v){const a=v.first,b=v.last;if(!a||!b)return null;const dx=Number(b[0])-Number(a[0]),dy=Number(b[1])-Number(a[1]),n=Math.hypot(dx,dy);return n>.001?[dx/n,dy/n]:null}
function redExplodedComponent(seed){
 const sd=Math.max(.001,diag(seed.bbox)),sw=Math.abs(Number(seed.width)||0),cand=[];
 for(const v of classicVisual){if(!redExplodedCompat(v,seed))continue;const d=diag(v.bbox);if(d<sd*.16||d>sd*6.2)continue;cand.push(v)}
 if(!cand.includes(seed))cand.push(seed);if(cand.length<6)return{group:[seed],cand:cand.length,degMax:0,safe:false};
 const md=med(cand.map(v=>diag(v.bbox)).filter(Boolean)),tol=Math.max(.55,Math.min(sd,md)*.24),cell=Math.max(.55,tol),grid=new Map(),key=(x,y)=>Math.floor(x/cell)+','+Math.floor(y/cell),put=(pt,i)=>{const k=key(pt[0],pt[1]);let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(i)};
 for(let i=0;i<cand.length;i++){put(cand[i].first,i);put(cand[i].last,i)}
 const idx=new Map(cand.map((v,i)=>[v,i])),start=idx.get(seed),seen=new Set([start]),q=[start],deg=new Map();
 while(q.length){const i=q.shift(),v=cand[i],D=redExplodedDir(v),ends=[v.first,v.last];for(const ep of ends){const cx=Math.floor(ep[0]/cell),cy=Math.floor(ep[1]/cell);for(let gx=cx-1;gx<=cx+1;gx++)for(let gy=cy-1;gy<=cy+1;gy++){for(const j of grid.get(gx+','+gy)||[]){if(j===i)continue;const u=cand[j],mind=Math.min(Math.hypot(ep[0]-u.first[0],ep[1]-u.first[1]),Math.hypot(ep[0]-u.last[0],ep[1]-u.last[1]));if(mind>tol)continue;const E=redExplodedDir(u);if(D&&E&&Math.abs(D[0]*E[0]+D[1]*E[1])<.28)continue;deg.set(i,(deg.get(i)||0)+1);deg.set(j,(deg.get(j)||0)+1);if(!seen.has(j)){seen.add(j);q.push(j)}}}}}}
 const group=[...seen].map(i=>cand[i]),ds=group.map(v=>diag(v.bbox)).filter(Boolean),gm=med(ds),extent=gm?diag(componentBox(group))/gm:0,degVals=group.map(v=>deg.get(idx.get(v))||0),degMax=degVals.length?Math.max(...degVals):0,branchy=degVals.filter(d=>d>4).length/Math.max(1,degVals.length),sameColor=group.filter(v=>colorDist(redExplodedRgb(v),redExplodedRgb(seed))<=.045).length/Math.max(1,group.length),widths=group.map(v=>Math.abs(Number(v.width)||0)),mw=med(widths),wspread=widths.length?Math.max(...widths)-Math.min(...widths):0,safe=group.length>=10&&extent>=4.2&&branchy<=.08&&sameColor>=.95&&wspread<=Math.max(.09,mw*.55);
 return{group,cand:cand.length,extent,degMax,branchy,safe,tol}
}
'''
          s=s[:pos]+block+s[pos:]
          old="let best=null,bd=Infinity,blackHit=null,blackBd=Infinity;const pad=15/Math.max(.1,baseRs*zoom);for(const s of classicVisual){if(x<s.bbox[0]-pad||x>s.bbox[2]+pad||y<s.bbox[1]-pad||y>s.bbox[3]+pad)continue;const d=distance(s,x,y);if(d<bd){bd=d;best=s}if(isNearBlackStroke(s)&&d<blackBd){blackBd=d;blackHit=s}}const tol=14/Math.max(.1,baseRs*zoom);if(!best||bd>tol){status.textContent='No encontré un trazo visual suficientemente cerca.';return}let prefBroad=null,prefGroups=null,prefSeed=null;if(!isNearBlackStroke(best)&&blackHit&&blackBd<=tol){"
          new="let best=null,bd=Infinity,blackHit=null,blackBd=Infinity,redExpHit=null,redExpBd=Infinity;const pad=15/Math.max(.1,baseRs*zoom);for(const s of classicVisual){if(x<s.bbox[0]-pad||x>s.bbox[2]+pad||y<s.bbox[1]-pad||y>s.bbox[3]+pad)continue;const d=distance(s,x,y);if(d<bd){bd=d;best=s}if(isNearBlackStroke(s)&&d<blackBd){blackBd=d;blackHit=s}if(redExplodedPiece(s)&&d<redExpBd){redExpBd=d;redExpHit=s}}const tol=14/Math.max(.1,baseRs*zoom);if(!best||bd>tol){status.textContent='No encontré un trazo visual suficientemente cerca.';return}let prefRedExploded=null,redExpInfo=null,prefBroad=null,prefGroups=null,prefSeed=null;if(redExpHit&&redExpBd<=tol){redExpInfo=redExplodedComponent(redExpHit);const switchTol=Math.max(2/Math.max(.1,baseRs*zoom),tol*.7);if(redExpInfo.safe&&redExpBd<=Math.max(bd+switchTol,switchTol*1.35)){best=redExpHit;bd=redExpBd;prefRedExploded=redExpInfo.group}}if(!prefRedExploded&&!isNearBlackStroke(best)&&blackHit&&blackBd<=tol){"
          assert old in s, 'chooseClassic hit anchor missing'
          s=s.replace(old,new,1)
          old2="let famVisual=[];if(blackSeed){"
          assert old2 in s
          s=s.replace(old2,"let famVisual=[];if(prefRedExploded){famVisual=prefRedExploded}else if(blackSeed){",1)
          old3="status.textContent='Selección acumulada · familias='+selectionFamilies+' · resaltados='+visualSelected.length+' · grupos≈'+vg+' · expansión por componente · azul listo · correspondencia estructural se calculará al pulsar Eliminar · Ctrl/Shift+clic añade otro tipo'+(blackSeed?"
          assert old3 in s
          s=s.replace(old3,"status.textContent='Selección acumulada · familias='+selectionFamilies+' · resaltados='+visualSelected.length+' · grupos≈'+vg+' · expansión por componente · azul listo · correspondencia estructural se calculará al pulsar Eliminar · Ctrl/Shift+clic añade otro tipo'+(prefRedExploded?' · DBG redExploded=1 seed='+prefRedExploded.length+' cand='+(redExpInfo?.cand||0)+' extent='+(redExpInfo?.extent||0).toFixed(2)+' degMax='+(redExpInfo?.degMax||0)+' rgb='+dbgRgb:(blackSeed?",1)
          tail="' · DBG blackSeed=0 rgb='+dbgRgb)}"
          assert tail in s
          s=s.replace(tail,"' · DBG blackSeed=0 rgb='+dbgRgb))}",1)
          if 'flatmem20' in h:h=h.replace('flatmem20','flatmem34')
          else:h=h.replace('selector-nubes-multistream-core.html?v=', 'selector-nubes-multistream-core.html?v=20260908-flatmem34-')
          p.write_text(s);w.write_text(h)
          PY
      - name: Validate invariants
        shell: bash
        run: |
          grep -Fq "function redExplodedComponent" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "if(prefRedExploded){famVisual=prefRedExploded}" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "function blackCloudSafe" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "flatGiantExactModel" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "strictCompactBandedMap(visualSelected)" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "saveToBuffer('compress')" lab-selector-v4/selector-nubes-multistream-core.html
          python - <<'PY'
          from pathlib import Path
          s=Path('lab-selector-v4/selector-nubes-multistream-core.html').read_text();a=s.index('<script type="module">')+len('<script type="module">');b=s.index('</script>',a);Path('/tmp/f34.mjs').write_text(s[a:b])
          PY
          node --check /tmp/f34.mjs
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html
          git commit -m "Lab V2.2: reconstruct exploded red cloud components"
          git push origin HEAD:lab/v2.2-flatmem34-red-exploded
      - name: Publish isolated path
        shell: bash
        run: |
          mkdir -p /tmp/pub34
          cp lab-selector-v4/index.html /tmp/pub34/index.html
          cp lab-selector-v4/selector-nubes-multistream-core.html /tmp/pub34/selector-nubes-multistream-core.html
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf lab-selector-flatmem34
          mkdir -p lab-selector-flatmem34
          cp /tmp/pub34/* lab-selector-flatmem34/
          git add lab-selector-flatmem34
          git commit -m "Publish isolated CloudForge flatmem34 exploded red cloud"
          git push origin gh-pages
