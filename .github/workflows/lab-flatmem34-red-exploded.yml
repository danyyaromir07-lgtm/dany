name: Lab flatmem34 exploded red cloud
on:
  push:
    branches:
      - lab/v2.2-flatmem34-red-exploded
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v2.2-flatmem34-red-exploded
      - name: Patch exploded red cloud selection only
        run: python .github/scripts/patch-flatmem34-red-exploded.py
      - name: Validate invariants
        shell: bash
        run: |
          grep -Fq "function redExplodedComponent" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "if(prefRedExploded){famVisual=prefRedExploded}" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "function blackCloudSafe" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "flatGiantExactModel" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "strictCompactBandedMap(visualSelected)" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "saveToBuffer('compress')" lab-selector-v4/selector-nubes-multistream-core.html
          python - <<'PY'
          from pathlib import Path
          s=Path('lab-selector-v4/selector-nubes-multistream-core.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/f34.mjs').write_text(s[a:b])
          PY
          node --check /tmp/f34.mjs
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html
          git commit -m "Lab V2.2: reconstruct exploded red cloud components"
          git push origin HEAD:lab/v2.2-flatmem34-red-exploded
      - name: Publish isolated path
        shell: bash
        run: |
          mkdir -p /tmp/pub34
          cp lab-selector-v4/index.html /tmp/pub34/index.html
          cp lab-selector-v4/selector-nubes-multistream-core.html /tmp/pub34/selector-nubes-multistream-core.html
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf lab-selector-flatmem34
          mkdir -p lab-selector-flatmem34
          cp /tmp/pub34/* lab-selector-flatmem34/
          git add lab-selector-flatmem34
          git commit -m "Publish isolated CloudForge flatmem34 exploded red cloud"
          git push origin gh-pages
