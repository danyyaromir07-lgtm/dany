name: Lab flatmem35 red fill diagnostic
on:
  push:
    branches:
      - lab/v2.2-flatmem35-fill-diagnostic
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v2.2-flatmem35-fill-diagnostic
      - name: Patch diagnostic only
        run: python .github/scripts/patch-flatmem35-fill-diagnostic.py
      - name: Validate diagnostic isolation
        shell: bash
        run: |
          grep -Fq "function redFillDebugRecord" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "fillPath(path,evenOdd,ctm,cs,color,alpha)" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "DBG fillRed=" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "function blackCloudSafe" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "strictCompactBandedMap(visualSelected)" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "saveToBuffer('compress')" lab-selector-v4/selector-nubes-multistream-core.html
          python - <<'PY'
          from pathlib import Path
          s=Path('lab-selector-v4/selector-nubes-multistream-core.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/f35.mjs').write_text(s[a:b])
          PY
          node --check /tmp/f35.mjs
      - name: Commit diagnostic candidate
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html
          git commit -m "Lab V2.2: diagnose red fill paths in existing visual pass"
          git push origin HEAD:lab/v2.2-flatmem35-fill-diagnostic
      - name: Publish isolated diagnostic
        shell: bash
        run: |
          mkdir -p /tmp/pub35
          cp lab-selector-v4/index.html /tmp/pub35/index.html
          cp lab-selector-v4/selector-nubes-multistream-core.html /tmp/pub35/selector-nubes-multistream-core.html
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf lab-selector-flatmem35
          mkdir -p lab-selector-flatmem35
          cp /tmp/pub35/* lab-selector-flatmem35/
          git add lab-selector-flatmem35
          git commit -m "Publish isolated CloudForge flatmem35 fill diagnostic"
          git push origin gh-pages
