name: build-v68
on: push
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/candidate/v68-raster-postsave'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v68-raster-postsave
      - name: Generate and validate v68
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          core=Path('cloud-similar-selector-v67-core.html').read_text()
          core=core.replace('v67','v68')
          marker="const r3=n=>Math.round(Number(n||0)*1000)/1000,sig=s=>[s.lines,s.curves,s.segs,...s.bbox.map(r3),...(s.first||[0,0]).map(r3),...(s.last||[0,0]).map(r3),r3(s.width),...(s.rgb||[]).slice(0,3).map(r3)].join('|');\n"
          assert marker in core
          helper="""async function rasterDigest(page){const b=page.getBounds(),w=Math.max(1,b[2]-b[0]),h=Math.max(1,b[3]-b[1]),maxPixels=1_500_000,rs=Math.max(.12,Math.min(1.25,Math.sqrt(maxPixels/Math.max(1,w*h)))),pm=page.toPixmap(mupdf.Matrix.scale(rs,rs),mupdf.ColorSpace.DeviceRGB,false,true);try{const p=pm.getPixels(),u=p instanceof Uint8Array?p:new Uint8Array(p),d=await crypto.subtle.digest('SHA-256',u),hex=Array.from(new Uint8Array(d),x=>x.toString(16).padStart(2,'0')).join('');return pm.getWidth()+'x'+pm.getHeight()+':'+hex}finally{try{pm.destroy?.()}catch(_){}}}\n"""
          core=core.replace(marker,marker+helper,1)
          old="if(!bagOK(previewVisual))throw new Error('antes de guardar, la geometría editada no coincide exactamente con original menos azul');if(saveMode==='incremental'&&work.canBeSavedIncrementally?.()===false)throw new Error('MuPDF indica que este PDF no admite guardado incremental');"
          new="if(!bagOK(previewVisual))throw new Error('antes de guardar, la geometría editada no coincide exactamente con original menos azul');const previewRaster=await rasterDigest(wp);if(saveMode==='incremental'&&work.canBeSavedIncrementally?.()===false)throw new Error('MuPDF indica que este PDF no admite guardado incremental');"
          assert old in core
          core=core.replace(old,new,1)
          old2="check=mupdf.PDFDocument.openDocument(out,'application/pdf');cp=check.loadPage(0);const afterVisual=collectVisual(cp),am=deepModel(cp);if(!am||am.incomplete||am.strokes.length!==beforeStruct-selectedIdx.length||!bagOK(afterVisual))throw new Error('después de guardar, la geometría no coincide exactamente con original menos azul');return{out,touched,number,saveMode:saveMode||'reescritura mínima'}"
          new2="check=mupdf.PDFDocument.openDocument(out,'application/pdf');cp=check.loadPage(0);const afterRaster=await rasterDigest(cp);if(afterRaster!==previewRaster)throw new Error('después de guardar, el renderizado cambió respecto de la versión geométricamente validada');return{out,touched,number,saveMode:saveMode||'reescritura mínima'}"
          assert old2 in core
          core=core.replace(old2,new2,1)
          core=core.replace("const outBase=new Uint8Array(activeBytes);let lastError='ninguna correspondencia superó la verificación exacta';","const outBase=new Uint8Array(activeBytes),errors=[];",1)
          core=core.replace("const saveModes=['incremental','','compress=yes'];","const saveModes=['incremental',''];",1)
          core=core.replace("}catch(e){lastError='guardado '+label+' · '+e.message}}","}catch(e){errors.push('correspondencia '+(i+1)+' · guardado '+label+' · '+e.message)}}",1)
          core=core.replace("+' estrategias de guardado y ninguna pasó la verificación exacta · '+lastError","+' estrategias de guardado y ninguna pasó la verificación exacta · '+errors.join(' | ')",1)
          Path('cloud-similar-selector-v68-core.html').write_text(core)
          wrap=Path('cloud-similar-selector-v67.html').read_text().replace('v67','v68').replace('20260903-incremental1','20260903-raster1')
          Path('cloud-similar-selector-v68.html').write_text(wrap)
          mod=re.findall(r'<script type="module">(.*?)</script>',core,re.S); assert len(mod)==1
          Path('/tmp/v68.mjs').write_text(mod[0])
          plain=re.findall(r'<script>(.*?)</script>',wrap,re.S); assert plain
          Path('/tmp/v68-wrapper.js').write_text('\n'.join(plain))
          assert 'rasterDigest' in core and "const saveModes=['incremental','']" in core and 'compress=yes' not in core[core.index('async function removeGroup'):]
          assert 'errors.join' in core and 'cloud-similar-selector-v68-core.html?v=20260903-raster1' in wrap
          PY
          node --check /tmp/v68.mjs
          node --check /tmp/v68-wrapper.js
          rm .github/workflows/build-v68.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-similar-selector-v68-core.html cloud-similar-selector-v68.html .github/workflows/build-v68.yml
          git commit -m "Add v68 raster-verified serialization"
          git push origin HEAD:candidate/v68-raster-postsave