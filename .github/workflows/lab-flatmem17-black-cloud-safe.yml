name: Lab flatmem17 black cloud safe
on:
  push:
    branches:
      - lab/v2.1-flatmem17-black-cloud-safe
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v2.1-flatmem17-black-cloud-safe
      - name: Refine black cloud component validation only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('lab-selector-v4/selector-nubes-multistream-core.html')
          w=Path('lab-selector-v4/index.html')
          s=p.read_text(); h=w.read_text()
          marker='cs.filter(v=>Math.abs(v-mc)'
          if marker not in s:
              new="function blackCloudSafe(g){if(!g||g.length<12||g.some(v=>!isNearBlackStroke(v)))return false;const ds=g.map(v=>diag(v.bbox)).filter(Boolean),ws=g.map(v=>Math.abs(Number(v.width)||0)),cs=g.map(v=>Number(v.curves||0)),ss=g.map(v=>Number(v.segs||0));const md=med(ds),mw=med(ws),mc=med(cs),ms=med(ss);if(!md||diag(componentBox(g))/md<5.5)return false;if(g.filter(v=>(v.curves||0)>0).length/g.length<.96)return false;if(mc<1||ms<1)return false;if(cs.filter(v=>Math.abs(v-mc)<=Math.max(1,mc*.35)).length/g.length<.86)return false;if(ss.filter(v=>Math.abs(v-ms)<=Math.max(1,ms*.35)).length/g.length<.86)return false;return Math.max(...ws)-Math.min(...ws)<=Math.max(.05,mw*.25)}"
              s,n=re.subn(r"function blackCloudSafe\(g\)\{.*?\}(?=\nfunction blackCloudLike)",new,s,count=1,flags=re.S)
              assert n==1
          if '20260907-flatmem17' not in h:
              assert '20260907-flatmem16' in h
              h=h.replace('20260907-flatmem16','20260907-flatmem17',1)
          p.write_text(s); w.write_text(h)
          PY
      - name: Validate invariants
        run: |
          grep -Fq "cs.filter(v=>Math.abs(v-mc)" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "flatGiantExactModel" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "saveToBuffer('compress')" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "strictCompactBandedMap(visualSelected)" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "20260907-flatmem17" lab-selector-v4/index.html
      - name: Commit candidate
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add lab-selector-v4
          if ! git diff --cached --quiet; then
            git commit -m 'Lab V2.1: validate black cloud components by curve signature'
            git push origin HEAD:lab/v2.1-flatmem17-black-cloud-safe
          fi
      - name: Publish isolated path
        run: |
          cp lab-selector-v4/index.html /tmp/index.html
          cp lab-selector-v4/selector-nubes-multistream-core.html /tmp/core.html
          git fetch origin gh-pages
          git switch -C gh-pages origin/gh-pages
          mkdir -p lab-selector-flatmem17
          cp /tmp/index.html lab-selector-flatmem17/index.html
          cp /tmp/core.html lab-selector-flatmem17/selector-nubes-multistream-core.html
          git add lab-selector-flatmem17
          if ! git diff --cached --quiet; then
            git commit -m 'Publish isolated CloudForge flatmem17 black-cloud-safe candidate'
            git push origin gh-pages
          fi
