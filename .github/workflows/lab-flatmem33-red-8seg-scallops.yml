name: Lab flatmem33 red 8seg scallops
on:
  push:
    branches:
      - lab/v2.2-flatmem33-red-8seg-scallops
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v2.2-flatmem33-red-8seg-scallops
      - name: Patch safe red scallop selection only
        shell: bash
        run: echo '' | base64 -d | python
      - name: Validate invariants
        shell: bash
        run: |
          grep -Fq "function redScallopPrimitive" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "dirs.length<6||dirs.length>14" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "if(prefRed){famVisual=prefRed}" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "function blackCloudSafe" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "flatGiantExactModel" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "strictCompactBandedMap(visualSelected)" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "saveToBuffer('compress')" lab-selector-v4/selector-nubes-multistream-core.html
          python - <<'PY'
          from pathlib import Path
          s=Path('lab-selector-v4/selector-nubes-multistream-core.html').read_text();a=s.index('<script type="module">')+len('<script type="module">');b=s.index('</script>',a);Path('/tmp/f33.mjs').write_text(s[a:b])
          PY
          node --check /tmp/f33.mjs
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html
          git commit -m "Lab V2.2: select red 8-segment scallop clouds safely"
          git push origin HEAD:lab/v2.2-flatmem33-red-8seg-scallops
      - name: Publish isolated path
        shell: bash
        run: |
          mkdir -p /tmp/pub33
          cp lab-selector-v4/index.html /tmp/pub33/index.html
          cp lab-selector-v4/selector-nubes-multistream-core.html /tmp/pub33/selector-nubes-multistream-core.html
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf lab-selector-flatmem33
          mkdir -p lab-selector-flatmem33
          cp /tmp/pub33/* lab-selector-flatmem33/
          git add lab-selector-flatmem33
          git commit -m "Publish isolated CloudForge flatmem33 red scallop selector"
          git push origin gh-pages
