name: build-selector-widget-causal
on:
  push:
    branches: [candidate/selector-widget-causal]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate widget causal viewer
        run: python tmp-build-widget-causal.py
      - name: Syntax check
        run: node --check /tmp/selector-nubes-causal-widget.mjs
      - name: Verify widget causal markers
        run: |
          grep -q "widgets probados" selector-nubes-causal-widget-core.html
          grep -q "getWidgets" selector-nubes-causal-widget-core.html
          grep -q "tp.delete(w)" selector-nubes-causal-widget-core.html
          grep -q "plan.widgets" selector-nubes-causal-widget-core.html
      - name: Commit generated viewer
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add selector-nubes-causal-widget-core.html selector-nubes-causal-widget.html
          git diff --cached --quiet || git commit -m "Add exact causal widget deletion"
          git push
