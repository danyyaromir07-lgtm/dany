name: build-v67
on: push
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/candidate/v67-incremental-save'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v67-incremental-save
      - name: Generate and validate v67
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          core=Path('cloud-similar-selector-v66-core.html').read_text()
          core=core.replace('Selector de nubes v66 · copia directa y verificación exacta','Selector de nubes v67 · guardado incremental verificado')
          core=core.replace("async function attempt(selectedIdx,number){", "async function attempt(selectedIdx,number,saveMode){")
          old="const outBuf=work.saveToBuffer('garbage=4,compress=yes,appearance=yes'),out=new Uint8Array(U(outBuf));"
          new="if(saveMode==='incremental'&&work.canBeSavedIncrementally?.()===false)throw new Error('MuPDF indica que este PDF no admite guardado incremental');const outBuf=work.saveToBuffer(saveMode),out=new Uint8Array(U(outBuf));"
          assert old in core
          core=core.replace(old,new)
          core=core.replace("return{out,touched,number}}finally", "return{out,touched,number,saveMode:saveMode||'reescritura mínima'}}finally")
          old_outer="for(let i=0;i<routes.length;i++){status.textContent='Verificando eliminación exacta · correspondencia '+(i+1)+'/'+routes.length+' · '+selectedVisual+' trazos azules…';try{const ok=await attempt(routes[i],i+1);if(ok){activeBytes=ok.out;doc.destroy();doc=mupdf.PDFDocument.openDocument(activeBytes,'application/pdf');pending=true;await renderPage();status.textContent='Selección eliminada y verificada: '+selectedVisual+' trazos azules · correspondencia '+ok.number+'/'+routes.length+' · '+ok.touched+' stream(s). Puedes continuar o guardar.';return}}catch(e){lastError=e.message}}"
          new_outer="const saveModes=['incremental','','compress=yes'];for(let i=0;i<routes.length;i++)for(let sm=0;sm<saveModes.length;sm++){const saveMode=saveModes[sm],label=saveMode||'reescritura mínima';status.textContent='Verificando eliminación exacta · correspondencia '+(i+1)+'/'+routes.length+' · guardado '+label+' · '+selectedVisual+' trazos azules…';try{const ok=await attempt(routes[i],i+1,saveMode);if(ok){activeBytes=ok.out;doc.destroy();doc=mupdf.PDFDocument.openDocument(activeBytes,'application/pdf');pending=true;await renderPage();status.textContent='Selección eliminada y verificada: '+selectedVisual+' trazos azules · correspondencia '+ok.number+'/'+routes.length+' · guardado '+ok.saveMode+' · '+ok.touched+' stream(s). Puedes continuar o guardar.';return}}catch(e){lastError='guardado '+label+' · '+e.message}}"
          assert old_outer in core
          core=core.replace(old_outer,new_outer)
          core=core.replace("se probaron '+routes.length+' correspondencia(s) y ninguna pasó", "se probaron '+routes.length+' correspondencia(s) con '+saveModes.length+' estrategias de guardado y ninguna pasó")
          Path('cloud-similar-selector-v67-core.html').write_text(core)
          wrap=Path('cloud-similar-selector-v66.html').read_text()
          wrap=wrap.replace('Selector de nubes v66 · copia directa + metadatos','Selector de nubes v67 · guardado incremental + metadatos')
          wrap=wrap.replace('cloud-similar-selector-v66-core.html?v=20260902-direct1','cloud-similar-selector-v67-core.html?v=20260903-incremental1')
          Path('cloud-similar-selector-v67.html').write_text(wrap)
          scripts=re.findall(r'<script type="module">(.*?)</script>',core,re.S); assert len(scripts)==1
          Path('/tmp/v67.mjs').write_text(scripts[0])
          plain=re.findall(r'<script>(.*?)</script>',wrap,re.S); assert plain
          Path('/tmp/v67-wrapper.js').write_text('\n'.join(plain))
          assert "saveModes=['incremental','','compress=yes']" in core
          assert "canBeSavedIncrementally" in core
          assert "bagOK(afterVisual)" in core
          assert 'cloud-similar-selector-v67-core.html?v=20260903-incremental1' in wrap
          PY
          node --check /tmp/v67.mjs
          node --check /tmp/v67-wrapper.js
          rm .github/workflows/build-v67.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-similar-selector-v67-core.html cloud-similar-selector-v67.html .github/workflows/build-v67.yml
          git commit -m "Add v67 verified incremental save strategy"
          git push origin HEAD:candidate/v67-incremental-save
