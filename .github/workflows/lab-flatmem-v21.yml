name: Lab flat-memory V2.1
on:
  push:
    branches: [lab/v2.1-flatmem1]
    paths:
      - '.github/scripts/patch-flatmem-v21.py'
      - '.github/workflows/lab-flatmem-v21.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v2.1-flatmem1
          fetch-depth: 0
      - name: Patch exact V2.1 candidate
        run: python .github/scripts/patch-flatmem-v21.py
      - name: Syntax and invariant checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('lab-selector-v4/selector-nubes-multistream-core.html').read_text()
          assert 'flatGiantExactModel' in s
          assert 'flatCurveExact:true' in s
          assert 'u.fill(32,r.start,r.end)' in s
          assert "strictCompactBandedMap(visualSelected)" in s
          assert "buildCausalRoute" in s  # legacy remains present but removeGroup exact path is unchanged
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/core.mjs').write_text(m.group(1))
          print('core markers ok')
          PY
          node --check /tmp/core.mjs
          grep -q 'By: DanHL' lab-selector-v4/index.html
          grep -q '20260907-flatmem1' lab-selector-v4/index.html
      - name: Commit candidate on isolated lab branch
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html
          git commit -m 'Lab V2.1: exact flat-page memory optimization'
          git push origin HEAD:lab/v2.1-flatmem1
          cp lab-selector-v4/index.html /tmp/flatmem-index.html
          cp lab-selector-v4/selector-nubes-multistream-core.html /tmp/flatmem-core.html
      - name: Publish isolated lab path only
        shell: bash
        run: |
          git fetch origin gh-pages
          git switch -C gh-pages origin/gh-pages
          mkdir -p lab-selector-flatmem1
          cp /tmp/flatmem-index.html lab-selector-flatmem1/index.html
          cp /tmp/flatmem-core.html lab-selector-flatmem1/selector-nubes-multistream-core.html
          git add lab-selector-flatmem1
          git commit -m 'Publish isolated CloudForge V2.1 flat-memory candidate'
          git push origin gh-pages
