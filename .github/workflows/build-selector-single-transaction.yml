name: Build selector single transaction
on:
  push:
    branches: [candidate/selector-single-transaction]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/selector-single-transaction
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch selector
        run: |
          if grep -q "function makeDirectEditPlan" selector-nubes-multistream-core.html; then
            echo "candidate already generated"
          else
            python tmp-selector-single-transaction.py
          fi
      - name: Static invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('selector-nubes-multistream-core.html').read_text()
          required=['function makeDirectEditPlan','function applyDirectEditPlan','async function attemptSingleTransaction','transacción directa 1:1','giantSingleTransaction','function strokeEditRanges','function applyStrokeGroups','async function rasterDigest','if(!bagOK(previewVisual))','buildCausalRoute','editRanges']
          for x in required: assert x in s, x
          assert "if(vs.length<180&&classicVisual.length<250000)" in s
          assert "página excepcionalmente grande" not in s
          print('static invariants ok')
          PY
      - name: JavaScript syntax diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('selector-nubes-multistream-core.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/selector.mjs').write_text(m.group(1))
          PY
          set +e
          node --check /tmp/selector.mjs > selector-syntax.log 2>&1
          echo $? > selector-syntax.code
          set -e
      - name: Commit generated core and diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selector-nubes-multistream-core.html selector-syntax.log selector-syntax.code
          git commit -m "Validate single-transaction selector candidate" || true
          git push origin HEAD:candidate/selector-single-transaction
      - name: Enforce syntax
        run: |
          cat selector-syntax.log
          test "$(cat selector-syntax.code)" = "0"
