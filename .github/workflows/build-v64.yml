name: build-v64
on: push
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/candidate/v64-multiroute-transaction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v64-multiroute-transaction
      - name: Generate and validate v64
        shell: bash
        run: |
          cat > /tmp/build_v64.py <<'PY'
          from pathlib import Path
          s=Path('cloud-similar-selector-v63-core.html').read_text()
          s=s.replace('Selector de nubes v63 · interfaz profesional','Selector de nubes v64 · borrado multirruta seguro')
          s=s.replace('v63 · misma lógica v62 · interfaz profesional · borrado transaccional exacto.','v64 · interfaz profesional · correspondencias múltiples · borrado transaccional exacto.')
          s=s.replace('selectionMapSafe=false,selectionFamilies=0,sharpTimer=null;','selectionMapSafe=false,selectionFamilies=0,selectionAlternatives=[],sharpTimer=null;')
          s=s.replace('visualSelected=[];structSelected=[];selectionMapSafe=false;selectionFamilies=0;const p=doc.loadPage(0);','visualSelected=[];structSelected=[];selectionMapSafe=false;selectionFamilies=0;selectionAlternatives=[];const p=doc.loadPage(0);')
          a=s.index('function mapBlue(vs,blocked=[]){')
          b=s.index('function setButtons()',a)
          new_map="""function spatialRoute(vs,blocked=[]){\n const used=new Set(blocked),m=model.strokes.length,K=24,lists=[];\n for(const v of vs){const best=[];for(let si=0;si<m;si++){const st=model.strokes[si];if(used.has(st)||st?.editable===false)continue;const c=alignCost(v,st);if(!Number.isFinite(c)||c>1.35)continue;best.push({idx:si,s:st,score:c})}best.sort((x,y)=>x.score-y.score);const keep=best.slice(0,K);if(!keep.length)return null;lists.push(keep)}\n const order=lists.map((a,i)=>({i,n:a.length,margin:(a[1]?.score??99)-a[0].score,best:a[0].score})).sort((x,y)=>x.n-y.n||y.margin-x.margin||x.best-y.best),owner=new Map(),chosen=new Array(vs.length);\n function place(vi,seen){for(const c of lists[vi]){if(seen.has(c.idx))continue;seen.add(c.idx);const old=owner.get(c.idx);if(old==null||place(old,seen)){owner.set(c.idx,vi);chosen[vi]=c;return true}}return false}\n for(const z of order)if(!place(z.i,new Set()))return null;\n return chosen.map(x=>x.s)\n}\nfunction proportionalRoute(vs,blocked=[]){const used=new Set(blocked),n=classicVisual.length,m=model.strokes.length,out=[];let prev=-1;for(const v of vs){const target=(Number(v._ordinal||0)+.5)/Math.max(1,n);let idx=Math.max(prev+1,Math.round(target*m-.5));while(idx<m&&(used.has(model.strokes[idx])||model.strokes[idx]?.editable===false))idx++;if(idx>=m)return null;out.push(model.strokes[idx]);prev=idx}return out}\nfunction routeKey(a){return a?.map(x=>model.strokes.indexOf(x)).join(',')||''}\nfunction mapBlue(vs,blocked=[]){\n if(!model?.strokes?.length||model.incomplete)return{items:[],alternatives:[],mode:model?.incomplete?'modelo interno incompleto':'sin modelo estructural'};\n if(!vs.length)return{items:[],alternatives:[],mode:'sin selección'};\n const used=new Set(blocked),n=classicVisual.length,m=model.strokes.length,K=160;\n if(m<vs.length+used.size)return{items:[],alternatives:[],mode:'menos operadores estructurales que trazos azules'};\n let mono=null;const layers=[];\n for(const v of vs){const target=(Number(v._ordinal||0)+.5)/Math.max(1,n),anchor=Math.max(0,Math.min(m-1,Math.round(target*m-.5))),window=Math.max(120,Math.ceil(m*.06)),best=[],seen=new Set();const add=si=>{if(si<0||si>=m||seen.has(si))return;seen.add(si);const st=model.strokes[si];if(used.has(st)||st?.editable===false)return;const c=alignCost(v,st);if(!Number.isFinite(c))return;const order=Math.abs(target-(si+.5)/Math.max(1,m));best.push({s:st,idx:si,score:c+order*.55})};for(let si=Math.max(0,anchor-window);si<=Math.min(m-1,anchor+window);si++)add(si);if(best.length<K)for(let si=0;si<m;si+=Math.max(1,Math.floor(m/240)))add(si);best.sort((x,y)=>x.score-y.score);const keep=best.slice(0,K).sort((x,y)=>x.idx-y.idx);if(!keep.length){layers.length=0;break}layers.push(keep)}\n if(layers.length===vs.length){const states=[layers[0].map(c=>({cost:c.score,prev:-1}))];for(let li=1;li<layers.length;li++){const A=layers[li-1],B=layers[li],pv=states[li-1],cur=new Array(B.length);let bc=Infinity,bi=-1,p=0;for(let j=0;j<B.length;j++){while(p<A.length&&A[p].idx<B[j].idx){if(pv[p].cost<bc){bc=pv[p].cost;bi=p}p++}cur[j]={cost:Number.isFinite(bc)?bc+B[j].score:Infinity,prev:bi}}states.push(cur)}let end=-1,best=Infinity,last=states.at(-1);for(let i=0;i<last.length;i++)if(last[i].cost<best){best=last[i].cost;end=i}if(end>=0&&Number.isFinite(best)){mono=new Array(layers.length);for(let li=layers.length-1;li>=0;li--){mono[li]=layers[li][end].s;end=states[li][end].prev}}}\n const spatial=spatialRoute(vs,blocked),prop=proportionalRoute(vs,blocked),alternatives=[],seenKeys=new Set();for(const r of [mono,spatial,prop]){if(!r||r.length!==vs.length)continue;const k=routeKey(r);if(!k||seenKeys.has(k))continue;seenKeys.add(k);alternatives.push(r)}\n if(!alternatives.length)return{items:[],alternatives:[],mode:'sin correspondencia estructural candidata'};\n const principal=mono?'monotónica':spatial?'espacial 1:1':'proporcional';return{items:alternatives[0],alternatives,mode:'multirruta '+alternatives.length+' · principal='+principal+' · '+vs.length+'/'+vs.length}\n}\n"""
          s=s[:a]+new_map+s[b:]
          old="const map=mapBlue(visualSelected,[]);structSelected=map.items;selectionMapSafe=!model?.incomplete&&structSelected.length===visualSelected.length&&visualSelected.length>0;"
          new="const map=mapBlue(visualSelected,[]);structSelected=map.items;selectionAlternatives=map.alternatives||[];selectionMapSafe=!model?.incomplete&&structSelected.length===visualSelected.length&&visualSelected.length>0&&selectionAlternatives.length>0;"
          assert old in s
          s=s.replace(old,new)
          a=s.index('async function removeGroup(){')
          b=s.index("$('#open').addEventListener",a)
          new_remove="""async function removeGroup(){if(!doc||!model||!selectionMapSafe||!visualSelected.length)return;if(model.incomplete){status.textContent='Borrado bloqueado: el recorrido de streams internos quedó incompleto.';return}const beforeVisual=classicVisual.length,beforeStruct=model.strokes.length,selectedVisual=visualSelected.length,expected=new Map();for(const v of classicVisual){if(visualSelected.includes(v))continue;const k=sig(v);expected.set(k,(expected.get(k)||0)+1)}const bagOK=a=>{if(a.length!==beforeVisual-selectedVisual)return false;const b=new Map();for(const v of a){const k=sig(v);b.set(k,(b.get(k)||0)+1)}if(b.size!==expected.size)return false;for(const[k,n]of expected)if(b.get(k)!==n)return false;return true};const routes=[],keys=new Set();for(const r of [structSelected,...selectionAlternatives]){if(!r||r.length!==selectedVisual)continue;const idx=r.map(x=>model.strokes.indexOf(x));if(idx.some(i=>i<0)||new Set(idx).size!==idx.length)continue;const k=idx.join(',');if(keys.has(k))continue;keys.add(k);routes.push(idx)}if(!routes.length){status.textContent='Borrado bloqueado: no hay correspondencias estructurales completas para la selección azul.';return}const base=doc.saveToBuffer('garbage=4,compress=yes,appearance=yes'),outBase=new Uint8Array(U(base));let lastError='ninguna correspondencia superó la verificación exacta';async function attempt(selectedIdx,number){let work=null,wp=null,check=null,cp=null;try{work=mupdf.PDFDocument.openDocument(outBase,'application/pdf');wp=work.loadPage(0);const wm=deepModel(wp);if(!wm||wm.incomplete||wm.strokes.length!==beforeStruct)throw new Error('el modelo profundo de la copia no coincide con el modelo activo');const targets=selectedIdx.map(i=>wm.strokes[i]);if(targets.some(x=>!x||x.editable===false))throw new Error('hay operadores candidatos no editables con seguridad');const selectedBySource=new Map(),allBySource=new Map();for(const t of targets)(selectedBySource.get(t.sourceKey)||selectedBySource.set(t.sourceKey,[]).get(t.sourceKey)).push(t);for(const q of wm.strokes)(allBySource.get(q.sourceKey)||allBySource.set(q.sourceKey,[]).get(q.sourceKey)).push(q);for(const[k,a]of selectedBySource){const all=allBySource.get(k)||[];if(a.length!==all.length)throw new Error('XObject compartido: un operador candidato también produce geometría no seleccionada')}const edits=new Map();for(const t of targets){const k=deepKey(t.sourceRef)+'|'+t.start+'|'+t.end;if(!edits.has(k))edits.set(k,{ref:t.sourceRef,refKey:deepKey(t.sourceRef),start:t.start,end:t.end})}const byRef=new Map();for(const e of edits.values())(byRef.get(e.refKey)||byRef.set(e.refKey,{ref:e.ref,ranges:[]}).get(e.refKey)).ranges.push([e.start,e.end]);let touched=0;for(const g of byRef.values()){let text=latin(g.ref.readStream());for(const[a,b]of g.ranges.sort((A,B)=>B[0]-A[0])){if(a<0||b>text.length||a>=b)throw new Error('rango local inválido en stream interno');text=text.slice(0,a)+text.slice(b)}g.ref.writeStream(raw(text));touched++}if(!touched)throw new Error('no se encontró ningún stream editable');const outBuf=work.saveToBuffer('garbage=4,compress=yes,appearance=yes'),out=new Uint8Array(U(outBuf));wp.destroy?.();wp=null;work.destroy();work=null;check=mupdf.PDFDocument.openDocument(out,'application/pdf');cp=check.loadPage(0);const afterVisual=collectVisual(cp),am=deepModel(cp);if(!am||am.incomplete||am.strokes.length!==beforeStruct-selectedIdx.length||!bagOK(afterVisual))throw new Error('la geometría resultante no coincide exactamente con original menos azul');return{out,touched,number}}finally{try{cp?.destroy?.()}catch(_){}try{check?.destroy?.()}catch(_){}try{wp?.destroy?.()}catch(_){}try{work?.destroy?.()}catch(_){}}}\n for(let i=0;i<routes.length;i++){status.textContent='Verificando eliminación exacta · correspondencia '+(i+1)+'/'+routes.length+' · '+selectedVisual+' trazos azules…';try{const ok=await attempt(routes[i],i+1);if(ok){doc.destroy();doc=mupdf.PDFDocument.openDocument(ok.out,'application/pdf');pending=true;await renderPage();status.textContent='Selección eliminada y verificada: '+selectedVisual+' trazos azules · correspondencia '+ok.number+'/'+routes.length+' · '+ok.touched+' stream(s). Puedes continuar o guardar.';return}}catch(e){lastError=e.message}}\n status.textContent='Borrado cancelado sin modificar el PDF activo: se probaron '+routes.length+' correspondencia(s) y ninguna pasó la verificación geométrica exacta · '+lastError}\n}\n"""
          s=s[:a]+new_remove+s[b:]
          Path('cloud-similar-selector-v64-core.html').write_text(s)
          w=Path('cloud-similar-selector-v63.html').read_text()
          w=w.replace('Selector de nubes v63 · interfaz profesional','Selector de nubes v64 · borrado multirruta seguro')
          w=w.replace('cloud-similar-selector-v63-core.html?v=20260902-ui1','cloud-similar-selector-v64-core.html?v=20260902-multiroute1')
          w=w.replace("console.error('v63 batch hooks'","console.error('v64 batch hooks'")
          Path('cloud-similar-selector-v64.html').write_text(w)
          PY
          python /tmp/build_v64.py
          python - <<'PY'
          from pathlib import Path
          import re
          core=Path('cloud-similar-selector-v64-core.html').read_text()
          scripts=re.findall(r'<script type="module">(.*?)</script>',core,re.S)
          assert len(scripts)==1
          Path('/tmp/v64.mjs').write_text(scripts[0])
          wrap=Path('cloud-similar-selector-v64.html').read_text()
          plain=re.findall(r'<script>(.*?)</script>',wrap,re.S)
          assert plain
          Path('/tmp/v64-wrapper.js').write_text('\n'.join(plain))
          assert 'selectionAlternatives' in core
          assert 'se probaron ' in core
          assert 'cloud-similar-selector-v64-core.html?v=20260902-multiroute1' in wrap
          PY
          node --check /tmp/v64.mjs
          node --check /tmp/v64-wrapper.js
          rm .github/workflows/build-v64.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-similar-selector-v64-core.html cloud-similar-selector-v64.html .github/workflows/build-v64.yml
          git commit -m "Add v64 transactional multi-route deletion"
          git push origin HEAD:candidate/v64-multiroute-transaction
