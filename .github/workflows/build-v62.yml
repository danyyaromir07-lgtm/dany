name: build-v62
on: push
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/candidate/v62-remap-full-union'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v62-remap-full-union
      - name: Generate v62 from v61
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('cloud-similar-selector-v61-core.html').read_text()
          s=s.replace('Selector de nubes v61 · parser multipath + mapeo tolerante','Selector de nubes v62 · acumulado global remapeado')
          s=s.replace('v61 · selector clásico estable · parser multipath · mapeo tolerante · borrado transaccional exacto.','v62 · selector clásico estable · acumulado global · parser multipath · borrado transaccional exacto.')
          a=s.index('function chooseClassic(e){')
          b=s.index('\nconst r3=',a)
          new="""function chooseClassic(e){if(!classicVisual.length){status.textContent='MuPDF no entregó trazos visuales para esta página.';return}const add=!!(e.ctrlKey||e.shiftKey),prevVisual=add?visualSelected.slice():[],prevFamilies=add?selectionFamilies:0,r=viewport.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top,bx=(sx-panX)/zoom,by=(sy-panY)/zoom,x=pageBounds[0]+bx/baseRs,y=pageBounds[1]+by/baseRs;let best=null,bd=Infinity;const pad=15/Math.max(.1,baseRs*zoom);for(const s of classicVisual){if(x<s.bbox[0]-pad||x>s.bbox[2]+pad||y<s.bbox[1]-pad||y>s.bbox[3]+pad)continue;const d=distance(s,x,y);if(d<bd){bd=d;best=s}}const tol=14/Math.max(.1,baseRs*zoom);if(!best||bd>tol){status.textContent='No encontré un trazo visual suficientemente cerca.';return}const famVisual=classicVisual.filter(v=>similar(v,best)),newVisual=famVisual.filter(v=>!prevVisual.includes(v));visualSelected=add?[...new Set([...prevVisual,...famVisual])]:famVisual;visualSelected.sort((a,b)=>a._ordinal-b._ordinal);selectionFamilies=add?(prevFamilies+(newVisual.length?1:0)):1;const map=mapBlue(visualSelected,[]);structSelected=map.items;selectionMapSafe=!model?.incomplete&&structSelected.length===visualSelected.length&&visualSelected.length>0;drawSelection();setButtons();const vg=components(visualSelected);status.textContent='Selección acumulada · familias='+selectionFamilies+' · resaltados='+visualSelected.length+' · grupos≈'+vg+' · mapeo='+map.mode+' · operadores='+structSelected.length+' · forms='+(model?.forms||0)+(selectionMapSafe?' · LISTO PARA ELIMINAR':' · borrado bloqueado: no existe una ruta monotónica segura para toda la unión azul')+' · Ctrl/Shift+clic añade otro tipo'}"""
          s=s[:a]+new+s[b:]
          Path('cloud-similar-selector-v62-core.html').write_text(s)
          w=Path('cloud-similar-selector-v61.html').read_text()
          w=w.replace('Selector de nubes v61 · multipath tolerante','Selector de nubes v62 · acumulado global')
          w=w.replace('cloud-similar-selector-v61-core.html?v=20260902-multipath1','cloud-similar-selector-v62-core.html?v=20260902-union1')
          w=w.replace("console.error('v61 batch hooks'","console.error('v62 batch hooks'")
          Path('cloud-similar-selector-v62.html').write_text(w)
          PY
          python - <<'PY'
          from pathlib import Path
          s=Path('cloud-similar-selector-v62-core.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.rindex('</script>')
          Path('/tmp/v62.mjs').write_text(s[a:b])
          PY
          node --check /tmp/v62.mjs
          rm .github/workflows/build-v62.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-similar-selector-v62-core.html cloud-similar-selector-v62.html .github/workflows/build-v62.yml
          git commit -m "Add v62 full accumulated remapping"
          git push origin HEAD:candidate/v62-remap-full-union
