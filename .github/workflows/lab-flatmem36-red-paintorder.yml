name: Lab flatmem36 red paint-order
on:
  push:
    branches:
      - lab/v2.2-flatmem36-red-paintorder
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v2.2-flatmem36-red-paintorder
      - name: Patch candidate
        run: python .github/scripts/patch-flatmem36-red-paintorder.py
      - name: Validate
        run: |
          grep -Fq "function redTopComponent" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "if(prefRedTop){famVisual=prefRedTop}" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "function blackCloudSafe" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "strictCompactBandedMap(visualSelected)" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "saveToBuffer('compress')" lab-selector-v4/selector-nubes-multistream-core.html
          python - <<'PY'
          from pathlib import Path
          s=Path('lab-selector-v4/selector-nubes-multistream-core.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/f36.mjs').write_text(s[a:b])
          PY
          node --check /tmp/f36.mjs
      - name: Commit candidate
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html
          git commit -m "Lab V2.2: prefer top-painted exploded red cloud component"
          git push origin HEAD:lab/v2.2-flatmem36-red-paintorder
      - name: Publish isolated path
        run: |
          mkdir -p /tmp/pub36
          cp lab-selector-v4/index.html /tmp/pub36/index.html
          cp lab-selector-v4/selector-nubes-multistream-core.html /tmp/pub36/selector-nubes-multistream-core.html
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf lab-selector-flatmem36
          mkdir -p lab-selector-flatmem36
          cp /tmp/pub36/* lab-selector-flatmem36/
          git add lab-selector-flatmem36
          git commit -m "Publish isolated CloudForge flatmem36 red paint-order selector"
          git push origin gh-pages
