name: build-v61
on:
  push:
    branches:
      - candidate/v61-multipath-safe
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v61-multipath-safe
      - run: python tools/build_v61.py
      - run: |
          rm .github/workflows/build-v61.yml tools/build_v61.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add v61 multipath tolerant mapping"
          git push origin HEAD:candidate/v61-multipath-safe
