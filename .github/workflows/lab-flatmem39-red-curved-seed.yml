name: Lab flatmem39 red curved seed
on:
  push:
    branches:
      - lab/v2.2-flatmem39-red-curved-seed
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v2.2-flatmem39-red-curved-seed
      - name: Patch candidate
        run: python .github/scripts/patch-flatmem39-red-curved-seed.py
      - name: Validate
        shell: bash
        run: |
          grep -Fq "function red39Component" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "function red39SeedPiece" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "if(prefRed39){famVisual=prefRed39}" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "function blackCloudSafe" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "strictCompactBandedMap(visualSelected)" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "saveToBuffer('compress')" lab-selector-v4/selector-nubes-multistream-core.html
          python - <<'PY'
          from pathlib import Path
          s=Path('lab-selector-v4/selector-nubes-multistream-core.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/f39.mjs').write_text(s[a:b])
          PY
          node --check /tmp/f39.mjs
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html
          git commit -m "Lab V2.2: select exploded red cloud from curved seed"
          git push origin HEAD:lab/v2.2-flatmem39-red-curved-seed
      - name: Publish isolated path
        shell: bash
        run: |
          mkdir -p /tmp/pub39
          cp lab-selector-v4/index.html /tmp/pub39/index.html
          cp lab-selector-v4/selector-nubes-multistream-core.html /tmp/pub39/selector-nubes-multistream-core.html
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf lab-selector-flatmem39
          mkdir -p lab-selector-flatmem39
          cp /tmp/pub39/* lab-selector-flatmem39/
          git add lab-selector-flatmem39
          git commit -m "Publish isolated CloudForge flatmem39 curved-seed red selector"
          git push origin gh-pages
