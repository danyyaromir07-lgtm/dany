name: build-v63
on: push
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/candidate/v63-premium-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v63-premium-ui
      - name: Build static v63 from v62
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          core=Path('cloud-similar-selector-v62-core.html').read_text()
          core=core.replace('Selector de nubes v62 · acumulado global remapeado','Selector de nubes v63 · interfaz profesional',1)
          core=core.replace('v62 · selector clásico estable · acumulado global · parser multipath · borrado transaccional exacto.','v63 · misma lógica v62 · interfaz profesional · borrado transaccional exacto.',1)
          core_css=r'''<style id="v63-premium-css">
          :root{--v63-bg:#08111d;--v63-panel:#0e1b2a;--v63-line:#263d56;--v63-muted:#93a7bc;--v63-blue:#2f8cff;--v63-green:#35dc78;--v63-red:#ef4f57}
          html,body{background:linear-gradient(180deg,#08111d,#0b1623)!important;color:#f5f8fc!important;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important}
          .top{height:72px!important;padding:12px 16px!important;gap:10px!important;background:rgba(9,19,31,.97)!important;border-bottom:1px solid #1e3348!important;box-shadow:0 8px 28px rgba(0,0,0,.2)!important;backdrop-filter:blur(18px)}
          .top button{height:44px!important;padding:0 15px!important;border:1px solid #2c435d!important;border-radius:9px!important;background:linear-gradient(180deg,#182a3d,#112033)!important;color:#f5f8fc!important;font-weight:700!important;box-shadow:inset 0 1px rgba(255,255,255,.04)!important}
          .top button:hover:not(:disabled){border-color:#446686!important;transform:translateY(-1px)}
          #select{border-color:#338cff!important;background:linear-gradient(180deg,#2588fa,#1269dd)!important}
          #delete:not(:disabled){border-color:#f15b62!important;background:linear-gradient(180deg,#f25a61,#d63a43)!important}
          #save:not(:disabled){border-color:#338cff!important;background:linear-gradient(180deg,#2588fa,#1269dd)!important}
          .sep{height:38px!important;background:#263b52!important}.zoomBox{margin-left:auto!important;border:1px solid #2a4058!important;border-radius:10px!important;background:#0e1a29!important;padding:5px 7px!important}.zoomBox button{height:34px!important;background:#17283a!important}.zoomBox input{accent-color:#2f8cff!important}.mode{max-width:220px;overflow:hidden;text-overflow:ellipsis;padding:9px 12px!important;border:1px solid #2b425a!important;border-radius:8px!important;background:#111f30!important;color:#a4b6c9!important}
          .main{inset:72px 0 0!important;display:grid!important;grid-template-rows:minmax(0,1fr) auto!important;padding:12px!important;gap:12px!important;background:#08111d!important}
          .viewport{grid-row:1!important;border:1px solid #263d56!important;border-radius:12px!important;background:#111923!important;box-shadow:0 18px 55px rgba(0,0,0,.28)!important;overflow:hidden!important}
          .bottomDock{grid-row:2;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;min-height:114px}
          .selectionCard,.helpCard{border:1px solid #29445f;border-radius:12px;background:linear-gradient(180deg,#0f1e2f,#0b1725);box-shadow:0 12px 35px rgba(0,0,0,.18)}
          .selectionCard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:15px 18px;border-color:#286bb7}.selectionGlyph{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#17477d,#10325a);border:1px solid #2a6caf;color:#73b4ff;font-size:22px}.selectionTitle{font-size:15px;font-weight:800;margin-bottom:5px}.status{min-height:0!important;padding:0!important;border:0!important;background:transparent!important;color:#adbed0!important;font-size:13px!important;line-height:1.45!important}.readyBadge{min-width:190px;padding:13px 16px;border-radius:9px;border:1px solid #314a61;background:#152536;color:#8fa4ba;text-align:center;font-weight:850;letter-spacing:.02em}.readyBadge.ok{background:linear-gradient(180deg,#123f2b,#0d3020);border-color:#23724a;color:#42e683}.readyBadge.bad{background:linear-gradient(180deg,#402329,#2e1b21);border-color:#78343d;color:#ff8c92}.helpCard{padding:14px 16px}.helpTitle{font-weight:800;margin-bottom:10px}.helpRow{color:#adbed0;margin:7px 0}.key{display:inline-block;padding:3px 7px;border:1px solid #3a536d;border-radius:6px;background:#152536;color:#eef5fc;font-weight:800}.security{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid #293f56}.security strong{color:#35dc78}
          @media(max-width:980px){.bottomDock{grid-template-columns:1fr}.helpCard{display:none}.mode{display:none}}@media(max-width:760px){.top button{padding:0 10px!important}.zoomBox input{width:80px!important}.selectionCard{grid-template-columns:auto 1fr}.readyBadge{grid-column:1/-1}}
          </style>'''
          core_ui=r'''<script id="v63-premium-ui">(function(){const main=document.querySelector('.main'),st=document.getElementById('status'),vp=document.getElementById('viewport');if(!main||!st||!vp)return;const dock=document.createElement('div');dock.className='bottomDock';const card=document.createElement('section');card.className='selectionCard';const glyph=document.createElement('div');glyph.className='selectionGlyph';glyph.textContent='◫';const text=document.createElement('div');const title=document.createElement('div');title.className='selectionTitle';title.textContent='Selección acumulada';text.append(title,st);const badge=document.createElement('div');badge.id='readyBadge';badge.className='readyBadge';badge.textContent='SIN SELECCIÓN';card.append(glyph,text,badge);const help=document.createElement('aside');help.className='helpCard';help.innerHTML='<div class="helpTitle">Ayuda y seguridad</div><div class="helpRow"><span class="key">Ctrl / Shift</span> + clic añade otra familia</div><div class="helpRow">Clic normal reemplaza la selección actual</div><div class="security"><span>Seguridad del borrado</span><strong id="safetyText">Bloqueado</strong></div>';dock.append(card,help);main.append(dock);const safe=document.getElementById('safetyText'),sync=()=>{const t=st.textContent||'';if(t.includes('LISTO PARA ELIMINAR')){badge.textContent='✓ LISTO PARA ELIMINAR';badge.className='readyBadge ok';if(safe){safe.textContent='Alta';safe.style.color='#35dc78'}}else if(t.includes('borrado bloqueado')||t.includes('Borrado bloqueado')||t.includes('Borrado cancelado')){badge.textContent='BORRADO BLOQUEADO';badge.className='readyBadge bad';if(safe){safe.textContent='Bloqueado';safe.style.color='#ff8c92'}}else{badge.textContent='SIN SELECCIÓN';badge.className='readyBadge';if(safe){safe.textContent='Bloqueado';safe.style.color='#93a7bc'}}};new MutationObserver(sync).observe(st,{childList:true,subtree:true,characterData:true});sync()})();</script>'''
          core=core.replace('</head>',core_css+'</head>',1).replace('</body>',core_ui+'</body>',1)
          Path('cloud-similar-selector-v63-core.html').write_text(core)

          wrap=Path('cloud-similar-selector-v62.html').read_text()
          wrap=wrap.replace('Selector de nubes v62 · acumulado global','Selector de nubes v63 · interfaz profesional',1).replace('cloud-similar-selector-v62-core.html?v=20260902-union1','cloud-similar-selector-v63-core.html?v=20260902-ui1')
          wrap_css=r'''<style id="v63-wrapper-css">
          :root{--v63-bg:#07111d;--v63-line:#233a52;--v63-blue:#2f8cff}html,body{background:#07111d!important;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important}.shell{grid-template-columns:330px minmax(0,1fr)!important;background:linear-gradient(180deg,#08121f,#0a1522)!important}.side{padding:18px 14px 14px!important;gap:10px!important;background:linear-gradient(180deg,#0c1826,#091521)!important;border-right:1px solid #1f344a!important;box-shadow:12px 0 35px rgba(0,0,0,.15)!important}.side h1{font-size:20px!important;letter-spacing:-.02em}.toolbar{grid-template-columns:1fr auto auto!important}.toolbar button{height:42px!important;border:1px solid #2a425c!important;border-radius:9px!important;background:#102031!important;color:#dce7f3!important}.toolbar button:first-child{border-color:#2f8cff!important;background:linear-gradient(180deg,#2185fa,#1469d8)!important;color:white!important;font-weight:800!important}.side input{height:42px!important;background:#0b1724!important;border:1px solid #263d55!important;border-radius:9px!important;color:#eef4fb!important}.meta{color:#91a5ba!important}.list{gap:8px!important}.fileRow{grid-template-columns:minmax(0,1fr) auto!important;padding:11px 10px!important;border:1px solid #172c40!important;border-radius:10px!important;background:linear-gradient(180deg,#111f2e,#0e1b29)!important;transition:.15s!important}.fileRow:hover{border-color:#31516f!important;transform:translateY(-1px)}.fileRow.active{border-color:#2f8cff!important;background:linear-gradient(180deg,#123157,#102642)!important;box-shadow:0 0 0 1px rgba(47,140,255,.16)!important}.fileName{font-weight:700!important}.fileState{padding:5px 7px!important;border-radius:7px!important;background:#1b2a3b!important}.fileState.saved{background:#103521!important;color:#45d982!important}.fileState.dirty{background:#382b10!important;color:#ffc34a!important}.fileState.activeState{background:#12376a!important;color:#64aaff!important}.fileState.discarded{background:#3a1c22!important;color:#ff8d96!important}.viewer{background:#08111d!important}@media(max-width:900px){.shell{grid-template-columns:250px minmax(0,1fr)!important}.side{padding:12px 9px!important}}@media(max-width:700px){.shell{grid-template-columns:1fr!important}.side{display:none!important}}
          </style>'''
          wrap=wrap.replace('</head>',wrap_css+'</head>',1)
          Path('cloud-similar-selector-v63.html').write_text(wrap)

          for src,out in [('cloud-similar-selector-v63-core.html','/tmp/v63-core.mjs'),('cloud-similar-selector-v63.html','/tmp/v63-wrapper.js')]:
              txt=Path(src).read_text(); scripts=re.findall(r'<script(?: type="module")?(?: id="[^"]+")?>(.*?)</script>',txt,re.S); Path(out).write_text('\n'.join(scripts))
          PY
          node --check /tmp/v63-core.mjs
          node --check /tmp/v63-wrapper.js
          grep -q 'cloud-similar-selector-v63-core.html?v=20260902-ui1' cloud-similar-selector-v63.html
          grep -q 'LISTO PARA ELIMINAR' cloud-similar-selector-v63-core.html
          rm .github/workflows/build-v63.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-similar-selector-v63-core.html cloud-similar-selector-v63.html .github/workflows/build-v63.yml
          git commit -m "Add v63 premium interface over v62 engine"
          git push origin HEAD:candidate/v63-premium-ui
