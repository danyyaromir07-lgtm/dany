name: Selector crash guard
on:
  push:
    branches: [candidate/selector-crash-guard]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/selector-crash-guard
      - name: Apply patch
        run: python tmp-selector-crash-guard.py
      - name: Validate JS syntax and invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('selector-nubes-multistream-core.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          js=s[a:b]
          Path('/tmp/selector.mjs').write_text(js)
          required=['hugePageCrashGuard','routeTrialLimit','function strokeEditRanges','function deepModel','function mapBlue','bagOK','Búsqueda causal dirigida']
          for x in required:
              assert x in s, x
          assert "if(hugePageCrashGuard){" in s
          assert "beforeVisual>=250000" in s
          print('invariants ok')
          PY
          node --check /tmp/selector.mjs
      - name: Commit generated core only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add selector-nubes-multistream-core.html
          git diff --cached --quiet && exit 0
          git commit -m 'Guard huge pages from WASM memory crash'
          git push origin HEAD:candidate/selector-crash-guard
