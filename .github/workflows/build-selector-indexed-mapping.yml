name: Indexed structural mapping
on:
  push:
    branches:
      - candidate/selector-indexed-mapping
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/selector-indexed-mapping
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch indexed mapping
        run: python3 tmp-indexed-mapping.py
      - name: Syntax and invariant checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('selector-nubes-multistream-core.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/indexed.mjs').write_text(m.group(1),encoding='utf-8')
          assert 'buildStructIndex' in s
          assert 'nearestOrdinalCandidates' in s
          assert 'índice ordinal-estructural' in s
          assert 'bagOK' in s
          assert 'Búsqueda causal dirigida' in s
          assert 'strokeEditRanges' in s
          assert 'structIndexCache=null' in s
          PY
          node --check /tmp/indexed.mjs
      - name: Commit generated core
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selector-nubes-multistream-core.html
          git commit -m 'Index structural candidates for fast exact mapping' || exit 0
          git push origin HEAD:candidate/selector-indexed-mapping
