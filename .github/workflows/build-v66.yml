name: build-v66
on: push
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/candidate/v66-single-serialization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v66-single-serialization
      - name: Generate and validate v66
        shell: bash
        run: |
          echo '  rdC5zdGFydCsnfCc ' | base64 -d > /tmp/build_v66.py
          python /tmp/build_v66.py
          node --check /tmp/v66.mjs
          node --check /tmp/v66-wrapper.js
          rm .github/workflows/build-v66.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-similar-selector-v66-core.html cloud-similar-selector-v66.html .github/workflows/build-v66.yml
          git commit -m "Add v66 direct-byte deletion and PDF metadata"
          git push origin HEAD:candidate/v66-single-serialization