name: build-selector-hd-stable
on: push
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/selector-hd-stable
      - name: Generate and validate stable HD variant
        shell: bash
        run: |
          set -euo pipefail
          cp cloud-similar-selector-v68-core.html selector-nubes-hd-estable-core.html
          cp selector-nubes.html selector-nubes-hd-estable.html
          python - <<'PY'
          from pathlib import Path
          p=Path('selector-nubes-hd-estable-core.html')
          s=p.read_text()
          assert 'detailPixelBudget=28_000_000' in s
          s=s.replace('detailPixelBudget=28_000_000','detailPixelBudget=36_000_000',1)
          p.write_text(s)
          p=Path('selector-nubes-hd-estable.html')
          s=p.read_text()
          assert './cloud-similar-selector-v68-core.html?v=20260903-raster1' in s
          s=s.replace('./cloud-similar-selector-v68-core.html?v=20260903-raster1','./selector-nubes-hd-estable-core.html?v=20260903-hdstable1',1)
          s=s.replace('Selector de nubes v68 · guardado incremental + metadatos','Selector de nubes · preview HD estable',1)
          p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          for f in ['selector-nubes-hd-estable-core.html','selector-nubes-hd-estable.html']:
              for i,x in enumerate(re.findall(r'<script(?:\s+type="module")?>(.*?)</script>',Path(f).read_text(),re.S)):
                  Path(f'/tmp/{Path(f).stem}-{i}.mjs').write_text(x)
          PY
          for f in /tmp/selector-nubes-hd-estable-*.mjs; do node --check "$f"; done
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add selector-nubes-hd-estable-core.html selector-nubes-hd-estable.html
          git commit -m 'Add stable high-detail preview variant'
          git push origin HEAD:candidate/selector-hd-stable
