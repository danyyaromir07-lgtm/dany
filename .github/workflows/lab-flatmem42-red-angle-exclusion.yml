name: Roll back isolated flatmem42 to protected candidate
on:
  push:
    branches:
      - lab/v2.2-flatmem42-red-angle-exclusion
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v2.2-flatmem42-red-angle-exclusion
          fetch-depth: 0
      - name: Restore protected candidate files to isolated URL
        shell: bash
        run: |
          git fetch origin candidate/v2.2 gh-pages
          mkdir -p /tmp/flatmem42-safe
          git show origin/candidate/v2.2:lab-selector-v4/index.html > /tmp/flatmem42-safe/index.html
          git show origin/candidate/v2.2:lab-selector-v4/selector-nubes-multistream-core.html > /tmp/flatmem42-safe/selector-nubes-multistream-core.html
          grep -Fq "flatmem20" /tmp/flatmem42-safe/index.html
          grep -Fq "function blackCloudSafe" /tmp/flatmem42-safe/selector-nubes-multistream-core.html
          grep -Fq "saveToBuffer('compress')" /tmp/flatmem42-safe/selector-nubes-multistream-core.html
          git checkout gh-pages
          rm -rf lab-selector-flatmem42
          mkdir -p lab-selector-flatmem42
          cp /tmp/flatmem42-safe/* lab-selector-flatmem42/
          git add lab-selector-flatmem42
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git commit -m "Rollback isolated flatmem42 URL to protected V2.2 candidate"
          git push origin gh-pages
