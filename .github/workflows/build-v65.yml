name: build-v65
on: push
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/candidate/v65-control-baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v65-control-baseline
      - name: Generate and validate v65
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          core=Path('cloud-similar-selector-v64-core.html').read_text()
          core=core.replace('Selector de nubes v64 · borrado multirruta seguro','Selector de nubes v65 · verificación con copia control')
          old="const beforeVisual=classicVisual.length,beforeStruct=model.strokes.length,selectedVisual=visualSelected.length,expected=new Map();for(const v of classicVisual){if(visualSelected.includes(v))continue;const k=sig(v);expected.set(k,(expected.get(k)||0)+1)}const bagOK=a=>{if(a.length!==beforeVisual-selectedVisual)return false;const b=new Map();for(const v of a){const k=sig(v);b.set(k,(b.get(k)||0)+1)}if(b.size!==expected.size)return false;for(const[k,n]of expected)if(b.get(k)!==n)return false;return true};"
          new="const beforeVisual=classicVisual.length,beforeStruct=model.strokes.length,selectedVisual=visualSelected.length,selectedOrdinals=visualSelected.map(v=>Number(v._ordinal));if(selectedOrdinals.some(i=>!Number.isInteger(i)||i<0||i>=beforeVisual)||new Set(selectedOrdinals).size!==selectedVisual){status.textContent='Borrado bloqueado: los ordinales visuales de la selección no son estables.';return}let expected=null;const bagOK=a=>{if(!expected||a.length!==beforeVisual-selectedVisual)return false;const b=new Map();for(const v of a){const k=sig(v);b.set(k,(b.get(k)||0)+1)}if(b.size!==expected.size)return false;for(const[k,n]of expected)if(b.get(k)!==n)return false;return true};"
          assert old in core
          core=core.replace(old,new,1)
          anchor="const base=doc.saveToBuffer('garbage=4,compress=yes,appearance=yes'),outBase=new Uint8Array(U(base));let lastError='ninguna correspondencia superó la verificación exacta';"
          insert="""const base=doc.saveToBuffer('garbage=4,compress=yes,appearance=yes'),outBase=new Uint8Array(U(base));let ctrl=null,ctrl2=null,ctrlPage=null;try{ctrl=mupdf.PDFDocument.openDocument(outBase,'application/pdf');const cb=ctrl.saveToBuffer('garbage=4,compress=yes,appearance=yes'),controlOut=new Uint8Array(U(cb));ctrl.destroy();ctrl=null;ctrl2=mupdf.PDFDocument.openDocument(controlOut,'application/pdf');ctrlPage=ctrl2.loadPage(0);const controlVisual=collectVisual(ctrlPage),controlModel=deepModel(ctrlPage);if(!controlModel||controlModel.incomplete)throw new Error('la copia control no pudo reconstruir el modelo profundo');if(controlVisual.length!==beforeVisual)throw new Error('la copia control cambió el número de trazos visuales ('+beforeVisual+' → '+controlVisual.length+')');if(controlModel.strokes.length!==beforeStruct)throw new Error('la copia control cambió el número de operadores ('+beforeStruct+' → '+controlModel.strokes.length+')');const skip=new Set(selectedOrdinals);expected=new Map();for(let i=0;i<controlVisual.length;i++){if(skip.has(i))continue;const k=sig(controlVisual[i]);expected.set(k,(expected.get(k)||0)+1)}}catch(e){status.textContent='Borrado cancelado sin modificar el PDF activo: no se pudo crear una copia control estable · '+e.message;return}finally{try{ctrlPage?.destroy?.()}catch(_){}try{ctrl2?.destroy?.()}catch(_){}try{ctrl?.destroy?.()}catch(_){}}let lastError='ninguna correspondencia superó la verificación contra copia control';"""
          assert anchor in core
          core=core.replace(anchor,insert,1)
          core=core.replace("throw new Error('la geometría resultante no coincide exactamente con original menos azul')","throw new Error('la geometría resultante no coincide exactamente con copia control menos azul')")
          core=core.replace("ninguna pasó la verificación geométrica exacta · ","ninguna pasó la verificación contra copia control · ")
          Path('cloud-similar-selector-v65-core.html').write_text(core)
          wrap=Path('cloud-similar-selector-v64.html').read_text()
          wrap=wrap.replace('Selector de nubes v64 · borrado multirruta seguro','Selector de nubes v65 · verificación con copia control')
          wrap=wrap.replace('cloud-similar-selector-v64-core.html?v=20260902-multiroute1','cloud-similar-selector-v65-core.html?v=20260902-control1')
          Path('cloud-similar-selector-v65.html').write_text(wrap)
          scripts=re.findall(r'<script type="module">(.*?)</script>',core,re.S)
          assert len(scripts)==1
          Path('/tmp/v65.mjs').write_text(scripts[0])
          plain=re.findall(r'<script>(.*?)</script>',wrap,re.S)
          assert plain
          Path('/tmp/v65-wrapper.js').write_text('\n'.join(plain))
          assert 'copia control' in core
          assert 'controlVisual.length!==beforeVisual' in core
          assert 'cloud-similar-selector-v65-core.html?v=20260902-control1' in wrap
          PY
          node --check /tmp/v65.mjs
          node --check /tmp/v65-wrapper.js
          rm .github/workflows/build-v65.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-similar-selector-v65-core.html cloud-similar-selector-v65.html .github/workflows/build-v65.yml
          git commit -m "Add v65 control-baseline verification"
          git push origin HEAD:candidate/v65-control-baseline
