name: build-v65
on: push
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/candidate/v65-control-baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v65-control-baseline
      - name: Generate and validate v65
        shell: bash
        run: |
          echo '    ' | base64 -d > /tmp/build_v65.py
          python /tmp/build_v65.py
          node --check /tmp/v65.mjs
          node --check /tmp/v65-wrapper.js
          rm .github/workflows/build-v65.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-similar-selector-v65-core.html cloud-similar-selector-v65.html .github/workflows/build-v65.yml
          git commit -m "Add v65 control-baseline verification"
          git push origin HEAD:candidate/v65-control-baseline
