name: Real PDF text edit verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install MuPDF JS
        run: npm install --no-save mupdf@1.28.0
      - name: Verify revision cloud deletion on real fixture
        run: node tests/verify-revision-cloud.mjs
      - name: Run official fixture edit
        run: node tests/verify-real-pdf-edit.mjs
      - name: Upload edited PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: edited-pdf-fixture
          path: test-pdfs/UP3_LIM_E03_PLA_I59_02_ER_70_A34_7034-edited.pdf
