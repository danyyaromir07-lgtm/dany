name: Lab flat-memory V2.1 compression option key
on:
  push:
    branches: [lab/v2.1-flatmem6]
    paths:
      - '.github/scripts/patch-flatmem6-compression-key.py'
      - '.github/workflows/lab-flatmem6-compression-key.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v2.1-flatmem6
          fetch-depth: 0
      - name: Patch candidate
        run: python .github/scripts/patch-flatmem6-compression-key.py
      - name: Syntax and invariant checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('lab-selector-v4/selector-nubes-multistream-core.html').read_text()
          assert 'incremental,compress=flate,compression-effort=0' in s
          assert 'compress-effort=0' not in s
          assert 'ref.writeStream(buf)' in s
          assert 'flatCurveExact:true' in s
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/core.mjs').write_text(m.group(1))
          print('flatmem6 markers ok')
          PY
          node --check /tmp/core.mjs
          grep -q 'By: DanHL' lab-selector-v4/index.html
          grep -q '20260907-flatmem6' lab-selector-v4/index.html
      - name: Commit candidate on isolated branch
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html
          git commit -m 'Lab V2.1: correct MuPDF compression option key'
          git push origin HEAD:lab/v2.1-flatmem6
          cp lab-selector-v4/index.html /tmp/flatmem6-index.html
          cp lab-selector-v4/selector-nubes-multistream-core.html /tmp/flatmem6-core.html
      - name: Publish isolated lab path only
        shell: bash
        run: |
          git fetch origin gh-pages
          git switch -C gh-pages origin/gh-pages
          mkdir -p lab-selector-flatmem6
          cp /tmp/flatmem6-index.html lab-selector-flatmem6/index.html
          cp /tmp/flatmem6-core.html lab-selector-flatmem6/selector-nubes-multistream-core.html
          git add lab-selector-flatmem6
          git commit -m 'Publish isolated CloudForge flatmem6 compression-key candidate'
          git push origin gh-pages
