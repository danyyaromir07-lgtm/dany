name: build-selector-causal
on: push
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/selector-causal
      - name: Generate causal mapping viewer
        shell: bash
        run: |
          set -euo pipefail
          cp selector-nubes-diagnostico-core.html selector-nubes-causal-core.html
          cp selector-nubes-diagnostico.html selector-nubes-causal.html
          python tmp-build-causal.py
          for f in /tmp/selector-nubes-causal-*.mjs; do node --check "$f"; done
          grep -q 'buildCausalRoute' selector-nubes-causal-core.html
          grep -q 'RUTA CAUSAL COMPLETA' selector-nubes-causal-core.html
          grep -q 'selector-nubes-causal-core.html?v=20260903-causal1' selector-nubes-causal.html
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add selector-nubes-causal-core.html selector-nubes-causal.html
          git commit -m 'Add causal operator-to-visual mapping'
          git push origin HEAD:candidate/selector-causal
