name: tmp-inspect-widget-source
on:
  push:
    branches: [candidate/selector-widget-causal]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract widget source context
        run: python tmp-inspect-widget-source.py > tmp-widget-source.txt
      - name: Commit source context
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tmp-widget-source.txt
          git diff --cached --quiet || git commit -m "Temporary widget source context"
          git push
