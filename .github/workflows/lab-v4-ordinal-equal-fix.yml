name: Lab v4 equal count fix
on:
  push:
    branches: [lab/foxit-index-v4-realpdf-map]
    paths: [.github/workflows/lab-v4-ordinal-equal-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/foxit-index-v4-realpdf-map
          fetch-depth: 0
      - name: Patch core
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('selector-nubes-multistream-core.html')
          s=p.read_text()
          a="if(model.ordinalSafe&&model.strokes.length===classicVisual.length){structOrd=visualOrd.slice();targets=structOrd.map(i=>model.strokes[i])}else{"
          b="if(model.strokes.length===classicVisual.length){structOrd=visualOrd.slice();targets=structOrd.map(i=>model.strokes[i]);mapMode=model.ordinalSafe?'ordinal exacta':'ordinal por secuencia + verificación exacta'}else{"
          if a not in s:
              raise SystemExit('equal-count gate not found')
          s=s.replace(a,b,1)
          required=[
            'const broad=classicVisual.filter(v=>seedCompat(v,best))',
            'componentLike(g,seed)',
            'famVisual=[...new Set(famVisual)]',
            'expansión por componente'
          ]
          for q in required:
              if q not in s: raise SystemExit('selector regression: '+q)
          p.write_text(s)
          print('PATCH_OK')
          PY
      - name: Check JS
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          s=Path('selector-nubes-multistream-core.html').read_text()
          assert 'ordinal por secuencia + verificación exacta' in s
          assert 'if(model.ordinalSafe&&model.strokes.length===classicVisual.length)' not in s
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m
          js=re.sub(r'^import .*?;\s*','',m.group(1),count=1,flags=re.S)
          Path('/tmp/core.mjs').write_text(js)
          PY
          node --check /tmp/core.mjs
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selector-nubes-multistream-core.html
          git commit -m 'Lab: equal-count ordinal route with exact verification'
          git push origin HEAD:lab/foxit-index-v4-realpdf-map
      - name: Publish isolated lab
        shell: bash
        run: |
          cp selector-nubes-multistream-core.html /tmp/lab-core.html
          git fetch origin gh-pages
          git checkout -B lab-publish origin/gh-pages
          mkdir -p lab-selector-v4
          cp /tmp/lab-core.html lab-selector-v4/selector-nubes-multistream-core.html
          python3 <<'PY'
          from pathlib import Path
          p=Path('lab-selector-v4/index.html')
          s=p.read_text()
          start='selector-nubes-multistream-core.html?v='
          i=s.find(start)
          if i<0: raise SystemExit('iframe core src not found')
          j=s.find('"',i)
          s=s[:i]+start+'20260906-equalcount4'+s[j:]
          p.write_text(s)
          PY
          git add lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html
          git commit -m 'Publish isolated lab v4 equal-count route'
          git push origin HEAD:gh-pages
