name: Lab flatmem25 red cloud component
on:
  push:
    branches:
      - lab/v2.1-flatmem25-red-cloud-component
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v2.1-flatmem25-red-cloud-component
      - name: Patch red cloud selection
        run: python .github/scripts/patch-flatmem25-red.py
      - name: Validate invariants
        run: |
          grep -Fq "function redCloudComponentSafe" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "if(redSafe){famVisual=redSeed}" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "function blackPolylineComponentGroups" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "flatGiantExactModel" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "strictCompactBandedMap(visualSelected)" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "saveToBuffer('compress')" lab-selector-v4/selector-nubes-multistream-core.html
          grep -Fq "20260908-flatmem25" lab-selector-v4/index.html
          python -c "from pathlib import Path; s=Path('lab-selector-v4/selector-nubes-multistream-core.html').read_text(); a=s.index('<script type=\"module\">')+len('<script type=\"module\">'); b=s.index('</script>',a); Path('/tmp/cloudforge-flatmem25.mjs').write_text(s[a:b])"
          node --check /tmp/cloudforge-flatmem25.mjs
      - name: Commit candidate
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add lab-selector-v4/index.html lab-selector-v4/selector-nubes-multistream-core.html
          git commit -m "Lab V2.2: add conservative connected red cloud selection"
          git push origin HEAD:lab/v2.1-flatmem25-red-cloud-component
      - name: Publish isolated path
        run: |
          mkdir -p /tmp/pub25
          cp lab-selector-v4/index.html /tmp/pub25/index.html
          cp lab-selector-v4/selector-nubes-multistream-core.html /tmp/pub25/selector-nubes-multistream-core.html
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf lab-selector-flatmem25
          mkdir -p lab-selector-flatmem25
          cp /tmp/pub25/* lab-selector-flatmem25/
          git add lab-selector-flatmem25
          git commit -m "Publish isolated CloudForge flatmem25 red cloud component"
          git push origin gh-pages
