<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selector de nubes v9</title><style>body{margin:0;background:#111;color:#eee;font:14px system-ui}header{position:sticky;top:0;z-index:5;background:#181818;padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #444}button,input{font:inherit}button{padding:7px 10px}.wrap{padding:12px}.status{padding:10px;background:#20242a;border-radius:6px;margin-bottom:10px;white-space:pre-wrap}.viewer{display:inline-block;background:white}.viewer img{display:block;max-width:95vw;height:auto}.warn{color:#ffd27a}</style></head><body><header><button id="open">Abrir PDF editable</button><span id="mode">Sin PDF</span></header><div class="wrap"><div id="status" class="status">v9: detecta PDFs masivos antes de ejecutar el colector vectorial completo.</div><div class="viewer"><img id="page" alt=""></div></div><script type="module">
import * as mupdf from 'https://cdn.jsdelivr.net/npm/mupdf@1.28.0/dist/mupdf.js';
const $=s=>document.querySelector(s);let doc=null,handle=null,url=null;
const U=b=>b?.asUint8Array?.()||b,resolve=o=>{try{return o?.resolve?.()||o}catch(_){return o}};
function refs(page){try{const c=resolve(page.getObject()?.get?.('Contents'));if(!c)return[];if(c?.isStream?.())return[c];if(c?.isArray?.()){const a=[];for(let i=0;i<Number(c.length||0);i++){const r=resolve(c.get(i));if(r?.isStream?.())a.push(r)}return a}return[]}catch(_){return[]}}
async function loadFile(f,h){handle=h;try{doc?.destroy?.()}catch(_){}doc=mupdf.PDFDocument.openDocument(new Uint8Array(await f.arrayBuffer()),'application/pdf');const p=doc.loadPage(0),rr=refs(p);let raw=0;for(const r of rr){try{raw+=U(r.readRawStream()).length}catch(_){}}
const massive=raw>=5_000_000;$('#mode').textContent=massive?'Modo masivo':'Modo normal';const b=p.getBounds(),max=1500,scale=Math.min(1.2,max/Math.max(b[2]-b[0],b[3]-b[1]));const pm=p.toPixmap(mupdf.Matrix.scale(scale,scale),mupdf.ColorSpace.DeviceRGB,false,true),png=pm.asPNG();try{pm.destroy?.()}catch(_){}if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob([png],{type:'image/png'}));$('#page').src=url;if(massive){$('#status').innerHTML='<span class="warn">PDF masivo detectado.</span> /Contents comprimido≈'+(raw/1048576).toFixed(1)+' MB. v9 NO ejecutará page.run(Device) ni reconstruirá todos los trazos, para evitar que la pestaña se bloquee. La selección/eliminación masiva debe hacerse por streaming sobre /FlateDecode.';}else{$('#status').textContent='PDF dentro del umbral normal. Para selección/eliminación usa v8; v9 está centrada en impedir bloqueos de PDFs masivos.';}p.destroy?.()}
$('#open').addEventListener('click',async()=>{try{if(!('showOpenFilePicker'in window))throw new Error('Usa Chrome o Edge para abrir con permiso de escritura.');const [h]=await showOpenFilePicker({multiple:false,types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]});await loadFile(await h.getFile(),h)}catch(e){if(e?.name!=='AbortError')$('#status').textContent='Error: '+e.message}});
</script></body></html>
